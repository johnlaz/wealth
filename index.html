<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Financial Vault & Capital Allocator</title>

  <!-- PWA: manifest & installability -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="background-color" content="#0f172a">

  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">

  <!-- PWA: iOS / Android standalone install behavior -->

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <!-- Babel Compiler for In-Browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- File Parsing & PDF Generation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

      from { opacity: 0; transform: translateY(8px); }

    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
      #strategy-report-print, #strategy-report-print * {

</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { jsPDF } = window.jspdf;

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ============================================================
    // CONFIG
    // ============================================================
    const DB_NAME = 'FinancialVaultDB_V4';
    const DB_VERSION = 4;
    const STORES = {
      ACCOUNTS: 'financial_records',
      EXPENSES: 'expenses_records',
      DOCUMENTS: 'documents',
      CONTACTS: 'contacts',
      NETWORTH_HISTORY: 'networth_history'
    };

    const CATEGORIES = ['Housing/Mortgage', 'Utilities', 'Insurance', 'Subscriptions', 'Debt Service', 'Transportation', 'Lifestyle', 'Other'];

    const GROQ_ENDPOINT = 'https://api.groq.com/openai/v1/chat/completions';
    const DEFAULT_TEXT_MODEL = 'openai/gpt-oss-120b';
    const DEFAULT_VISION_MODEL = 'qwen/qwen3.6-27b';
    const DEFAULT_STALE_DAYS = 60;
    const BACKUP_STALE_DAYS = 30;

    // ============================================================
    // CLIENT-SIDE AUTO-CATEGORIZATION (used when no AI key is set)
    // ============================================================
    const autoCategorize = (name) => {
      const lower = name.toLowerCase();
      if (/mortgage|rent|housing|hoa/i.test(lower)) return 'Housing/Mortgage';
      if (/power|electric|water|gas|utility|internet|spectrum|comcast|duke|sewer/i.test(lower)) return 'Utilities';
      if (/insurance|geico|state farm|allstate|progressive|health|life/i.test(lower)) return 'Insurance';
      if (/netflix|hulu|spotify|apple|google|disney|subscription|adobe|cloud/i.test(lower)) return 'Subscriptions';
      if (/card|loan|chase|citi|discover|amex|capital one|interest/i.test(lower)) return 'Debt Service';
      if (/auto|car|fuel|gasoline|tesla|gmc|toyota|ford|toll/i.test(lower)) return 'Transportation';
      return 'Other';
    };

    // ============================================================
    // INDEXEDDB HELPERS
    // ============================================================
    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORES.ACCOUNTS)) db.createObjectStore(STORES.ACCOUNTS, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.EXPENSES)) db.createObjectStore(STORES.EXPENSES, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.DOCUMENTS)) db.createObjectStore(STORES.DOCUMENTS, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.CONTACTS)) db.createObjectStore(STORES.CONTACTS, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.NETWORTH_HISTORY)) db.createObjectStore(STORES.NETWORTH_HISTORY, { keyPath: 'date' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveDBItem = async (storeName, item) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const getDBItems = async (storeName) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const getDBItem = async (storeName, key) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const deleteDBItem = async (storeName, id) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const clearStore = async (storeName) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    // ============================================================
    // DATE / STALENESS HELPERS
    // ============================================================
    const isoToday = () => new Date().toISOString().slice(0, 10);

    const daysBetween = (isoDateStr) => {
      if (!isoDateStr) return null;
      const then = new Date(isoDateStr + 'T00:00:00');
      if (isNaN(then.getTime())) return null;
      const now = new Date();
      const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((nowMid - then) / 86400000);
    };

    const getStaleness = (statementDate, thresholdDays) => {
      const age = daysBetween(statementDate);
      if (age === null) return { known: false, isStale: true, age: null };
      return { known: true, isStale: age > thresholdDays, age };
    };

    const nextOccurrenceOfDay = (dueDay) => {
      const d = parseInt(dueDay, 10);
      if (!d || d < 1 || d > 31) return null;
      const now = new Date();
      let candidate = new Date(now.getFullYear(), now.getMonth(), d);
      if (candidate < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
        candidate = new Date(now.getFullYear(), now.getMonth() + 1, d);
      }
      return candidate;
    };

    const daysUntil = (date) => {
      if (!date) return null;
      const now = new Date();
      const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((date - nowMid) / 86400000);
    };

    const normalizeToISODate = (raw) => {
      if (!raw) return '';
      const d = new Date(raw);
      if (isNaN(d.getTime())) return '';
      return d.toISOString().slice(0, 10);
    };

    // ============================================================
    // GROQ AI HELPERS
    // ============================================================
    const isLikelyVisionModel = (modelId) => /vision|vl-|scout|maverick|qwen3\.6|qwen3\.8|multimodal/i.test(modelId);

    const fetchGroqModels = async (apiKey) => {
      const res = await fetch('https://api.groq.com/openai/v1/models', {
        headers: { 'Authorization': `Bearer ${apiKey}` }
      });
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`Groq API error ${res.status}: ${errText}`);
      }
      const data = await res.json();
      return (data.data || []).map(m => m.id).sort();
    };

    const parseJsonLoose = (str) => {
      if (!str) return null;
      try { return JSON.parse(str); } catch (e) {}
      const match = str.match(/\{[\s\S]*\}/);
      if (match) {
        try { return JSON.parse(match[0]); } catch (e) {}
      }
      return null;
    };

    const buildExtractionSystemPrompt = () => `You are a financial document classifier and data extractor. You will be given the text (or image) of a document a user uploaded to their personal finance vault. Identify every piece of information that can reasonably be assumed from the document, and classify it correctly so it can be routed to the right place in the app (account ledger vs. recurring budget expenses).

Return ONLY a raw JSON object (no markdown fences, no commentary) with these exact fields:
{
  "documentType": "statement" | "other",
  "institution": string,
  "accountType": "Checking" | "Savings" | "Credit Card" | "Mortgage" | "Auto Loan" | "Brokerage" | "Other",
  "category": "Asset" | "Liability",
  "accountNumberMasked": string,
  "balance": number,
  "interestRate": number,
  "statementDate": "YYYY-MM-DD" or "",
  "dueDay": number or null,
  "confidence": "high" | "medium" | "low",
  "recurringCharges": [ { "name": string, "amount": number, "category": one of [${CATEGORIES.join(', ')}], "dueDay": number or null } ],
  "linkedAssetLabel": string or "",
  "linkedAssetValue": number or null
}

Rules:
- "documentType" is "statement" only if this is a bank/credit/loan/brokerage account statement with a balance. Otherwise (insurance card, tax form, receipt, ID, unrelated document) use "other" and leave numeric fields at 0/null but still fill institution/accountType/category with your best guess if reasonable, or "Unknown"/"Other" if not.
- "category" reflects whether the account itself is an ASSET (checking, savings, brokerage — money the user has) or a LIABILITY (credit card, loan, mortgage — money the user owes). Use the account's own nature, not any single transaction's credit/debit direction.
- "statementDate" is the statement closing date / "as of" date / statement period end date printed on the document, in YYYY-MM-DD format. Leave "" if not found — do not guess today's date.
- "dueDay" is the day-of-month (1-31) this account's own payment/bill is due, if a due date is printed. Otherwise null.
- "recurringCharges" lists other fixed/recurring monthly obligations you can clearly identify inside this document — e.g. a subscription charge, a recurring auto-draft utility payment, an insurance premium, or a separate loan/mortgage payment line — that are distinct from this account's own balance. Do NOT list one-off purchases, individual retail transactions, or this account's own balance/payment as a recurring charge. Pick the closest matching category from the list given. Return an empty array if none are clearly recurring.
- "linkedAssetLabel" and "linkedAssetValue" only apply to secured debt (Mortgage, Auto Loan, or similar collateral-backed liability). If — and ONLY if — the document explicitly prints a current estimated/appraised/assessed market value of the collateral (e.g. "Estimated Market Value", "Assessed Value"), set "linkedAssetLabel" to a short label like "Home Value" or "Vehicle Value" and "linkedAssetValue" to that number. Do NOT use the original loan amount, original purchase price, or original appraisal at origination — those are not current value. If no explicit current value is printed, leave "linkedAssetLabel" as "" and "linkedAssetValue" as null; do not guess or estimate a market value yourself.
- Assets (checking, savings, brokerage) are positive balances; liabilities (credit card, loan, mortgage) should have category "Liability".
- Output must be valid JSON and nothing else.`;

    const callGroq = async (apiKey, body) => {
      const res = await fetch(GROQ_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`Groq API error ${res.status}: ${errText}`);
      }
      const data = await res.json();
      const content = data && data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content
        : '';
      return parseJsonLoose(content);
    };

    const extractWithGroqText = async (fullText, apiKey, model) => {
      const truncated = fullText.slice(0, 14000);
      return callGroq(apiKey, {
        model: model || DEFAULT_TEXT_MODEL,
        temperature: 0.1,
        response_format: { type: 'json_object' },
        messages: [
          { role: 'system', content: buildExtractionSystemPrompt() },
          { role: 'user', content: `Document text:\n\n${truncated}` }
        ]
      });
    };

    const extractWithGroqVision = async (dataUrl, apiKey, model) => {
      return callGroq(apiKey, {
        model: model || DEFAULT_VISION_MODEL,
        temperature: 0.1,
        response_format: { type: 'json_object' },
        messages: [
          { role: 'system', content: buildExtractionSystemPrompt() },
          {
            role: 'user',
            content: [
              { type: 'text', text: 'Extract the fields from this document image.' },
              { type: 'image_url', image_url: { url: dataUrl } }
            ]
          }
        ]
      });
    };

    // ============================================================
    // REGEX FALLBACK EXTRACTION (used when no Groq key is set, or Groq call fails)
    // ============================================================
    const regexExtractFromText = (fullText) => {
      const balanceMatch = fullText.match(/(?:Total Amount Due|Statement Balance|New Balance|Ending Balance|Current Balance)[^\d]*\$?\s*([0-9,]+\.[0-9]{2})/i);
      const parsedBalance = balanceMatch ? parseFloat(balanceMatch[1].replace(/,/g, '')) : 0;

      const aprMatch = fullText.match(/(?:Annual Percentage Rate|APR|Interest Rate)[^\d]*([0-9]{1,2}\.[0-9]{1,2})%/i);
      const parsedAPR = aprMatch ? parseFloat(aprMatch[1]) : 0;

      const acctMatch = fullText.match(/(?:Account Number|Acct #|Ending in)[^\d]*(\*{3,4}[0-9]{4}|[0-9]{4})/i);
      const parsedAcct = acctMatch ? acctMatch[1] : '';

      const dateMatch = fullText.match(/(?:Statement Date|Statement Closing Date|Closing Date|Statement Period Ending|As of)[^\d\w]{0,15}([A-Za-z]+\s+\d{1,2},?\s+\d{4}|\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i);
      const statementDate = dateMatch ? normalizeToISODate(dateMatch[1]) : '';

      const dueDateMatch = fullText.match(/(?:Payment Due Date|Due Date)[^\d\w]{0,15}([A-Za-z]+\s+\d{1,2},?\s+\d{4}|\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i);
      let dueDay = null;
      if (dueDateMatch) {
        const d = new Date(dueDateMatch[1]);
        if (!isNaN(d.getTime())) dueDay = d.getDate();
      }

      const isLikelyCreditCardOrLoan = /credit|card|loan|mortgage|statement balance|total amount due/i.test(fullText) || parsedBalance > 500;

      return {
        documentType: 'statement',
        institution: '',
        accountType: isLikelyCreditCardOrLoan ? 'Credit Card' : 'Checking',
        category: isLikelyCreditCardOrLoan ? 'Liability' : 'Asset',
        accountNumberMasked: parsedAcct,
        balance: parsedBalance,
        interestRate: isLikelyCreditCardOrLoan ? parsedAPR : 0,
        statementDate,
        dueDay,
        confidence: 'low',
        recurringCharges: [],
        linkedAssetLabel: '',
        linkedAssetValue: null
      };
    };

    const buildWealthStrategySystemPrompt = () => `You are a careful, conservative personal wealth strategist reviewing a household's local financial snapshot (their own account balances, APRs, recurring expenses, and net worth history — all provided below as JSON). You are not a licensed financial advisor.

Return ONLY a raw JSON object (no markdown fences, no commentary) with these exact fields:
{
  "headline": string,
  "strengths": [string, ...],
  "risks": [string, ...],
  "strategies": [
    { "title": string, "priority": "high" | "medium" | "low", "rationale": string, "action": string, "estimatedImpact": string }
  ],
  "cashflowNotes": string
}

Rules:
- Base every observation strictly on the JSON data given to you. Do not invent accounts, balances, or figures not present in the data.
- "headline" is a one or two sentence plain-language summary of the household's overall financial position right now.
- "strengths" and "risks" are short, specific bullet observations (3-6 each) grounded in the actual numbers (e.g. specific APRs, specific category totals, specific cashflow figures).
- "strategies" is an ordered list of 3-6 concrete, actionable recommendations (debt payoff order, emergency fund sizing, high-yield cash sweep, expense category concerns, etc.), each with a clear priority.
- "cashflowNotes" should end with a brief plain-language disclaimer that this is not professional financial or tax advice and the user should confirm significant moves with a licensed advisor.
- Output must be valid JSON and nothing else.`;

    const normalizeRecurringCharges = (list) => {
      if (!Array.isArray(list)) return [];
      return list
        .filter(rc => rc && rc.name && parseFloat(rc.amount) > 0)
        .map((rc, idx) => ({
          uid: 'rc_' + Date.now() + '_' + idx,
          name: rc.name,
          amount: parseFloat(rc.amount) || 0,
          category: CATEGORIES.includes(rc.category) ? rc.category : autoCategorize(rc.name),
          dueDay: rc.dueDay || null,
          include: true
        }));
    };

    // SHA-256 (with a non-cryptographic fallback for insecure/older contexts where
    // SubtleCrypto isn't available). This is a local access gate, not encryption of
    // the vault's data — the hash is only ever compared against on this device.
    const sha256Hex = async (text) => {
      try {
        if (window.crypto && window.crypto.subtle) {
          const enc = new TextEncoder().encode(text);
          const buf = await window.crypto.subtle.digest('SHA-256', enc);
          return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) { /* fall through to the simple fallback below */ }
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      }
      return 'fb_' + Math.abs(hash).toString(16);
    };

    const fileToDataUrl = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    function App() {
      const [activeTab, setActiveTab] = useState('vault');
      const [records, setRecords] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [documents, setDocuments] = useState([]);
      const [contacts, setContacts] = useState([]);
      const [networthHistory, setNetworthHistory] = useState([]);
      const [monthlyIncome, setMonthlyIncome] = useState(10000);
      const [groqApiKey, setGroqApiKey] = useState('');
      const [textModel, setTextModel] = useState(DEFAULT_TEXT_MODEL);
      const [visionModel, setVisionModel] = useState(DEFAULT_VISION_MODEL);
      const [staleDays, setStaleDays] = useState(DEFAULT_STALE_DAYS);
      const [notes, setNotes] = useState('');
      const [parsing, setParsing] = useState(false);
      const [parseError, setParseError] = useState('');

      const [lastBackupAt, setLastBackupAt] = useState(() => {
        try { return localStorage.getItem('last_backup_at') || ''; } catch (e) { return ''; }
      });

      // PIN lock — read synchronously so a locked vault never flashes its data before the lock renders
      const [pinLockEnabled, setPinLockEnabled] = useState(() => {
        try { return localStorage.getItem('pin_lock_enabled') === 'true'; } catch (e) { return false; }
      });
      const [pinHash, setPinHash] = useState(() => {
        try { return localStorage.getItem('pin_hash') || ''; } catch (e) { return ''; }
      });
      const [isLocked, setIsLocked] = useState(() => {
        try { return localStorage.getItem('pin_lock_enabled') === 'true' && !!localStorage.getItem('pin_hash'); } catch (e) { return false; }
      });
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');
      const [showPinSetup, setShowPinSetup] = useState(false);
      const [newPinValue, setNewPinValue] = useState('');
      const [confirmPinValue, setConfirmPinValue] = useState('');
      const [pinSetupError, setPinSetupError] = useState('');

      // Toasts (replaces alert()) and a themed confirm dialog (replaces confirm())
      const [toasts, setToasts] = useState([]);
      const toastIdRef = useRef(0);
      const backupToastShownRef = useRef(false);

      const showToast = (type, message, duration = 4500) => {
        const id = ++toastIdRef.current;
        setToasts(prev => [...prev, { id, type, message }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, duration);
      };

      const dismissToast = (id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
      };

      const [confirmModal, setConfirmModal] = useState(null);

      const requestConfirm = ({ title, message, confirmLabel = 'Confirm', danger = false, onConfirm }) => {
        setConfirmModal({ title, message, confirmLabel, danger, onConfirm });
      };

      const handleConfirmModalConfirm = () => {
        if (confirmModal && confirmModal.onConfirm) confirmModal.onConfirm();
        setConfirmModal(null);
      };

      const handleConfirmModalCancel = () => setConfirmModal(null);

      const [strategyReport, setStrategyReport] = useState(null);
      const [strategyLoading, setStrategyLoading] = useState(false);
      const [strategyError, setStrategyError] = useState('');

      const [availableModels, setAvailableModels] = useState([]);
      const [modelsFetching, setModelsFetching] = useState(false);
      const [modelsFetchError, setModelsFetchError] = useState('');

      const [installPromptEvent, setInstallPromptEvent] = useState(null);
      const [isAppInstalled, setIsAppInstalled] = useState(false);

      const replaceInputRef = useRef(null);
      const [replaceTargetAccountId, setReplaceTargetAccountId] = useState(null);

      // FILTER STATES FOR EXPENSES
      const [expenseCategoryFilter, setExpenseCategoryFilter] = useState('All');
      const [expenseSearchQuery, setExpenseSearchQuery] = useState('');

      // MODALS
      const [pendingParsedData, setPendingParsedData] = useState(null);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [viewingDocument, setViewingDocument] = useState(null);

      const [form, setForm] = useState({
        institution: '',
        accountType: 'Checking',
        category: 'Asset',
        accountNumberMasked: '',
        balance: '',
        interestRate: '0',
        linkedAssetLabel: '',
        linkedAssetValue: ''
      });

      const [expForm, setExpForm] = useState({
        name: '',
        category: 'Housing/Mortgage',
        amount: '',
        dueDay: '1',
        autoPay: true
      });
      const [editingExpenseId, setEditingExpenseId] = useState(null);

      const [contactForm, setContactForm] = useState({
        name: '', role: '', phone: '', email: '', notes: ''
      });
      const [editingContactId, setEditingContactId] = useState(null);

      useEffect(() => {
        loadAllData();
        const savedNotes = localStorage.getItem('executor_notes');
        const savedIncome = localStorage.getItem('monthly_income');
        const savedKey = localStorage.getItem('groq_api_key');

        const savedVisionModel = localStorage.getItem('groq_vision_model');

        const file = e.target.files[0];
        if (!file) return;

        setParseError('');

        const fileNameClean = file.name.replace(/\.[^/.]+$/, "").toUpperCase();
        const isCSV = file.type === 'text/csv' || file.name.endsWith('.csv');
        const isPDF = file.type === 'application/pdf' || file.name.endsWith('.pdf');
        const isImage = file.type.startsWith('image/');

        try {
          if (isCSV) {
            const dataUrl = await fileToDataUrl(file);
            Papa.parse(file, {
              complete: (results) => {
                let detectedBalance = 0;
                let latestDate = '';
                results.data.forEach((row) => {
                  Object.values(row).forEach((v) => {
                    const num = parseFloat(v);
                    if (!isNaN(num) && num > 0 && num > detectedBalance) detectedBalance = num;
                    if (typeof v === 'string' && /\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(v)) {
                      const iso = normalizeToISODate(v);
                      if (iso && (!latestDate || iso > latestDate)) latestDate = iso;
                    }
                  });
                });

                setPendingParsedData({
                  fileName: file.name,
                  existingAccountId: existingAccountId || null,
                  documentId: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).documentId : null,
                  newFile: { fileName: file.name, mimeType: file.type || 'text/csv', dataUrl },
                  documentType: 'statement',
                  institution: fileNameClean,
                  accountType: 'Credit Card',
                  category: 'Liability',
                  accountNumberMasked: 'Parsed CSV',
                  balance: detectedBalance || 0,
                  interestRate: 19.99,
                  statementDate: latestDate,
                  notes: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).notes || '' : '',
                  recurringCharges: [],
                  linkedAssetLabel: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetLabel || '' : '',
                  linkedAssetValue: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetValue || '' : ''
                });
                setParsing(false);
              }
            });
          } else if (isPDF) {
            const dataUrl = await fileToDataUrl(file);
            const arrayBuf = await file.arrayBuffer();
            const typedArray = new Uint8Array(arrayBuf);
            const pdf = await pdfjsLib.getDocument(typedArray).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              fullText += textContent.items.map((item) => item.str).join(' ') + ' ';
            }

            let extracted = null;
            if (groqApiKey) {
              try {
                extracted = await extractWithGroqText(fullText, groqApiKey, textModel);
              } catch (err) {
                console.error('Groq extraction failed, falling back to regex:', err);
                setParseError('AI parsing failed (' + err.message + '). Falling back to basic extraction — please double-check the fields below. If this says a model doesn\'t exist or isn\'t accessible, go to Settings and use "Fetch Models" to pick one your key can actually use.');
              }
            }
            if (!extracted) extracted = regexExtractFromText(fullText);

            setPendingParsedData({
              fileName: file.name,
              existingAccountId: existingAccountId || null,
              documentId: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).documentId : null,
              newFile: { fileName: file.name, mimeType: 'application/pdf', dataUrl },
              documentType: extracted.documentType || 'statement',
              institution: extracted.institution || fileNameClean,
              accountType: extracted.accountType || 'Checking',
              category: extracted.category || 'Asset',
              accountNumberMasked: extracted.accountNumberMasked || '',
              balance: extracted.balance || 0,
              interestRate: extracted.interestRate || 0,
              statementDate: extracted.statementDate || '',
              dueDay: extracted.dueDay || null,
              notes: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).notes || '' : '',
              recurringCharges: normalizeRecurringCharges(extracted.recurringCharges),
              linkedAssetLabel: extracted.linkedAssetLabel || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetLabel || '' : ''),
              linkedAssetValue: extracted.linkedAssetValue || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetValue || '' : '')
            });
            setParsing(false);
          } else if (isImage) {
            const dataUrl = await fileToDataUrl(file);
            let extracted = null;
            if (groqApiKey) {
              try {
                extracted = await extractWithGroqVision(dataUrl, groqApiKey, visionModel);
              } catch (err) {
                console.error('Groq vision extraction failed:', err);
                setParseError('AI image parsing failed (' + err.message + '). Enter the details manually below — the image is still saved as a document. If this says a model doesn\'t exist or isn\'t accessible, go to Settings and use "Fetch Models" to pick one your key can actually use.');
              }
            } else {
              setParseError('No Groq API key set, so this image could not be auto-read. Add a key in Settings, or enter the details manually below — the image is still saved as a document.');
            }
            if (!extracted) {
              extracted = {
                documentType: 'other',
                institution: fileNameClean,
                accountType: 'Checking',
                category: 'Asset',
                accountNumberMasked: '',
                balance: 0,
                interestRate: 0,
                statementDate: '',
                dueDay: null
              };
            }

            setPendingParsedData({
              fileName: file.name,
              existingAccountId: existingAccountId || null,
              documentId: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).documentId : null,
              newFile: { fileName: file.name, mimeType: file.type, dataUrl },
              documentType: extracted.documentType || 'other',
              institution: extracted.institution || fileNameClean,
              accountType: extracted.accountType || 'Checking',
              category: extracted.category || 'Asset',
              accountNumberMasked: extracted.accountNumberMasked || '',
              balance: extracted.balance || 0,
              interestRate: extracted.interestRate || 0,
              statementDate: extracted.statementDate || '',
              notes: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).notes || '' : '',
              recurringCharges: normalizeRecurringCharges(extracted.recurringCharges),
              linkedAssetLabel: extracted.linkedAssetLabel || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetLabel || '' : ''),
              linkedAssetValue: extracted.linkedAssetValue || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetValue || '' : '')
            });
            setParsing(false);
          } else {
            showToast('error', 'Unsupported file type. Please upload a PDF, CSV, or image (JPG/PNG).');
            setParsing(false);
          }
        } catch (err) {
          console.error('Error handling upload:', err);
          setParseError('Could not process this file: ' + err.message);
          setParsing(false);
        } finally {
          e.target.value = '';
        }
      };

      const triggerReplaceUpload = (accountId) => {
        setReplaceTargetAccountId(accountId);
        if (replaceInputRef.current) replaceInputRef.current.click();
      };

      const handleReplaceFileSelected = (e) => {
        handleFileUpload(e, replaceTargetAccountId);
        setReplaceTargetAccountId(null);
      };

      // ---------------- DERIVED DATA ----------------
      const totalAssets = records.filter(r => r.category === 'Asset').reduce((acc, r) => acc + r.balance, 0)
        + records.reduce((acc, r) => acc + (parseFloat(r.linkedAssetValue) || 0), 0);
      const totalLiabilities = records.filter(r => r.category !== 'Asset').reduce((acc, r) => acc + r.balance, 0);
      const netWorth = totalAssets - totalLiabilities;
      const linkedAssetTotal = records.reduce((acc, r) => acc + (parseFloat(r.linkedAssetValue) || 0), 0);
      const totalFixedExpenses = expenses.reduce((acc, e) => acc + e.amount, 0);
      const monthlyNetCashflow = monthlyIncome - totalFixedExpenses;

      const filteredExpenses = expenses.filter(exp => {
        const matchesCat = expenseCategoryFilter === 'All' || exp.category === expenseCategoryFilter;
        const matchesQuery = exp.name.toLowerCase().includes(expenseSearchQuery.toLowerCase());
        return matchesCat && matchesQuery;
      });

      const highInterestDebts = records.filter(r => r.category !== 'Asset' && r.interestRate >= 10);
      const liquidCash = records.filter(r => r.category === 'Asset' && r.interestRate < 2);

      const staleAccounts = records
        .map(r => ({ ...r, staleness: getStaleness(r.statementDate, staleDays) }))
        .filter(r => r.staleness.isStale)
        .sort((a, b) => (b.staleness.age || 9999) - (a.staleness.age || 9999));

      const upcomingBills = expenses
        .map(exp => {
          const nextDate = nextOccurrenceOfDay(exp.dueDay);
          return { ...exp, nextDate, daysUntil: daysUntil(nextDate) };
        })
        .filter(exp => exp.nextDate && exp.daysUntil <= 14)
        .sort((a, b) => a.daysUntil - b.daysUntil);

      const dueSoonTotal = upcomingBills.filter(b => b.daysUntil <= 7).reduce((a, b) => a + b.amount, 0);

      const getDocumentForAccount = (accountId) => documents.find(d => d.accountId === accountId);

      // Continuity readiness checklist
      const accountsWithDocs = records.filter(r => r.documentId).length;
      const accountsCurrent = records.filter(r => !getStaleness(r.statementDate, staleDays).isStale).length;
      const backupAgeDays = lastBackupAt ? daysBetween(lastBackupAt.slice(0, 10)) : null;
      const isBackupStale = backupAgeDays === null || backupAgeDays > BACKUP_STALE_DAYS;
      const readinessItems = [
        { label: 'Executor / handoff notes written', done: notes.trim().length > 0 },
        { label: 'At least one key contact added', done: contacts.length > 0 },
        { label: `Accounts with a document on file (${accountsWithDocs}/${records.length || 0})`, done: records.length > 0 && accountsWithDocs === records.length },
        { label: `Accounts with a current statement (${accountsCurrent}/${records.length || 0})`, done: records.length > 0 && accountsCurrent === records.length },
        { label: backupAgeDays === null ? 'No backup ever exported' : `Backup exported ${backupAgeDays} day(s) ago`, done: !isBackupStale }
      ];

      // ---------------- PDF EXPORT ----------------
      const generateExecutorPDF = () => {
        const doc = new jsPDF();

        doc.setFontSize(20);
        doc.text('OFFLINE ESTATE, BUDGET & FINANCIAL SNAPSHOT', 14, 20);
        doc.setFontSize(10);
        doc.text(`Generated: ${new Date().toLocaleString()} | Client-Side Vault`, 14, 27);
        doc.line(14, 30, 196, 30);

        let y = 40;
        doc.setFontSize(14);
        doc.text('Executor & Settlement Instructions', 14, y);
        y += 7;
        doc.setFontSize(10);
        const splitNotes = doc.splitTextToSize(notes || 'No specific executor instructions provided.', 180);
        doc.text(splitNotes, 14, y);
        y += (splitNotes.length * 5) + 8;

        if (contacts.length > 0) {
          if (y > 250) { doc.addPage(); y = 20; }
          doc.setFontSize(14);
          doc.text('Key Contacts', 14, y);
          y += 7;
          doc.setFontSize(9);
          contacts.forEach(c => {
            if (y > 275) { doc.addPage(); y = 20; }
            doc.text(`${c.name}${c.role ? ' (' + c.role + ')' : ''} — ${c.phone || ''} ${c.email || ''}`, 14, y);
            y += 5;
          });
          y += 6;
        }

        if (y > 250) { doc.addPage(); y = 20; }
        doc.setFontSize(14);
        doc.text('Account Ledger & Strategic Balance', 14, y);
        y += 8;

        doc.setFontSize(8);
        doc.text('Institution', 14, y);
        doc.text('Type', 55, y);
        doc.text('Acct #', 82, y);
        doc.text('APR', 108, y);
        doc.text('Balance', 128, y);
        doc.text('Stmt Date', 155, y);
        doc.text('Doc?', 182, y);
        y += 4;
        doc.line(14, y, 196, y);
        y += 6;

        let totalAssetsPdf = 0;
        let totalLiabilitiesPdf = 0;

        records.forEach((rec) => {
          if (y > 270) { doc.addPage(); y = 20; }
          doc.text(String(rec.institution).slice(0, 22), 14, y);
          doc.text(rec.accountType, 55, y);
          doc.text(rec.accountNumberMasked || 'N/A', 82, y);
          doc.text(`${rec.interestRate}%`, 108, y);
          doc.text(`$${rec.balance.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 128, y);
          doc.text(rec.statementDate || 'Unknown', 155, y);
          doc.text(rec.documentId ? 'Yes' : 'No', 182, y);

          if (rec.category === 'Asset') totalAssetsPdf += rec.balance;
          else totalLiabilitiesPdf += rec.balance;

          y += 6;

          const linkedVal = parseFloat(rec.linkedAssetValue) || 0;
          if (linkedVal > 0) {
            if (y > 270) { doc.addPage(); y = 20; }
            const equity = linkedVal - rec.balance;
            doc.setFontSize(7);
            doc.text(`   ↳ ${rec.linkedAssetLabel || 'Asset Value'}: $${linkedVal.toLocaleString('en-US', { minimumFractionDigits: 2 })}  |  Equity: $${equity.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 14, y);
            doc.setFontSize(8);
            totalAssetsPdf += linkedVal;
            y += 5;
          }
        });

        const accountsWithNotes = records.filter(r => r.notes && r.notes.trim());
        if (accountsWithNotes.length > 0) {
          y += 4;
          if (y > 260) { doc.addPage(); y = 20; }
          doc.setFontSize(11);
          doc.text('Account Notes', 14, y);
          y += 6;
          doc.setFontSize(8);
          accountsWithNotes.forEach(r => {
            if (y > 275) { doc.addPage(); y = 20; }
            const lines = doc.splitTextToSize(`${r.institution}: ${r.notes}`, 180);
            doc.text(lines, 14, y);
            y += lines.length * 4 + 2;
          });
        }

        y += 4;
        if (y > 260) { doc.addPage(); y = 20; }
        doc.line(14, y, 196, y);
        y += 8;

        const totalFixedExpensesPdf = expenses.reduce((a, b) => a + b.amount, 0);

        doc.setFontSize(11);
        doc.text(`Total Liquid & Fixed Assets: $${totalAssetsPdf.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 14, y);
        y += 6;
        doc.text(`Total Debt Liabilities: $${totalLiabilitiesPdf.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 14, y);
        y += 6;
        doc.text(`Net Estate Settlement Value: $${(totalAssetsPdf - totalLiabilitiesPdf).toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 14, y);
        y += 6;
        doc.text(`Monthly Recurring Expenses: $${totalFixedExpensesPdf.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 14, y);
        y += 10;

        if (upcomingBills.length > 0) {
          if (y > 250) { doc.addPage(); y = 20; }
          doc.setFontSize(12);
          doc.text('Bills Due Within 14 Days', 14, y);
          y += 6;
          doc.setFontSize(9);
          upcomingBills.forEach(b => {
            if (y > 275) { doc.addPage(); y = 20; }
            doc.text(`${b.name} — $${b.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })} — due in ${b.daysUntil} day(s) (day ${b.dueDay})`, 14, y);
            y += 5;
          });
        }

        doc.save('Estate_Financial_Settlement_Snapshot.pdf');
      };

      // ---------------- WEALTH STRATEGY (GROQ GOALS REPORT) ----------------
      const generateWealthStrategy = async () => {
        if (!groqApiKey) {
          setStrategyError('Add a Groq API key in Settings to generate a wealth strategy report.');
          return;
        }
        setStrategyLoading(true);
        setStrategyError('');
        try {
          const payload = {
            monthlyIncome,
            monthlyNetCashflow,
            totalAssets,
            totalLiabilities,
            netWorth,
            accounts: records.map(r => ({
              institution: r.institution,
              type: r.accountType,
              category: r.category,
              balance: r.balance,
              interestRate: r.interestRate,
              statementAgeDays: getStaleness(r.statementDate, staleDays).age,
              linkedAssetLabel: r.linkedAssetLabel || undefined,
              linkedAssetValue: parseFloat(r.linkedAssetValue) || undefined,
              equity: parseFloat(r.linkedAssetValue) > 0 ? (parseFloat(r.linkedAssetValue) - r.balance) : undefined
            })),
            monthlyExpensesByCategory: CATEGORIES.map(c => ({
              category: c,
              total: expenses.filter(e => e.category === c).reduce((a, e) => a + e.amount, 0)
            })).filter(c => c.total > 0),
            netWorthHistory: networthHistory.slice(-12).map(h => ({ date: h.date, netWorth: h.netWorth }))
          };

          const result = await callGroq(groqApiKey, {
            model: textModel,
            temperature: 0.3,
            response_format: { type: 'json_object' },
            messages: [
              { role: 'system', content: buildWealthStrategySystemPrompt() },
              { role: 'user', content: JSON.stringify(payload) }
            ]
          });

          if (!result) throw new Error('Could not parse the AI response.');

          const report = { ...result, generatedAt: new Date().toISOString() };
          setStrategyReport(report);
          localStorage.setItem('wealth_strategy_report', JSON.stringify(report));
        } catch (err) {
          console.error('Wealth strategy generation failed:', err);
          setStrategyError('Report generation failed: ' + err.message + ' — if this says a model doesn\'t exist or isn\'t accessible, go to Settings and use "Fetch Models" to pick one your key can actually use.');
        } finally {
          setStrategyLoading(false);
        }
      };

      const generateStrategyPDF = () => {
        if (!strategyReport) return;
        const doc = new jsPDF();

        doc.setFontSize(18);
        doc.text('Wealth Strategy Report', 14, 20);
        doc.setFontSize(9);
        doc.text(`Generated: ${new Date(strategyReport.generatedAt).toLocaleString()}`, 14, 27);
        doc.line(14, 30, 196, 30);

        let y = 40;
        doc.setFontSize(12);
        const headlineLines = doc.splitTextToSize(strategyReport.headline || '', 180);
        doc.text(headlineLines, 14, y);
        y += headlineLines.length * 6 + 8;

        if (strategyReport.strengths && strategyReport.strengths.length) {
          if (y > 250) { doc.addPage(); y = 20; }
          doc.setFontSize(12);
          doc.text('Strengths', 14, y);
          y += 6;
          doc.setFontSize(9);
          strategyReport.strengths.forEach(s => {
            if (y > 270) { doc.addPage(); y = 20; }
            const lines = doc.splitTextToSize('• ' + s, 180);
            doc.text(lines, 14, y);
            y += lines.length * 5 + 2;
          });
          y += 4;
        }

        if (strategyReport.risks && strategyReport.risks.length) {
          if (y > 250) { doc.addPage(); y = 20; }
          doc.setFontSize(12);
          doc.text('Risks', 14, y);
          y += 6;
          doc.setFontSize(9);
          strategyReport.risks.forEach(s => {
            if (y > 270) { doc.addPage(); y = 20; }
            const lines = doc.splitTextToSize('• ' + s, 180);
            doc.text(lines, 14, y);
            y += lines.length * 5 + 2;
          });
          y += 4;
        }

        if (strategyReport.strategies && strategyReport.strategies.length) {
          if (y > 240) { doc.addPage(); y = 20; }
          doc.setFontSize(12);
          doc.text('Recommended Strategies', 14, y);
          y += 7;
          strategyReport.strategies.forEach((s, i) => {
            if (y > 255) { doc.addPage(); y = 20; }
            doc.setFontSize(10);
            doc.text(`${i + 1}. ${s.title || ''} [${(s.priority || 'medium').toUpperCase()}]`, 14, y);
            y += 5;
            doc.setFontSize(8);
            if (s.rationale) {
              const ratLines = doc.splitTextToSize(`Why: ${s.rationale}`, 178);
              if (y > 275) { doc.addPage(); y = 20; }
              doc.text(ratLines, 18, y);
              y += ratLines.length * 4 + 1;
            }
            if (s.action) {
              const actLines = doc.splitTextToSize(`Action: ${s.action}`, 178);
              if (y > 275) { doc.addPage(); y = 20; }
              doc.text(actLines, 18, y);
              y += actLines.length * 4 + 1;
            }
            if (s.estimatedImpact) {
              const impLines = doc.splitTextToSize(`Estimated impact: ${s.estimatedImpact}`, 178);
              if (y > 275) { doc.addPage(); y = 20; }
              doc.text(impLines, 18, y);
              y += impLines.length * 4 + 1;
            }
            y += 3;
          });
        }

        if (strategyReport.cashflowNotes) {
          if (y > 250) { doc.addPage(); y = 20; }
          doc.setFontSize(12);
          doc.text('Cashflow Notes', 14, y);
          y += 6;
          doc.setFontSize(8);
          const lines = doc.splitTextToSize(strategyReport.cashflowNotes, 180);
          doc.text(lines, 14, y);
        }

        doc.save('Wealth_Strategy_Report.pdf');
      };

      // ---------------- SMALL COMPONENTS ----------------
      const StaleBadge = ({ statementDate }) => {
        const s = getStaleness(statementDate, staleDays);
        if (!s.known) {
          return <span className="text-[10px] bg-slate-700 text-slate-400 px-1.5 py-0.5 rounded">No date on file</span>;
        }
        if (s.isStale) {
          return <span className="text-[10px] bg-rose-500/10 text-rose-400 px-1.5 py-0.5 rounded">{s.age}d old — update</span>;
        }
        return <span className="text-[10px] bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded">Current ({s.age}d)</span>;
      };

      const NetWorthChart = () => {
        if (networthHistory.length < 2) {
          return <p className="text-xs text-slate-400">Net worth trend will appear here once at least two days of vault activity are recorded.</p>;
        }
        const w = 100;
        const values = networthHistory.map(entry => entry.netWorth);
        const min = Math.min(...values);
        const max = Math.max(...values);
        const range = (max - min) || 1;
        const pts = networthHistory.map((entry, i) => {
          const x = (i / (networthHistory.length - 1)) * w;
          const yVal = 34 - ((entry.netWorth - min) / range) * 34;
          return `${x},${yVal}`;
        }).join(' ');
        const first = networthHistory[0];
        const last = networthHistory[networthHistory.length - 1];
        const delta = last.netWorth - first.netWorth;
        return (
          <div>
            <svg viewBox="0 0 100 34" className="w-full h-20" preserveAspectRatio="none">
              <polyline points={pts} fill="none" stroke={delta >= 0 ? '#34d399' : '#fb7185'} strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
            </svg>
            <div className="flex justify-between text-[10px] text-slate-400 mt-1">
              <span>{first.date}: ${first.netWorth.toLocaleString('en-US', { maximumFractionDigits: 0 })}</span>
              <span className={delta >= 0 ? 'text-emerald-400' : 'text-rose-400'}>
                {delta >= 0 ? '+' : ''}{delta.toLocaleString('en-US', { maximumFractionDigits: 0 })} since first snapshot
              </span>
              <span>{last.date}: ${last.netWorth.toLocaleString('en-US', { maximumFractionDigits: 0 })}</span>
            </div>
          </div>
        );
      };

      const toastStyles = {
        success: { border: 'border-emerald-500/40', bg: 'bg-emerald-950/95', text: 'text-emerald-200', icon: 'check-circle', iconColor: 'text-emerald-400' },
        error: { border: 'border-rose-500/40', bg: 'bg-rose-950/95', text: 'text-rose-200', icon: 'alert-circle', iconColor: 'text-rose-400' },
        warning: { border: 'border-amber-500/40', bg: 'bg-amber-950/95', text: 'text-amber-200', icon: 'alert-triangle', iconColor: 'text-amber-400' },
        info: { border: 'border-blue-500/40', bg: 'bg-blue-950/95', text: 'text-blue-200', icon: 'info', iconColor: 'text-blue-400' }
      };

      const toastContainer = (
        <div className="no-print fixed bottom-4 inset-x-4 sm:inset-x-auto sm:right-4 sm:w-96 z-[100] space-y-2 pointer-events-none">
          {toasts.map((t) => {
            const style = toastStyles[t.type] || toastStyles.info;
            return (
              <div key={t.id} className={`toast-item pointer-events-auto flex items-start gap-2.5 rounded-lg border ${style.border} ${style.bg} ${style.text} px-3.5 py-3 text-xs shadow-2xl`}>
                <i data-lucide={style.icon} className={`w-4 h-4 mt-0.5 shrink-0 ${style.iconColor}`}></i>
                <span className="flex-1">{t.message}</span>
                <button onClick={() => dismissToast(t.id)} className="text-current opacity-60 hover:opacity-100">✕</button>
              </div>
            );
          })}
        </div>
      );

      const confirmModalEl = confirmModal && (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-[110]">
          <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
            <div className="flex items-start gap-3">
              <div className={`p-2 rounded-lg shrink-0 ${confirmModal.danger ? 'bg-rose-500/10 text-rose-400' : 'bg-blue-500/10 text-blue-400'}`}>
                <i data-lucide={confirmModal.danger ? 'alert-triangle' : 'help-circle'} className="w-5 h-5"></i>
              </div>
              <div>
                <h3 className="text-sm font-bold text-slate-100">{confirmModal.title}</h3>
                <p className="text-xs text-slate-400 mt-1">{confirmModal.message}</p>
              </div>
            </div>
            <div className="flex justify-end gap-2">
              <button onClick={handleConfirmModalCancel} className="px-4 py-2 rounded-lg text-xs bg-slate-700 hover:bg-slate-600 text-slate-200">Cancel</button>
              <button onClick={handleConfirmModalConfirm} className={`px-4 py-2 rounded-lg text-xs font-medium text-white shadow-md ${confirmModal.danger ? 'bg-rose-600 hover:bg-rose-500' : 'bg-emerald-600 hover:bg-emerald-500'}`}>{confirmModal.confirmLabel}</button>
            </div>
          </div>
        </div>
      );

      if (isLocked) {
        return (
          <React.Fragment>
            {toastContainer}
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-900">
            <div className="bg-slate-800 border border-slate-700 rounded-xl p-8 max-w-sm w-full text-center space-y-4 shadow-2xl">
              <div className="mx-auto w-14 h-14 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
                <i data-lucide="lock" className="w-7 h-7"></i>
              </div>
              <div>
                <h1 className="text-base font-bold text-slate-100">Financial Vault Locked</h1>
                <p className="text-xs text-slate-400 mt-1">Enter your PIN to continue.</p>
              </div>
              <form onSubmit={handleUnlockSubmit} className="space-y-3">
                <input
                  type="password"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  autoFocus
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  className="w-full text-center tracking-[0.5em] bg-slate-900 border border-slate-700 rounded-lg px-3 py-3 text-lg text-slate-100 focus:outline-none focus:border-emerald-500"
                  placeholder="••••"
                />
                {pinError && <p className="text-xs text-rose-400">{pinError}</p>}
                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg text-sm font-medium transition">Unlock</button>
              </form>
              <details className="text-left">
                <summary className="text-[11px] text-slate-500 cursor-pointer hover:text-slate-400">Forgot your PIN?</summary>
                <p className="text-[10px] text-slate-500 mt-2">
                  Your vault data is safe — this PIN only gates this screen, it doesn't encrypt anything. To remove the lock without losing any data, open your browser's developer console on this page and run:
                </p>
                <code className="block bg-slate-900 rounded px-2 py-1 mt-1 text-[10px] text-slate-400 break-all">localStorage.removeItem('pin_lock_enabled')</code>
                <p className="text-[10px] text-slate-500 mt-1">then reload the page.</p>
              </details>
            </div>
          </div>
          </React.Fragment>
        );
      }

      return (
        <div className="p-6">
          {toastContainer}
          {confirmModalEl}
          <div className="max-w-6xl mx-auto space-y-6">

            {/* HEADER */}
            <header className="no-print flex flex-col md:flex-row md:items-center justify-between bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
              <div className="flex items-center space-x-3 mb-4 md:mb-0">
                <div className="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg border border-emerald-500/20">
                  <i data-lucide="shield" className="w-8 h-8"></i>
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-wide">Financial Vault & Capital Allocator</h1>
                  <p className="text-xs text-slate-400 flex items-center gap-1 mt-0.5">
                    <i data-lucide="lock" className="w-3 h-3 text-emerald-400"></i> Local Storage • Budgeting & Capital Flow
                  </p>
                </div>
              </div>
              <div className="flex gap-3">
                {installPromptEvent && !isAppInstalled && (
                  <button
                    onClick={handleInstallClick}
                    className="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-lg text-sm font-medium transition"
                    title="Install as an app"
                  >
                    <i data-lucide="download" className="w-4 h-4"></i> Install App
                  </button>
                )}
                {pinLockEnabled && (
                  <button
                    onClick={() => setIsLocked(true)}
                    className="flex items-center justify-center p-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg transition"
