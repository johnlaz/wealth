<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>html, body { background-color: #0f172a; }</style>
  <script>
    // Watchdog: this app loads several render-blocking CDN scripts in sequence
    // before it can mount (React, Babel-in-browser, pdf.js, etc.). If any one
    // of them stalls, the page just sits there with nothing painted. Rather
    // than make the user notice and manually refresh, auto-retry once.
    (function () {
      try {
        var alreadyRetried = sessionStorage.getItem('vault_auto_retry') === '1';
        setTimeout(function () {
          if (!window.__vaultMounted) {
            if (!alreadyRetried) {
              sessionStorage.setItem('vault_auto_retry', '1');
              window.location.reload();
            }
            // If we already auto-retried once and it STILL hasn't mounted,
            // stop trying — a real outage shouldn't reload forever.
          }
        }, 7000);
      } catch (e) { /* sessionStorage unavailable (e.g. private mode) — skip watchdog */ }
    })();
  </script>

<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { jsPDF } = window.jspdf;

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ============================================================
    // CONFIG
    // ============================================================
    const DB_NAME = 'FinancialVaultDB_V4';
    const DB_VERSION = 5;
    const STORES = {
      ACCOUNTS: 'financial_records',
      EXPENSES: 'expenses_records',
      DOCUMENTS: 'documents',
      CONTACTS: 'contacts',
      NETWORTH_HISTORY: 'networth_history',
      ACCOUNT_HISTORY: 'account_balance_history',
      GOALS: 'goals'
    };

    const CATEGORIES = ['Housing/Mortgage', 'Utilities', 'Insurance', 'Subscriptions', 'Debt Service', 'Transportation', 'Lifestyle', 'Other'];

    const HELP_CARDS = [
      {
        icon: 'shield',
        iconColor: 'text-emerald-400',
        title: 'Welcome to Financial Vault',
        body: [
          'Everything here — accounts, documents, budget, goals — lives only in this browser. No server, no account, no sync.',
          'AI-assisted statement parsing is optional and uses your own Groq API key, entered in Settings. Without a key, the app still works using simple offline parsing.',
          'This quick tour covers each tab. You can reopen it anytime from the ? button.'
        ]
      },
      {
        icon: 'database',
        iconColor: 'text-emerald-400',
        title: 'Asset & Liability Vault',
        body: [
          'Drop in a statement — PDF, CSV, or a photo — and it reads the institution, balance, APR, and statement date for you to confirm before saving.',
          'Every upload is stored so you can view or replace it later, and accounts flag themselves when their statement gets old.',

        ]
      },
      {
        icon: 'pie-chart',
        iconColor: 'text-amber-400',
        title: 'Budget & Expenses',
        body: [
          'Log recurring bills with a due day of the month — the dashboard shows what\'s due soon.',
          'Typing a bill name auto-suggests a category (rent, utilities, subscriptions, etc.).',
          'When a parsed statement reveals a recurring charge, you\'ll be offered a one-click way to add it here too.'
        ]
      },
      {
        icon: 'target',
        iconColor: 'text-blue-400',
        title: 'Goals',
        body: [
          'Set a savings target or a debt payoff goal. Link it to an account and progress tracks itself as that account\'s balance changes.',
          'No account to link? Track it manually — just update the current amount whenever you check in.',
          'Once there\'s a little history, you\'ll get a projected completion date based on the recent trend.'
        ]
      },
      {
        icon: 'trending-up',
        iconColor: 'text-emerald-400',
        title: 'Strategic Capital Allocation',
        body: [
          'A plain-math read of your accounts — no AI needed here.',
          'Flags high-interest debt worth targeting first, and idle cash sitting in low-yield accounts that could work harder.'
        ]
      },
      {
        icon: 'sparkles',
        iconColor: 'text-purple-400',
        title: 'Wealth Strategy & Advisor Chat',
        body: [
          'Generate an AI report on your whole financial picture: strengths, risks, and prioritized strategies to consider.',
          'Use "Discuss With Advisor" to ask follow-up questions — it discusses upside and downside for whatever you\'re weighing, grounded in your real numbers.',
          'Requires a Groq API key. Export the report to PDF or print it directly.'
        ]
      },
      {
        icon: 'life-buoy',
        iconColor: 'text-rose-400',
        title: 'Continuity Plan',
        body: [
          'Key contacts, per-account notes, and handoff instructions — everything someone else would need if they had to take this over.',
          'The readiness checklist shows what\'s actually in place, honestly.',
          'One click compiles it all into a settlement-ready PDF.'
        ]
      },
      {
        icon: 'settings',
        iconColor: 'text-slate-300',
        title: 'Settings & Your Data',
        body: [
          'A Groq API key is optional and unlocks AI parsing, recurring-charge detection, and the strategy report/chat.',
          'PIN lock (off by default) gates the app screen on this device — it\'s not encryption, just a lock screen.',
          'Export a JSON backup regularly — it\'s your only copy. This app can also be installed to your home screen and works offline.'
        ]
      }
    ];

    const GROQ_ENDPOINT = 'https://api.groq.com/openai/v1/chat/completions';
    const DEFAULT_TEXT_MODEL = 'openai/gpt-oss-120b';
    const DEFAULT_VISION_MODEL = 'qwen/qwen3.6-27b';
    const DEFAULT_STALE_DAYS = 60;
    const BACKUP_STALE_DAYS = 30;
    const APP_VERSION = 'finvault-v18';

    // ============================================================
    // CLIENT-SIDE AUTO-CATEGORIZATION (used when no AI key is set)
    // ============================================================
    const autoCategorize = (name) => {
      const lower = name.toLowerCase();
      if (/mortgage|rent|housing|hoa/i.test(lower)) return 'Housing/Mortgage';
      if (/power|electric|water|gas|utility|internet|spectrum|comcast|duke|sewer/i.test(lower)) return 'Utilities';
      if (/insurance|geico|state farm|allstate|progressive|health|life/i.test(lower)) return 'Insurance';
      if (/netflix|hulu|spotify|apple|google|disney|subscription|adobe|cloud/i.test(lower)) return 'Subscriptions';
      if (/card|loan|chase|citi|discover|amex|capital one|interest/i.test(lower)) return 'Debt Service';
      if (/auto|car|fuel|gasoline|tesla|gmc|toyota|ford|toll/i.test(lower)) return 'Transportation';
      return 'Other';
    };

    // ============================================================
    // INDEXEDDB HELPERS
    // ============================================================
    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORES.ACCOUNTS)) db.createObjectStore(STORES.ACCOUNTS, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.EXPENSES)) db.createObjectStore(STORES.EXPENSES, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.DOCUMENTS)) db.createObjectStore(STORES.DOCUMENTS, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.CONTACTS)) db.createObjectStore(STORES.CONTACTS, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.NETWORTH_HISTORY)) db.createObjectStore(STORES.NETWORTH_HISTORY, { keyPath: 'date' });
          if (!db.objectStoreNames.contains(STORES.ACCOUNT_HISTORY)) db.createObjectStore(STORES.ACCOUNT_HISTORY, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.GOALS)) db.createObjectStore(STORES.GOALS, { keyPath: 'id' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveDBItem = async (storeName, item) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const getDBItems = async (storeName) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const getDBItem = async (storeName, key) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const deleteDBItem = async (storeName, id) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const clearStore = async (storeName) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    // ============================================================
    // DATE / STALENESS HELPERS
    // ============================================================
    const isoToday = () => new Date().toISOString().slice(0, 10);

    const daysBetween = (isoDateStr) => {
      if (!isoDateStr) return null;
      const then = new Date(isoDateStr + 'T00:00:00');
      if (isNaN(then.getTime())) return null;
      const now = new Date();
      const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((nowMid - then) / 86400000);
    };

    const getStaleness = (statementDate, thresholdDays) => {
      const age = daysBetween(statementDate);
      if (age === null) return { known: false, isStale: true, age: null };
      return { known: true, isStale: age > thresholdDays, age };
    };

    const nextOccurrenceOfDay = (dueDay) => {
      const d = parseInt(dueDay, 10);
      if (!d || d < 1 || d > 31) return null;
      const now = new Date();
      let candidate = new Date(now.getFullYear(), now.getMonth(), d);
      if (candidate < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
        candidate = new Date(now.getFullYear(), now.getMonth() + 1, d);
      }
      return candidate;
    };

    const nextAnnualOccurrence = (dueMonth, dueDay) => {
      const m = parseInt(dueMonth, 10);
      const d = parseInt(dueDay, 10);
      if (!m || m < 1 || m > 12 || !d || d < 1 || d > 31) return null;
      const now = new Date();
      let candidate = new Date(now.getFullYear(), m - 1, d);
      if (candidate < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
        candidate = new Date(now.getFullYear() + 1, m - 1, d);
      }
      return candidate;
    };

    // Single entry point for "when is this expense next due" regardless of frequency
    const nextExpenseOccurrence = (exp) => {
      return (exp.frequency === 'annual')
        ? nextAnnualOccurrence(exp.dueMonth, exp.dueDay)
        : nextOccurrenceOfDay(exp.dueDay);
    };

    // What this expense costs per month on average — used for budget totals so an
    // annual bill doesn't look like it costs the same as a monthly one.
    const monthlyEquivalent = (exp) => {
      const amt = parseFloat(exp.amount) || 0;
      return exp.frequency === 'annual' ? amt / 12 : amt;
    };

    const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    const daysUntil = (date) => {
      if (!date) return null;
      const now = new Date();
      const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((date - nowMid) / 86400000);
    };

    const normalizeToISODate = (raw) => {
      if (!raw) return '';
      const d = new Date(raw);
      if (isNaN(d.getTime())) return '';
      return d.toISOString().slice(0, 10);
    };

    // Projects a goal's completion date from a simple linear trend across its history points.
    // historyPoints: [{ date: 'YYYY-MM-DD', value: number }] — any order, needs at least 2 spanning a few days.
    const estimateGoalCompletion = (goalType, currentValue, targetValue, historyPoints) => {
      const isSavings = goalType === 'savings';
      const alreadyReached = isSavings ? currentValue >= targetValue : currentValue <= targetValue;
      if (alreadyReached) return { text: 'Goal reached!', reached: true };

      if (!historyPoints || historyPoints.length < 2) {
        return { text: 'Add more balance history to project a completion date.', reached: false };
      }
      const sorted = [...historyPoints].sort((a, b) => a.date.localeCompare(b.date));
      const first = sorted[0];
      const last = sorted[sorted.length - 1];
      const firstDate = new Date(first.date + 'T00:00:00');
      const lastDate = new Date(last.date + 'T00:00:00');
      const daySpan = Math.round((lastDate - firstDate) / 86400000);
      if (daySpan < 3) {
        return { text: 'Add more balance history to project a completion date.', reached: false };
      }
      const ratePerDay = (last.value - first.value) / daySpan;
      const remaining = targetValue - currentValue;
      if (Math.abs(ratePerDay) < 0.01 || (remaining > 0) !== (ratePerDay > 0)) {
        return { text: 'Recent trend isn\'t moving toward this goal — no projection available.', reached: false };
      }
      const daysNeeded = remaining / ratePerDay;
      if (!isFinite(daysNeeded) || daysNeeded > 3650) {
        return { text: 'At the current pace, this is more than 10 years away.', reached: false };
      }
      const projected = new Date(Date.now() + daysNeeded * 86400000);
      return {
        text: `At the current pace, projected around ${projected.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}.`,
        date: projected.toISOString().slice(0, 10),
        reached: false
      };
    };

    // ============================================================
    // GROQ AI HELPERS
    // ============================================================
    const isLikelyVisionModel = (modelId) => /vision|vl-|scout|maverick|qwen3\.6|qwen3\.8|multimodal/i.test(modelId);

    const fetchGroqModels = async (apiKey) => {
      const res = await fetch('https://api.groq.com/openai/v1/models', {
        headers: { 'Authorization': `Bearer ${apiKey}` }
      });
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`Groq API error ${res.status}: ${errText}`);
      }
      const data = await res.json();
      return (data.data || []).map(m => m.id).sort();
    };

    const parseJsonLoose = (str) => {
      if (!str) return null;
      try { return JSON.parse(str); } catch (e) {}
      const match = str.match(/\{[\s\S]*\}/);
      if (match) {
        try { return JSON.parse(match[0]); } catch (e) {}
      }
      return null;
    };

    const buildExtractionSystemPrompt = () => `You are a financial document classifier and data extractor. You will be given the text (or image) of a document a user uploaded to their personal finance vault. Identify every piece of information that can reasonably be assumed from the document, and classify it correctly so it can be routed to the right place in the app (account ledger vs. recurring budget expenses).

Return ONLY a raw JSON object (no markdown fences, no commentary) with these exact fields:
{
  "documentType": "statement" | "other",
  "institution": string,
  "accountType": "Checking" | "Savings" | "Credit Card" | "Mortgage" | "Auto Loan" | "Brokerage" | "Other",
  "category": "Asset" | "Liability",
  "accountNumberMasked": string,
  "balance": number,
  "interestRate": number,
  "statementDate": "YYYY-MM-DD" or "",
  "dueDay": number or null,
  "confidence": "high" | "medium" | "low",
  "recurringCharges": [ { "name": string, "amount": number, "category": one of [${CATEGORIES.join(', ')}], "dueDay": number or null } ],
  "linkedAssetLabel": string or "",
  "linkedAssetValue": number or null
}

Rules:
- "documentType" is "statement" only if this is a bank/credit/loan/brokerage account statement with a balance. Otherwise (insurance card, tax form, receipt, ID, unrelated document) use "other" and leave numeric fields at 0/null but still fill institution/accountType/category with your best guess if reasonable, or "Unknown"/"Other" if not.
- "category" reflects whether the account itself is an ASSET (checking, savings, brokerage — money the user has) or a LIABILITY (credit card, loan, mortgage — money the user owes). Use the account's own nature, not any single transaction's credit/debit direction.
- "statementDate" is the statement closing date / "as of" date / statement period end date printed on the document, in YYYY-MM-DD format. Leave "" if not found — do not guess today's date.
- "dueDay" is the day-of-month (1-31) this account's own payment/bill is due, if a due date is printed. Otherwise null.
- "recurringCharges" lists other fixed/recurring monthly obligations you can clearly identify inside this document — e.g. a subscription charge, a recurring auto-draft utility payment, an insurance premium, or a separate loan/mortgage payment line — that are distinct from this account's own balance. Do NOT list one-off purchases, individual retail transactions, or this account's own balance/payment as a recurring charge. Pick the closest matching category from the list given. Return an empty array if none are clearly recurring.
- "linkedAssetLabel" and "linkedAssetValue" only apply to secured debt (Mortgage, Auto Loan, or similar collateral-backed liability). If — and ONLY if — the document explicitly prints a current estimated/appraised/assessed market value of the collateral (e.g. "Estimated Market Value", "Assessed Value"), set "linkedAssetLabel" to a short label like "Home Value" or "Vehicle Value" and "linkedAssetValue" to that number. Do NOT use the original loan amount, original purchase price, or original appraisal at origination — those are not current value. If no explicit current value is printed, leave "linkedAssetLabel" as "" and "linkedAssetValue" as null; do not guess or estimate a market value yourself.
- Assets (checking, savings, brokerage) are positive balances; liabilities (credit card, loan, mortgage) should have category "Liability".
- Output must be valid JSON and nothing else.`;

    const callGroqCompletion = async (apiKey, body) => {
      const res = await fetch(GROQ_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`Groq API error ${res.status}: ${errText}`);
      }
      const data = await res.json();
      return data && data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content
        : '';
    };

    const callGroq = async (apiKey, body) => {
      const content = await callGroqCompletion(apiKey, body);
      return parseJsonLoose(content);
    };

    // Raw conversational text — no JSON parsing — for the advisor chat
    const callGroqText = async (apiKey, body) => callGroqCompletion(apiKey, body);

    const extractWithGroqText = async (fullText, apiKey, model) => {
      const truncated = fullText.slice(0, 14000);
      return callGroq(apiKey, {
        model: model || DEFAULT_TEXT_MODEL,
        temperature: 0.1,
        response_format: { type: 'json_object' },
        messages: [
          { role: 'system', content: buildExtractionSystemPrompt() },
          { role: 'user', content: `Document text:\n\n${truncated}` }
        ]
      });
    };

    const extractWithGroqVision = async (dataUrl, apiKey, model) => {
      return callGroq(apiKey, {
        model: model || DEFAULT_VISION_MODEL,
        temperature: 0.1,
        response_format: { type: 'json_object' },
        messages: [
          { role: 'system', content: buildExtractionSystemPrompt() },
          {
            role: 'user',
            content: [
              { type: 'text', text: 'Extract the fields from this document image.' },
              { type: 'image_url', image_url: { url: dataUrl } }
            ]
          }
        ]
      });
    };

    // ============================================================
    // REGEX FALLBACK EXTRACTION (used when no Groq key is set, or Groq call fails)
    // ============================================================
    const regexExtractFromText = (fullText) => {
      const balanceMatch = fullText.match(/(?:Total Amount Due|Statement Balance|New Balance|Ending Balance|Current Balance)[^\d]*\$?\s*([0-9,]+\.[0-9]{2})/i);
      const parsedBalance = balanceMatch ? parseFloat(balanceMatch[1].replace(/,/g, '')) : 0;

      const aprMatch = fullText.match(/(?:Annual Percentage Rate|APR|Interest Rate)[^\d]*([0-9]{1,2}\.[0-9]{1,2})%/i);
      const parsedAPR = aprMatch ? parseFloat(aprMatch[1]) : 0;

      const acctMatch = fullText.match(/(?:Account Number|Acct #|Ending in)[^\d]*(\*{3,4}[0-9]{4}|[0-9]{4})/i);
      const parsedAcct = acctMatch ? acctMatch[1] : '';

      const dateMatch = fullText.match(/(?:Statement Date|Statement Closing Date|Closing Date|Statement Period Ending|As of)[^\d\w]{0,15}([A-Za-z]+\s+\d{1,2},?\s+\d{4}|\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i);
      const statementDate = dateMatch ? normalizeToISODate(dateMatch[1]) : '';

      const dueDateMatch = fullText.match(/(?:Payment Due Date|Due Date)[^\d\w]{0,15}([A-Za-z]+\s+\d{1,2},?\s+\d{4}|\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i);
      let dueDay = null;
      if (dueDateMatch) {
        const d = new Date(dueDateMatch[1]);
        if (!isNaN(d.getTime())) dueDay = d.getDate();
      }

      const isLikelyCreditCardOrLoan = /credit|card|loan|mortgage|statement balance|total amount due/i.test(fullText) || parsedBalance > 500;

      return {
        documentType: 'statement',
        institution: '',
        accountType: isLikelyCreditCardOrLoan ? 'Credit Card' : 'Checking',
        category: isLikelyCreditCardOrLoan ? 'Liability' : 'Asset',
        accountNumberMasked: parsedAcct,
        balance: parsedBalance,

    const buildBudgetImportSystemPrompt = () => `You are a data-mapping assistant. You'll be given the column headers and a sample of rows from a spreadsheet a user uploaded. It might be an actual budget (one row per recurring bill), or it might be a raw bank/card transaction export (one row per individual purchase, often with columns like Date, Label/Description/Partner, Amount, Running Balance). Handle both, and map each row to a normalized expense record no matter how the columns are labeled or ordered.

      "dueDay": number or null,
      "dueMonth": number or null,
      "skip": boolean
    }
  ]
}

Rules:
- Produce exactly one output row per input row, in the same order, even ones you'll mark to skip.
- "name" is the bill/expense name or description — this can come from a column literally called "Name", or just as often "Label", "Description", "Memo", "Partner", "Payee", "Merchant", or similar. Prefer a merchant/payee name over a generic transaction memo when both are present.

    const normalizeRecurringCharges = (list) => {
      if (!Array.isArray(list)) return [];
      return list
        .filter(rc => rc && rc.name && parseFloat(rc.amount) > 0)
        .map((rc, idx) => ({
          uid: 'rc_' + Date.now() + '_' + idx,
          name: rc.name,
          amount: parseFloat(rc.amount) || 0,
          category: CATEGORIES.includes(rc.category) ? rc.category : autoCategorize(rc.name),
          dueDay: rc.dueDay || null,
          include: true
        }));
    };

    // Fallback header-matching for spreadsheet budget import when no Groq key is set.
    // Fuzzy-matches common column header variants to the fields the app needs.
    const HEADER_PATTERNS = {
      name: /^(name|item|description|desc|bill|expense|payee|vendor|merchant|label|memo|reference|narrative|particulars|payee.?name)/i,
      amount: /(amount|cost|price|total|\$|payment)/i,
      category: /(category|type|group|class)/i,
      frequency: /(frequency|recurrence|cadence|billing)/i,
      dueDay: /(due.?day|day.?due|^day$)/i,
      dueMonth: /(due.?month)/i,
      dueDate: /(due.?date)/i
    };

    const detectColumn = (headers, pattern) => headers.find(h => pattern.test(String(h).trim()));

    // When no header matches a "name" pattern, don't blindly grab the first
    // column (it's frequently a Date or ID column in a raw transaction
    // export) — pick the first column whose actual values look like text.
    const detectTextColumn = (headers, rows) => {
      const sample = rows.slice(0, 10);
      for (const h of headers) {
        const nonEmpty = sample.map(r => String(r[h] ?? '').trim()).filter(Boolean);
        if (nonEmpty.length === 0) continue;
        const looksTextual = nonEmpty.every(v => isNaN(Number(v)) && isNaN(Date.parse(v)));
        if (looksTextual) return h;
      }
      return headers[0];
    };

    const heuristicMapBudgetRows = (rows) => {
      if (!rows || rows.length === 0) return [];
      const headers = Object.keys(rows[0]);
      const nameCol = detectColumn(headers, HEADER_PATTERNS.name) || detectTextColumn(headers, rows);
      const amountCol = detectColumn(headers, HEADER_PATTERNS.amount);
      const categoryCol = detectColumn(headers, HEADER_PATTERNS.category);
      const freqCol = detectColumn(headers, HEADER_PATTERNS.frequency);
      const dueDayCol = detectColumn(headers, HEADER_PATTERNS.dueDay);
      const dueMonthCol = detectColumn(headers, HEADER_PATTERNS.dueMonth);
      const dueDateCol = detectColumn(headers, HEADER_PATTERNS.dueDate); // only matches an explicit "due date" header, never a bare "Date" column

      return rows.map((row) => {
        const rawName = nameCol ? String(row[nameCol] || '').trim() : '';
        const rawAmount = amountCol ? String(row[amountCol] || '').replace(/[^0-9.\-]/g, '') : '';
        const amount = Math.abs(parseFloat(rawAmount) || 0); // bank exports often show outflows as negative — an expense amount should be positive
        let frequency = 'monthly';
        if (freqCol && /annual|year/i.test(String(row[freqCol] || ''))) frequency = 'annual';
        let dueDay = dueDayCol ? parseInt(row[dueDayCol], 10) : null;
        let dueMonth = dueMonthCol ? parseInt(row[dueMonthCol], 10) : null;
        if ((!dueDay || !dueMonth) && dueDateCol && row[dueDateCol]) {
          const rawDue = row[dueDateCol];
          const d = rawDue instanceof Date ? rawDue : new Date(rawDue);
          if (!isNaN(d.getTime())) {
            dueDay = dueDay || d.getDate();
            dueMonth = dueMonth || (d.getMonth() + 1);
          }
        }
        return {
          name: rawName,
          category: (categoryCol && CATEGORIES.includes(String(row[categoryCol]).trim())) ? String(row[categoryCol]).trim() : autoCategorize(rawName),
          amount,
          frequency,
          dueDay: dueDay || null,
          dueMonth: frequency === 'annual' ? (dueMonth || null) : null,
          skip: !rawName || !(amount > 0)
        };
      });
    };

    // SHA-256 (with a non-cryptographic fallback for insecure/older contexts where
    // SubtleCrypto isn't available). This is a local access gate, not encryption of
    // the vault's data — the hash is only ever compared against on this device.
    const sha256Hex = async (text) => {
      try {
        if (window.crypto && window.crypto.subtle) {
          const enc = new TextEncoder().encode(text);
          const buf = await window.crypto.subtle.digest('SHA-256', enc);
          return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) { /* fall through to the simple fallback below */ }
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      }
      return 'fb_' + Math.abs(hash).toString(16);
    };

      const handleFileUpload = async (e, existingAccountId) => {
        const file = e.target.files[0];
        if (!file) return;
        setParsing(true);
        setParseError('');

        const fileNameClean = file.name.replace(/\.[^/.]+$/, "").toUpperCase();
        const lowerName = file.name.toLowerCase();
        const isCSV = file.type === 'text/csv' || lowerName.endsWith('.csv');
        const isPDF = file.type === 'application/pdf' || lowerName.endsWith('.pdf');
        const isImage = file.type.startsWith('image/');
        const isSpreadsheet = lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls');

        try {
          if (isCSV) {
            const dataUrl = await fileToDataUrl(file);
            Papa.parse(file, {
              complete: (results) => {
                let detectedBalance = 0;
                let latestDate = '';
                results.data.forEach((row) => {
                  Object.values(row).forEach((v) => {
                    const num = parseFloat(v);
                    if (!isNaN(num) && num > 0 && num > detectedBalance) detectedBalance = num;
                    if (typeof v === 'string' && /\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(v)) {
                      const iso = normalizeToISODate(v);
                      if (iso && (!latestDate || iso > latestDate)) latestDate = iso;
                    }
                  });
                });

                setPendingParsedData({
                  fileName: file.name,
                  existingAccountId: existingAccountId || null,
                  documentId: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).documentId : null,
                  newFile: { fileName: file.name, mimeType: file.type || 'text/csv', dataUrl },
                  documentType: 'statement',
                  institution: fileNameClean,
                  accountType: 'Credit Card',
                  category: 'Liability',
                  accountNumberMasked: 'Parsed CSV',
                  balance: detectedBalance || 0,
                  interestRate: 19.99,
                  statementDate: latestDate,
                  notes: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).notes || '' : '',
                  recurringCharges: [],
                  linkedAssetLabel: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetLabel || '' : '',
                  linkedAssetValue: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetValue || '' : ''
                });
                setParsing(false);
              }
            });
          } else if (isPDF) {
            const dataUrl = await fileToDataUrl(file);
            const arrayBuf = await file.arrayBuffer();
            const typedArray = new Uint8Array(arrayBuf);
            const pdf = await pdfjsLib.getDocument(typedArray).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              fullText += textContent.items.map((item) => item.str).join(' ') + ' ';
            }

            let extracted = null;
            if (groqApiKey) {
              try {
                extracted = await extractWithGroqText(fullText, groqApiKey, textModel);
              } catch (err) {
                console.error('Groq extraction failed, falling back to regex:', err);
                setParseError('AI parsing failed (' + err.message + '). Falling back to basic extraction — please double-check the fields below. If this says a model doesn\'t exist or isn\'t accessible, go to Settings and use "Fetch Models" to pick one your key can actually use.');
              }
            }
            if (!extracted) extracted = regexExtractFromText(fullText);

            setPendingParsedData({
              fileName: file.name,
              existingAccountId: existingAccountId || null,
              documentId: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).documentId : null,
              newFile: { fileName: file.name, mimeType: 'application/pdf', dataUrl },
              documentType: extracted.documentType || 'statement',
              institution: extracted.institution || fileNameClean,
              accountType: extracted.accountType || 'Checking',
              category: extracted.category || 'Asset',
              accountNumberMasked: extracted.accountNumberMasked || '',
              balance: extracted.balance || 0,
              interestRate: extracted.interestRate || 0,
              statementDate: extracted.statementDate || '',
              dueDay: extracted.dueDay || null,
              notes: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).notes || '' : '',
              recurringCharges: normalizeRecurringCharges(extracted.recurringCharges),
              linkedAssetLabel: extracted.linkedAssetLabel || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetLabel || '' : ''),
              linkedAssetValue: extracted.linkedAssetValue || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetValue || '' : '')
            });
            setParsing(false);
          } else if (isImage) {
            const dataUrl = await fileToDataUrl(file);
            let extracted = null;
            if (groqApiKey) {
              try {
                extracted = await extractWithGroqVision(dataUrl, groqApiKey, visionModel);
              } catch (err) {
                console.error('Groq vision extraction failed:', err);
                setParseError('AI image parsing failed (' + err.message + '). Enter the details manually below — the image is still saved as a document. If this says a model doesn\'t exist or isn\'t accessible, go to Settings and use "Fetch Models" to pick one your key can actually use.');
              }
            } else {
              setParseError('No Groq API key set, so this image could not be auto-read. Add a key in Settings, or enter the details manually below — the image is still saved as a document.');
            }
            if (!extracted) {
              extracted = {
                documentType: 'other',
                institution: fileNameClean,
                accountType: 'Checking',
                category: 'Asset',
                accountNumberMasked: '',
                balance: 0,
                interestRate: 0,
                statementDate: '',
                dueDay: null
              };
            }

            setPendingParsedData({
              fileName: file.name,
              existingAccountId: existingAccountId || null,
              documentId: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).documentId : null,
              newFile: { fileName: file.name, mimeType: file.type, dataUrl },
              documentType: extracted.documentType || 'other',
              institution: extracted.institution || fileNameClean,
              accountType: extracted.accountType || 'Checking',
              category: extracted.category || 'Asset',
              accountNumberMasked: extracted.accountNumberMasked || '',
              balance: extracted.balance || 0,
              interestRate: extracted.interestRate || 0,
              statementDate: extracted.statementDate || '',
              notes: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).notes || '' : '',
              recurringCharges: normalizeRecurringCharges(extracted.recurringCharges),
              linkedAssetLabel: extracted.linkedAssetLabel || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetLabel || '' : ''),
              linkedAssetValue: extracted.linkedAssetValue || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetValue || '' : '')
            });
            setParsing(false);
          } else if (isSpreadsheet) {
            showToast('error', 'Excel files go in the Budget & Expenses tab — use "Import Budget Spreadsheet" there for multi-row budgets. This dropzone is for single-account statements (PDF, CSV, or a photo).');
            setParsing(false);

            showToast('error', 'Unsupported file type. Please upload a PDF, CSV, or image (JPG/PNG).');
            setParsing(false);

        } catch (err) {
          console.error('Error handling upload:', err);
          setParseError('Could not process this file: ' + err.message);

      const parseSpreadsheetToRows = (file) => {
        const lowerName = file.name.toLowerCase();
        const isCSV = file.type === 'text/csv' || lowerName.endsWith('.csv');
        const isSpreadsheet = lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls');

        if (isCSV) {
          return new Promise((resolve, reject) => {
            Papa.parse(file, {
              header: true,
              skipEmptyLines: true,
              complete: (results) => resolve(results.data),
              error: reject
            });
          });
        }
        if (isSpreadsheet) {
          return file.arrayBuffer().then((buf) => {
            const wb = XLSX.read(buf, { type: 'array', cellDates: true });
            const firstSheet = wb.Sheets[wb.SheetNames[0]];
            return XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
          });
        }
        return Promise.reject(new Error('That file doesn\'t look like a .csv, .xlsx, or .xls — please pick a budget spreadsheet.'));
      };

      const handleBudgetFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setBudgetImportLoading(true);
        setBudgetImportError('');

        try {
          const rows = await parseSpreadsheetToRows(file);
          const cleanRows = rows.filter(r => Object.values(r).some(v => String(v).trim() !== ''));
          if (cleanRows.length === 0) {
            setBudgetImportError('No rows found in that file.');
            setBudgetImportLoading(false);
            e.target.value = '';
            return;
          }

          let mapped = null;
          if (groqApiKey) {
            try {
              const headers = Object.keys(cleanRows[0]);
              const sample = cleanRows.slice(0, 200); // bound token usage on huge sheets
              const result = await callGroq(groqApiKey, {
                model: textModel,
                temperature: 0.1,
                response_format: { type: 'json_object' },
                messages: [
                  { role: 'system', content: buildBudgetImportSystemPrompt() },
                  { role: 'user', content: JSON.stringify({ headers, rows: sample }) }
                ]
              });
              if (result && Array.isArray(result.rows) && result.rows.length === sample.length) {
                mapped = result.rows;
              }
            } catch (err) {
              console.error('AI budget mapping failed, falling back to heuristic matching:', err);
              setBudgetImportError('AI column mapping failed (' + err.message + ') — used basic header matching instead. Please double-check the rows below.');
            }
          }
          if (!mapped) mapped = heuristicMapBudgetRows(cleanRows);

          const reviewRows = mapped.map((r, i) => ({
            uid: 'bi_' + Date.now() + '_' + i,
            name: r.name || '',
            category: CATEGORIES.includes(r.category) ? r.category : autoCategorize(r.name || ''),
            amount: r.amount || 0,
            frequency: r.frequency === 'annual' ? 'annual' : 'monthly',
            dueDay: r.dueDay || '',
            dueMonth: r.dueMonth || '',
            include: !r.skip && !!r.name && parseFloat(r.amount) > 0
          }));

          setBudgetImportRows(reviewRows);
          setBudgetImportOpen(true);
        } catch (err) {
          console.error('Failed to parse budget file:', err);
          setBudgetImportError('Could not read that file: ' + err.message);
        } finally {
          setBudgetImportLoading(false);
          e.target.value = '';
        }
      };

      const handleConfirmBudgetImport = async () => {
        const included = budgetImportRows.filter(r => r.include && r.name && parseFloat(r.amount) > 0);
        for (let i = 0; i < included.length; i++) {
          const r = included[i];
          await saveDBItem(STORES.EXPENSES, {
            id: 'exp_' + Date.now() + '_' + i,
            name: r.name,

            amount: parseFloat(r.amount) || 0,
            frequency: r.frequency === 'annual' ? 'annual' : 'monthly',
            dueDay: parseInt(r.dueDay, 10) || 1,
            dueMonth: r.frequency === 'annual' ? (parseInt(r.dueMonth, 10) || 1) : null,
            autoPay: true

        setBudgetImportRows([]);

      // ---------------- DERIVED DATA ----------------
      const totalAssets = records.filter(r => r.category === 'Asset').reduce((acc, r) => acc + r.balance, 0)

      const netWorth = totalAssets - totalLiabilities;

      // ---------------- PDF EXPORT ----------------

        doc.text(`Total Debt Liabilities: $${totalLiabilitiesPdf.toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 14, y);
        y += 6;
        doc.text(`Net Estate Settlement Value: $${(totalAssetsPdf - totalLiabilitiesPdf).toLocaleString('en-US', { minimumFractionDigits: 2 })}`, 14, y);
        y += 6;

            doc.text(`${b.name} — $${b.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })} — due in ${b.daysUntil} day(s) (${dueLabel})`, 14, y);
            y += 5;
          });
        }

        doc.save('Estate_Financial_Settlement_Snapshot.pdf');
      };

      // ---------------- WEALTH STRATEGY (GROQ GOALS REPORT) ----------------
      const buildFinancialSnapshot = () => ({
        monthlyIncome,
        monthlyNetCashflow,
        totalAssets,
        totalLiabilities,
        netWorth,
        accounts: records.map(r => ({
          institution: r.institution,
          type: r.accountType,
          category: r.category,
          balance: r.balance,
          interestRate: r.interestRate,
          statementAgeDays: getStaleness(r.statementDate, staleDays).age,
          linkedAssetLabel: r.linkedAssetLabel || undefined,
          linkedAssetValue: parseFloat(r.linkedAssetValue) || undefined,
          equity: parseFloat(r.linkedAssetValue) > 0 ? (parseFloat(r.linkedAssetValue) - r.balance) : undefined
        })),
        monthlyExpensesByCategory: CATEGORIES.map(c => ({
          category: c,
          total: expenses.filter(e => e.category === c).reduce((a, e) => a + monthlyEquivalent(e), 0)
        })).filter(c => c.total > 0),
        netWorthHistory: networthHistory.slice(-12).map(h => ({ date: h.date, netWorth: h.netWorth }))
      });

      const generateWealthStrategy = async () => {
        if (!groqApiKey) {
          setStrategyError('Add a Groq API key in Settings to generate a wealth strategy report.');
          return;
        }
        setStrategyLoading(true);
        setStrategyError('');
        try {
          const payload = buildFinancialSnapshot();

          const result = await callGroq(groqApiKey, {
            model: textModel,
            temperature: 0.3,
            response_format: { type: 'json_object' },
            messages: [
              { role: 'system', content: buildWealthStrategySystemPrompt() },
              { role: 'user', content: JSON.stringify(payload) }
            ]
          });

          if (!result) throw new Error('Could not parse the AI response.');

          const report = { ...result, generatedAt: new Date().toISOString() };
          setStrategyReport(report);
          localStorage.setItem('wealth_strategy_report', JSON.stringify(report));
        } catch (err) {
          console.error('Wealth strategy generation failed:', err);
          setStrategyError('Report generation failed: ' + err.message + ' — if this says a model doesn\'t exist or isn\'t accessible, go to Settings and use "Fetch Models" to pick one your key can actually use.');
        } finally {
          setStrategyLoading(false);
        }
      };

      const handleSendStrategyChat = async (e) => {
        e.preventDefault();
        const question = strategyChatInput.trim();
        if (!question || strategyChatLoading) return;

        if (!groqApiKey) {
          showToast('error', 'Add a Groq API key in Settings to use the advisor chat.');
          return;
        }

        const userMsg = { role: 'user', content: question };
        const updatedMessages = [...strategyChatMessages, userMsg];
        setStrategyChatMessages(updatedMessages);
        setStrategyChatInput('');
        setStrategyChatLoading(true);

        try {
          const contextPayload = { ...buildFinancialSnapshot(), strategyReport };
          const replyText = await callGroqText(groqApiKey, {
            model: textModel,
            temperature: 0.4,
            messages: [
              { role: 'system', content: buildAdvisorChatSystemPrompt(contextPayload) },
              ...updatedMessages
            ]
          });
          setStrategyChatMessages(prev => [...prev, { role: 'assistant', content: replyText || "I didn't get a usable response — try asking again." }]);
        } catch (err) {
          console.error('Advisor chat failed:', err);
          setStrategyChatMessages(prev => [...prev, { role: 'assistant', content: `Something went wrong reaching Groq: ${err.message}` }]);
        } finally {
          setStrategyChatLoading(false);
        }
      };

      const generateStrategyPDF = () => {

      // ---------------- SMALL COMPONENTS ----------------
      const StaleBadge = ({ statementDate }) => {
        const s = getStaleness(statementDate, staleDays);
        if (!s.known) {
          return <span className="text-[10px] bg-slate-700 text-slate-400 px-1.5 py-0.5 rounded">No date on file</span>;

        return <span className="text-[10px] bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded">Current ({s.age}d)</span>;

      const NetWorthChart = () => {
        if (networthHistory.length < 2) {
          return <p className="text-xs text-slate-400">Net worth trend will appear here once at least two days of vault activity are recorded.</p>;
        }
        const w = 100;
        const values = networthHistory.map(entry => entry.netWorth);
        const min = Math.min(...values);
        const max = Math.max(...values);
        const range = (max - min) || 1;
        const pts = networthHistory.map((entry, i) => {
          const x = (i / (networthHistory.length - 1)) * w;
          const yVal = 34 - ((entry.netWorth - min) / range) * 34;
          return `${x},${yVal}`;
        }).join(' ');
        const first = networthHistory[0];
        const last = networthHistory[networthHistory.length - 1];
        const delta = last.netWorth - first.netWorth;
        return (
          <div>
            <svg viewBox="0 0 100 34" className="w-full h-20" preserveAspectRatio="none">
              <polyline points={pts} fill="none" stroke={delta >= 0 ? '#34d399' : '#fb7185'} strokeWidth="1.5" vectorEffect="non-scaling-stroke" />

      };

      // Tiny inline sparkline for a single account's balance history — no labels, just the shape.
      const AccountSparkline = ({ accountId, desirableDirection = 'down' }) => {
        const points = accountHistory.filter(h => h.accountId === accountId).sort((a, b) => a.date.localeCompare(b.date));
        if (points.length < 2) return null;
        const values = points.map(p => p.balance);
        const min = Math.min(...values);
        const max = Math.max(...values);
        const range = (max - min) || 1;
        const w = 60, h = 18;
        const pts = points.map((p, i) => {
          const x = (i / (points.length - 1)) * w;
          const y = h - ((p.balance - min) / range) * h;
          return `${x},${y}`;
        }).join(' ');
        const delta = values[values.length - 1] - values[0];
        const improved = desirableDirection === 'down' ? delta <= 0 : delta >= 0;
        return (
          <svg viewBox={`0 0 ${w} ${h}`} className="w-14 h-4 inline-block align-middle ml-2" preserveAspectRatio="none">
            <polyline points={pts} fill="none" stroke={improved ? '#34d399' : '#fb7185'} strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
          </svg>
        );
      };

      // Fuller labeled chart — used in the account edit modal and on goal cards.
      const MiniLineChart = ({ points, valueKey = 'value', dateKey = 'date', color, targetValue }) => {
        if (!points || points.length < 2) {
          return <p className="text-[10px] text-slate-500">Balance history will appear here as it's recorded over time.</p>;
        }
        const sorted = [...points].sort((a, b) => a[dateKey].localeCompare(b[dateKey]));
        const values = sorted.map(p => p[valueKey]);
        const allValues = targetValue !== undefined ? [...values, targetValue] : values;
        const min = Math.min(...allValues);
        const max = Math.max(...allValues);
        const range = (max - min) || 1;
        const w = 100, h = 34;
        const pts = sorted.map((p, i) => {
          const x = (i / (sorted.length - 1)) * w;
          const y = h - ((p[valueKey] - min) / range) * h;
          return `${x},${y}`;
        }).join(' ');
        const first = sorted[0];
        const last = sorted[sorted.length - 1];
        const delta = last[valueKey] - first[valueKey];
        const lineColor = color || (delta >= 0 ? '#34d399' : '#fb7185');
        const targetY = targetValue !== undefined ? h - ((targetValue - min) / range) * h : null;
        return (
          <div>
            <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-16" preserveAspectRatio="none">
              {targetValue !== undefined && (
                <line x1="0" y1={targetY} x2={w} y2={targetY} stroke="#64748b" strokeDasharray="2,2" strokeWidth="1" vectorEffect="non-scaling-stroke" />
              )}
              <polyline points={pts} fill="none" stroke={lineColor} strokeWidth="1.5" vectorEffect="non-scaling-stroke" />

                    </div>

                    {/* EXPORT BACKUP */}
                    <div className="p-4 bg-slate-900/60 rounded-lg border border-slate-700 space-y-2">
                      <h4 className="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="download-cloud" className="w-4 h-4 text-emerald-400"></i> Export Complete Backup
                      </h4>
                      <p className="text-[11px] text-slate-400">
                        Generates a structured `.json` snapshot of all accounts, documents, balances, contacts, budget expenses, net worth history, and executor instructions.
                      </p>
                      <button
                        onClick={exportJsonBackup}
                        className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-xs font-medium transition flex items-center justify-center gap-2"
                      >
                        Download JSON Backup File
                      </button>
                      <p className={`text-[10px] ${isBackupStale ? 'text-amber-400' : 'text-emerald-400'}`}>
                        {backupAgeDays === null ? 'No backup exported yet.' : `Last backup: ${backupAgeDays} day(s) ago${isBackupStale ? ' — consider exporting a fresh one.' : '.'}`}
                      </p>
                    </div>

                    {/* RESTORE BACKUP */}
                    <div className="p-4 bg-slate-900/60 rounded-lg border border-slate-700 space-y-2">
                      <h4 className="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="upload-cloud" className="w-4 h-4 text-blue-400"></i> Restore Vault Backup
                      </h4>
                      <p className="text-[11px] text-slate-400">
                        Upload a previously saved `.json` vault backup file to restore your database on this machine.
                      </p>
                      <label className="w-full bg-slate-700 hover:bg-slate-600 text-slate-100 py-2 rounded-lg text-xs font-medium transition flex items-center justify-center gap-2 cursor-pointer">
                        <input type="file" accept=".json" onChange={handleRestoreBackup} className="hidden" />
                        Select Backup File (.json)
                      </label>
                    </div>

                    {/* DANGER ZONE / PURGE */}
                    <div className="p-4 bg-rose-950/30 rounded-lg border border-rose-900/50 space-y-2">
                      <h4 className="text-xs font-bold text-rose-400 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="alert-octagon" className="w-4 h-4"></i> Danger Zone
                      </h4>
                      <p className="text-[11px] text-slate-400">
                        Wipe all accounts, documents, contacts, debt entries, and expenses stored in this browser's local IndexedDB.
                      </p>
                      <button
                        onClick={handlePurgeDatabase}
                        className="w-full bg-rose-900/60 hover:bg-rose-800 text-rose-200 py-2 rounded-lg text-xs font-medium transition"
                      >
                        Purge Local Database
                      </button>
                    </div>

                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // Defense-in-depth: if ANYTHING throws during render (a bad icon call, a
    // future bug, whatever) this catches it and shows a recoverable message
    // instead of the whole app silently unmounting to a blank/black screen.
    // Inline styles on purpose — this must render correctly even if Tailwind
    // itself is what failed to load.
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(error, info) {
        console.error('Financial Vault crashed:', error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#0f172a', color: '#e2e8f0', padding: '24px', fontFamily: 'sans-serif' }}>
              <div style={{ maxWidth: '420px', textAlign: 'center' }}>
                <div style={{ fontSize: '40px', marginBottom: '12px' }}>⚠️</div>
                <h1 style={{ fontSize: '18px', fontWeight: 'bold', marginBottom: '8px' }}>Something went wrong</h1>
                <p style={{ fontSize: '13px', color: '#94a3b8', marginBottom: '18px', lineHeight: '1.5' }}>
                  The app hit an unexpected error and stopped rendering. Your vault data is untouched — it lives in this browser's storage, not in the memory that just crashed.
                </p>
                <button
                  onClick={() => window.location.reload()}
                  style={{ background: '#10b981', color: 'white', border: 'none', padding: '10px 22px', borderRadius: '8px', fontSize: '13px', fontWeight: '600', cursor: 'pointer' }}
                >
                  Reload
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
    window.__vaultMounted = true;
    try { sessionStorage.removeItem('vault_auto_retry'); } catch (e) { /* ignore */ }
  </script>

  <!-- Service worker registration (plain script, runs independent of the React/Babel bundle above) -->
  <script>
    if ('serviceWorker' in navigator) {
      // When a newly-deployed service worker takes control of this page,
      // auto-reload ONCE so you actually see the update instead of running
      // stale cached code until a second manual refresh.
      let hasReloadedForUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hasReloadedForUpdate) return;
        hasReloadedForUpdate = true;
        if (window.__vaultShowToast) {
          window.__vaultShowToast('info', 'Updating to the latest version...');
          setTimeout(() => window.location.reload(), 700);
        } else {
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
