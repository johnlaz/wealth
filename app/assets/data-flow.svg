<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="Statements flow into your browser's local storage. Only if you add a Groq key does your browser send statement text directly to Groq. No Financial Vault server exists.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e4c882"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8b9ab3"/></marker>
  </defs>
  <rect width="800" height="350" rx="22" fill="#0b1324"/>
  <rect x="1" y="1" width="798" height="348" rx="21" fill="none" stroke="#e2e8f0" stroke-opacity=".14" stroke-width="2"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="34" y="104" width="168" height="96" rx="14" fill="#fff" fill-opacity=".04" stroke="#e2e8f0" stroke-opacity=".2"/>
    <text x="118" y="142" font-size="16" font-weight="700" fill="#f3eee2">Your statements</text>
    <text x="118" y="165" font-size="13" fill="#8b9ab3">PDF, CSV, or photo</text>

    <rect x="288" y="56" width="240" height="190" rx="18" fill="#c9a24b" fill-opacity=".08" stroke="#c9a24b"/>
    <text x="408" y="92" font-size="16" font-weight="700" fill="#f3eee2">Your browser</text>
    <rect x="314" y="112" width="188" height="36" rx="10" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-opacity=".45"/>
    <text x="408" y="135" font-size="13" font-weight="600" fill="#6ee7b7">IndexedDB · records and files</text>
    <rect x="314" y="158" width="188" height="36" rx="10" fill="#10b981" fill-opacity=".12" stroke="#10b981" stroke-opacity=".45"/>
    <text x="408" y="181" font-size="13" font-weight="600" fill="#6ee7b7">localStorage · settings</text>
    <text x="408" y="224" font-size="13" fill="#8b9ab3">This device only</text>

    <rect x="614" y="104" width="152" height="96" rx="14" fill="#fff" fill-opacity=".04" stroke="#e2e8f0" stroke-opacity=".25" stroke-dasharray="5 6"/>
    <text x="690" y="142" font-size="16" font-weight="700" fill="#f3eee2">Groq</text>
    <text x="690" y="165" font-size="13" fill="#8b9ab3">Only with your key</text>

    <path d="M204 152 H284" stroke="#e4c882" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M530 152 H610" stroke="#8b9ab3" stroke-width="1.6" fill="none" stroke-dasharray="5 6" marker-end="url(#b)"/>
    <text x="570" y="136" font-size="12.5" fill="#8b9ab3">direct call</text>

    <rect x="288" y="284" width="240" height="46" rx="14" fill="none" stroke="#e2e8f0" stroke-opacity=".25" stroke-dasharray="5 6"/>
    <text x="408" y="312" font-size="13" fill="#8b9ab3">A Financial Vault server: none</text>
  </g>
</svg>