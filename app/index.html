<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>html, body { background-color: #0f172a; }</style>
  <script>
    // Watchdog: this app loads several render-blocking CDN scripts in sequence
    // before it can mount (React, Babel-in-browser, pdf.js, etc.). If any one
    // of them stalls, the page just sits there with nothing painted. Rather
    // than make the user notice and manually refresh, auto-retry once.
    (function () {
      try {
        var alreadyRetried = sessionStorage.getItem('vault_auto_retry') === '1';
        setTimeout(function () {
          if (!window.__vaultMounted) {
            if (!alreadyRetried) {
              sessionStorage.setItem('vault_auto_retry', '1');
              window.location.reload();
            }
            // If we already auto-retried once and it STILL hasn't mounted,
            // stop trying — a real outage shouldn't reload forever.
          }
        }, 7000);
      } catch (e) { /* sessionStorage unavailable (e.g. private mode) — skip watchdog */ }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Financial Vault & Capital Allocator</title>

  <!-- PWA: manifest & installability -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="background-color" content="#0f172a">

  <!-- PWA: icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">

  <!-- PWA: iOS / Android standalone install behavior -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinVault">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    @keyframes toast-slide-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toast-item { animation: toast-slide-in 0.2s ease-out; }
    @keyframes vault-spin { to { transform: rotate(360deg); } }

    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }

        background: #fff !important;

</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <!-- Static, no-JS-framework-required loading screen. Lives inside #root so
       ReactDOM's first render wipes it out automatically the instant the app
       mounts — no manual cleanup needed. Inline styles on purpose: Tailwind
       hasn't loaded yet at this point (its script is below, deliberately —
       see note by the script tags), so this can't depend on utility classes. -->
  <div id="root">
    <div id="app-loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px;">
      <div style="text-align:center;">
        <img src="icon-192.png" alt="" style="width:56px;height:56px;border-radius:14px;margin:0 auto 16px;display:block;" />
        <div style="width:28px;height:28px;border:3px solid #1e293b;border-top-color:#10b981;border-radius:50%;margin:0 auto 14px;animation:vault-spin 0.8s linear infinite;"></div>
        <p style="font-size:13px;color:#94a3b8;margin:0;">Loading Financial Vault…</p>
        <p id="app-loading-slow" style="font-size:11px;color:#64748b;margin:10px 0 0;display:none;max-width:260px;">Still loading — a first load or an update can take several seconds. Nothing's stuck.</p>
      </div>
    </div>
  </div>
  <script>
    // After a few seconds, reassure rather than let a silent spinner read as "stuck".
    setTimeout(function () {
      if (!window.__vaultMounted) {
        var el = document.getElementById('app-loading-slow');
        if (el) el.style.display = 'block';
      }
    }, 3000);
  </script>

  <!-- Every library below is deliberately loaded here (bottom of body), not in
       <head>: classic <script> tags block HTML parsing, so if they were in
       <head> the loading screen above could never paint before they finished —
       this ordering is what actually lets the loading screen show up first. -->

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for In-Browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- File Parsing & PDF Generation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- Lucide Icons (pinned — @latest can silently break this app on any upstream release) -->
  <script src="https://unpkg.com/lucide@1.47.0"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { jsPDF } = window.jspdf;

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ============================================================
    // CONFIG
    // ============================================================
    const DB_NAME = 'FinancialVaultDB_V4';
    const DB_VERSION = 5;
    const STORES = {
      ACCOUNTS: 'financial_records',
      EXPENSES: 'expenses_records',
      DOCUMENTS: 'documents',
      CONTACTS: 'contacts',
      NETWORTH_HISTORY: 'networth_history',
      ACCOUNT_HISTORY: 'account_balance_history',
      GOALS: 'goals'
    };

    const CATEGORIES = ['Housing/Mortgage', 'Utilities', 'Insurance', 'Subscriptions', 'Debt Service', 'Transportation', 'Lifestyle', 'Other'];

    const HELP_CARDS = [
      {
        icon: 'shield',
        iconColor: 'text-emerald-400',
        title: 'Welcome to Financial Vault',
        body: [
          'Everything here — accounts, documents, budget, goals — lives only in this browser. No server, no account, no sync.',
          'AI-assisted statement parsing is optional and uses your own Groq API key, entered in Settings. Without a key, the app still works using simple offline parsing.',
          'This quick tour covers each tab. You can reopen it anytime from the ? button.'
        ]
      },
      {
        icon: 'database',
        iconColor: 'text-emerald-400',
        title: 'Asset & Liability Vault',
        body: [
          'Drop in a statement — PDF, CSV, or a photo — and it reads the institution, balance, APR, and statement date for you to confirm before saving.',
          'Every upload is stored so you can view or replace it later, and accounts flag themselves when their statement gets old.',

        ]
      },
      {
        icon: 'pie-chart',
        iconColor: 'text-amber-400',
        title: 'Budget & Expenses',
        body: [
          'Log recurring bills with a due day of the month — the dashboard shows what\'s due soon.',
          'Typing a bill name auto-suggests a category (rent, utilities, subscriptions, etc.).',
          'When a parsed statement reveals a recurring charge, you\'ll be offered a one-click way to add it here too.'
        ]
      },
      {
        icon: 'target',
        iconColor: 'text-blue-400',
        title: 'Goals',
        body: [
          'Set a savings target or a debt payoff goal. Link it to an account and progress tracks itself as that account\'s balance changes.',
          'No account to link? Track it manually — just update the current amount whenever you check in.',
          'Once there\'s a little history, you\'ll get a projected completion date based on the recent trend.'
        ]
      },
      {
        icon: 'trending-up',
        iconColor: 'text-emerald-400',
        title: 'Strategic Capital Allocation',
        body: [
          'A plain-math read of your accounts — no AI needed here.',
          'Flags high-interest debt worth targeting first, and idle cash sitting in low-yield accounts that could work harder.'
        ]
      },
      {
        icon: 'sparkles',
        iconColor: 'text-purple-400',
        title: 'Wealth Strategy & Advisor Chat',
        body: [
          'Generate an AI report on your whole financial picture: strengths, risks, and prioritized strategies to consider.',
          'Use "Discuss With Advisor" to ask follow-up questions — it discusses upside and downside for whatever you\'re weighing, grounded in your real numbers.',
          'Requires a Groq API key. Export the report to PDF or print it directly.'
        ]
      },
      {
        icon: 'life-buoy',
        iconColor: 'text-rose-400',
        title: 'Continuity Plan',
        body: [
          'Key contacts, per-account notes, and handoff instructions — everything someone else would need if they had to take this over.',
          'The readiness checklist shows what\'s actually in place, honestly.',
          'One click compiles it all into a settlement-ready PDF.'
        ]
      },
      {
        icon: 'settings',
        iconColor: 'text-slate-300',
        title: 'Settings & Your Data',
        body: [
          'A Groq API key is optional and unlocks AI parsing, recurring-charge detection, and the strategy report/chat.',
          'PIN lock (off by default) gates the app screen on this device — it\'s not encryption, just a lock screen.',
          'Export a JSON backup regularly — it\'s your only copy. This app can also be installed to your home screen and works offline.'
        ]
      }
    ];

    const GROQ_ENDPOINT = 'https://api.groq.com/openai/v1/chat/completions';
    const DEFAULT_TEXT_MODEL = 'openai/gpt-oss-120b';
    const DEFAULT_VISION_MODEL = 'qwen/qwen3.6-27b';
    const DEFAULT_STALE_DAYS = 60;
    const BACKUP_STALE_DAYS = 30;
    const APP_VERSION = 'finvault-v24';

    // ============================================================
    // CLIENT-SIDE AUTO-CATEGORIZATION (used when no AI key is set)
    // ============================================================
    const autoCategorize = (name) => {
      const lower = name.toLowerCase();
      if (/mortgage|rent|housing|hoa/i.test(lower)) return 'Housing/Mortgage';
      if (/power|electric|water|gas|utility|internet|spectrum|comcast|duke|sewer/i.test(lower)) return 'Utilities';
      if (/insurance|geico|state farm|allstate|progressive|health|life/i.test(lower)) return 'Insurance';
      if (/netflix|hulu|spotify|apple|google|disney|subscription|adobe|cloud/i.test(lower)) return 'Subscriptions';
      if (/card|loan|chase|citi|discover|amex|capital one|interest/i.test(lower)) return 'Debt Service';
      if (/auto|car|fuel|gasoline|tesla|gmc|toyota|ford|toll/i.test(lower)) return 'Transportation';
      return 'Other';
    };

    // ============================================================
    // INDEXEDDB HELPERS
    // ============================================================
    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORES.ACCOUNTS)) db.createObjectStore(STORES.ACCOUNTS, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.EXPENSES)) db.createObjectStore(STORES.EXPENSES, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.DOCUMENTS)) db.createObjectStore(STORES.DOCUMENTS, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.CONTACTS)) db.createObjectStore(STORES.CONTACTS, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.NETWORTH_HISTORY)) db.createObjectStore(STORES.NETWORTH_HISTORY, { keyPath: 'date' });
          if (!db.objectStoreNames.contains(STORES.ACCOUNT_HISTORY)) db.createObjectStore(STORES.ACCOUNT_HISTORY, { keyPath: 'id' });
          if (!db.objectStoreNames.contains(STORES.GOALS)) db.createObjectStore(STORES.GOALS, { keyPath: 'id' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveDBItem = async (storeName, item) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const getDBItems = async (storeName) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const getDBItem = async (storeName, key) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const deleteDBItem = async (storeName, id) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const clearStore = async (storeName) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    // ============================================================
    // DATE / STALENESS HELPERS
    // ============================================================
    const isoToday = () => new Date().toISOString().slice(0, 10);

    const daysBetween = (isoDateStr) => {
      if (!isoDateStr) return null;
      const then = new Date(isoDateStr + 'T00:00:00');
      if (isNaN(then.getTime())) return null;
      const now = new Date();
      const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((nowMid - then) / 86400000);
    };

    const getStaleness = (statementDate, thresholdDays) => {
      const age = daysBetween(statementDate);
      if (age === null) return { known: false, isStale: true, age: null };
      return { known: true, isStale: age > thresholdDays, age };
    };

    const nextOccurrenceOfDay = (dueDay) => {
      const d = parseInt(dueDay, 10);
      if (!d || d < 1 || d > 31) return null;
      const now = new Date();
      let candidate = new Date(now.getFullYear(), now.getMonth(), d);
      if (candidate < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
        candidate = new Date(now.getFullYear(), now.getMonth() + 1, d);
      }
      return candidate;
    };

    const nextAnnualOccurrence = (dueMonth, dueDay) => {
      const m = parseInt(dueMonth, 10);
      const d = parseInt(dueDay, 10);
      if (!m || m < 1 || m > 12 || !d || d < 1 || d > 31) return null;
      const now = new Date();
      let candidate = new Date(now.getFullYear(), m - 1, d);
      if (candidate < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
        candidate = new Date(now.getFullYear() + 1, m - 1, d);
      }
      return candidate;
    };

    // Single entry point for "when is this expense next due" regardless of frequency
    const nextExpenseOccurrence = (exp) => {
      return (exp.frequency === 'annual')
        ? nextAnnualOccurrence(exp.dueMonth, exp.dueDay)
        : nextOccurrenceOfDay(exp.dueDay);
    };

    // What this expense costs per month on average — used for budget totals so an
    // annual bill doesn't look like it costs the same as a monthly one.
    const monthlyEquivalent = (exp) => {
      const amt = parseFloat(exp.amount) || 0;
      return exp.frequency === 'annual' ? amt / 12 : amt;
    };

    const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    const daysUntil = (date) => {
      if (!date) return null;
      const now = new Date();
      const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((date - nowMid) / 86400000);
    };

    const normalizeToISODate = (raw) => {
      if (!raw) return '';
      const d = new Date(raw);
      if (isNaN(d.getTime())) return '';
      return d.toISOString().slice(0, 10);
    };

    // Projects a goal's completion date from a simple linear trend across its history points.
    // historyPoints: [{ date: 'YYYY-MM-DD', value: number }] — any order, needs at least 2 spanning a few days.
    const estimateGoalCompletion = (goalType, currentValue, targetValue, historyPoints) => {
      const isSavings = goalType === 'savings';
      const alreadyReached = isSavings ? currentValue >= targetValue : currentValue <= targetValue;
      if (alreadyReached) return { text: 'Goal reached!', reached: true };

      if (!historyPoints || historyPoints.length < 2) {
        return { text: 'Add more balance history to project a completion date.', reached: false };
      }
      const sorted = [...historyPoints].sort((a, b) => a.date.localeCompare(b.date));
      const first = sorted[0];
      const last = sorted[sorted.length - 1];
      const firstDate = new Date(first.date + 'T00:00:00');
      const lastDate = new Date(last.date + 'T00:00:00');
      const daySpan = Math.round((lastDate - firstDate) / 86400000);
      if (daySpan < 3) {
        return { text: 'Add more balance history to project a completion date.', reached: false };
      }
      const ratePerDay = (last.value - first.value) / daySpan;
      const remaining = targetValue - currentValue;
      if (Math.abs(ratePerDay) < 0.01 || (remaining > 0) !== (ratePerDay > 0)) {
        return { text: 'Recent trend isn\'t moving toward this goal — no projection available.', reached: false };
      }
      const daysNeeded = remaining / ratePerDay;
      if (!isFinite(daysNeeded) || daysNeeded > 3650) {
        return { text: 'At the current pace, this is more than 10 years away.', reached: false };
      }
      const projected = new Date(Date.now() + daysNeeded * 86400000);
      return {
        text: `At the current pace, projected around ${projected.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}.`,
        date: projected.toISOString().slice(0, 10),
        reached: false
      };
    };

    // ============================================================
    // GROQ AI HELPERS
    // ============================================================
    const isLikelyVisionModel = (modelId) => /vision|vl-|scout|maverick|qwen3\.6|qwen3\.8|multimodal/i.test(modelId);

    const fetchGroqModels = async (apiKey) => {
      const res = await fetch('https://api.groq.com/openai/v1/models', {
        headers: { 'Authorization': `Bearer ${apiKey}` }
      });
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`Groq API error ${res.status}: ${errText}`);
      }
      const data = await res.json();
      return (data.data || []).map(m => m.id).sort();
    };

    const parseJsonLoose = (str) => {
      if (!str) return null;
      try { return JSON.parse(str); } catch (e) {}
      const match = str.match(/\{[\s\S]*\}/);
      if (match) {
        try { return JSON.parse(match[0]); } catch (e) {}
      }
      return null;
    };

    const buildExtractionSystemPrompt = () => `You are a financial document classifier and data extractor. You will be given the text (or image) of a document a user uploaded to their personal finance vault. Identify every piece of information that can reasonably be assumed from the document, and classify it correctly so it can be routed to the right place in the app (account ledger vs. recurring budget expenses).

Return ONLY a raw JSON object (no markdown fences, no commentary) with these exact fields:
{
  "documentType": "statement" | "other",
  "institution": string,
  "accountType": "Checking" | "Savings" | "Credit Card" | "Mortgage" | "Auto Loan" | "Brokerage" | "Other",
  "category": "Asset" | "Liability",
  "accountNumberMasked": string,
  "balance": number,
  "interestRate": number,
  "statementDate": "YYYY-MM-DD" or "",
  "dueDay": number or null,
  "confidence": "high" | "medium" | "low",
  "recurringCharges": [ { "name": string, "amount": number, "category": one of [${CATEGORIES.join(', ')}], "dueDay": number or null } ],
  "linkedAssetLabel": string or "",
  "linkedAssetValue": number or null
}

Rules:
- "documentType" is "statement" only if this is a bank/credit/loan/brokerage account statement with a balance. Otherwise (insurance card, tax form, receipt, ID, unrelated document) use "other" and leave numeric fields at 0/null but still fill institution/accountType/category with your best guess if reasonable, or "Unknown"/"Other" if not.
- "category" reflects whether the account itself is an ASSET (checking, savings, brokerage — money the user has) or a LIABILITY (credit card, loan, mortgage — money the user owes). Use the account's own nature, not any single transaction's credit/debit direction.
- "statementDate" is the statement closing date / "as of" date / statement period end date printed on the document, in YYYY-MM-DD format. Leave "" if not found — do not guess today's date.
- "dueDay" is the day-of-month (1-31) this account's own payment/bill is due, if a due date is printed. Otherwise null.
- "recurringCharges" lists other fixed/recurring monthly obligations you can clearly identify inside this document — e.g. a subscription charge, a recurring auto-draft utility payment, an insurance premium, or a separate loan/mortgage payment line — that are distinct from this account's own balance. Do NOT list one-off purchases, individual retail transactions, or this account's own balance/payment as a recurring charge. Pick the closest matching category from the list given. Return an empty array if none are clearly recurring.
- "linkedAssetLabel" and "linkedAssetValue" only apply to secured debt (Mortgage, Auto Loan, or similar collateral-backed liability). If — and ONLY if — the document explicitly prints a current estimated/appraised/assessed market value of the collateral (e.g. "Estimated Market Value", "Assessed Value"), set "linkedAssetLabel" to a short label like "Home Value" or "Vehicle Value" and "linkedAssetValue" to that number. Do NOT use the original loan amount, original purchase price, or original appraisal at origination — those are not current value. If no explicit current value is printed, leave "linkedAssetLabel" as "" and "linkedAssetValue" as null; do not guess or estimate a market value yourself.
- Assets (checking, savings, brokerage) are positive balances; liabilities (credit card, loan, mortgage) should have category "Liability".
- Output must be valid JSON and nothing else.`;

    const callGroqCompletion = async (apiKey, body) => {
      const res = await fetch(GROQ_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`Groq API error ${res.status}: ${errText}`);
      }
      const data = await res.json();
      return data && data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content
        : '';
    };

    const callGroq = async (apiKey, body) => {
      const content = await callGroqCompletion(apiKey, body);
      return parseJsonLoose(content);
    };

    // Raw conversational text — no JSON parsing — for the advisor chat
    const callGroqText = async (apiKey, body) => callGroqCompletion(apiKey, body);

    // A short, situation-specific hint appended to Groq error messages shown in the UI —
    // rate limits and missing/inaccessible models need different fixes, so don't conflate them.
    const groqErrorHint = (err) => {
      const msg = String(err && err.message || '');
      if (/429|rate_limit/i.test(msg)) {
        return ' This model\'s rate limit on your account is quite low — wait a minute and try again, or go to Settings and use "Fetch Models" to switch to one with more headroom.';
      }
      if (/404|model_not_found|does not exist/i.test(msg)) {
        return ' If this says a model doesn\'t exist or isn\'t accessible, go to Settings and use "Fetch Models" to pick one your key can actually use.';
      }
      return '';
    };

    const extractWithGroqText = async (fullText, apiKey, model) => {
      const truncated = fullText.slice(0, 14000);
      return callGroq(apiKey, {
        model: model || DEFAULT_TEXT_MODEL,
        temperature: 0.1,
        max_tokens: 700, // the extraction JSON is compact — keep the request well under low-tier OTPM limits
        response_format: { type: 'json_object' },
        messages: [
          { role: 'system', content: buildExtractionSystemPrompt() },

Rules:

    const normalizeRecurringCharges = (list) => {
      if (!Array.isArray(list)) return [];
      return list
        .filter(rc => rc && rc.name && parseFloat(rc.amount) > 0)
        .map((rc, idx) => ({
          uid: 'rc_' + Date.now() + '_' + idx,
          name: rc.name,
          amount: parseFloat(rc.amount) || 0,
          category: CATEGORIES.includes(rc.category) ? rc.category : autoCategorize(rc.name),
          dueDay: rc.dueDay || null,
          include: true
        }));
    };

    // Fallback header-matching for spreadsheet budget import when no Groq key is set.
    // Fuzzy-matches common column header variants to the fields the app needs.
    const HEADER_PATTERNS = {
      name: /^(name|item|description|desc|bill|expense|payee|vendor|merchant|label|memo|reference|narrative|particulars|payee.?name)/i,
      amount: /(amount|cost|price|total|\$|payment)/i,
      category: /(category|type|group|class)/i,
      frequency: /(frequency|recurrence|cadence|billing)/i,
      dueDay: /(due.?day|day.?due|^day$)/i,
      dueMonth: /(due.?month)/i,
      dueDate: /(due.?date)/i
    };

    const detectColumn = (headers, pattern) => headers.find(h => pattern.test(String(h).trim()));

    // When no header matches a "name" pattern, don't blindly grab the first
    // column (it's frequently a Date or ID column in a raw transaction
    // export) — pick the first column whose actual values look like text.
    const detectTextColumn = (headers, rows) => {
      const sample = rows.slice(0, 10);
      for (const h of headers) {
        const nonEmpty = sample.map(r => String(r[h] ?? '').trim()).filter(Boolean);
        if (nonEmpty.length === 0) continue;
        const looksTextual = nonEmpty.every(v => isNaN(Number(v)) && isNaN(Date.parse(v)));
        if (looksTextual) return h;
      }
      return headers[0];
    };

    const heuristicMapBudgetRows = (rows) => {
      if (!rows || rows.length === 0) return [];
      const headers = Object.keys(rows[0]);
      const nameCol = detectColumn(headers, HEADER_PATTERNS.name) || detectTextColumn(headers, rows);
      const amountCol = detectColumn(headers, HEADER_PATTERNS.amount);
      const categoryCol = detectColumn(headers, HEADER_PATTERNS.category);
      const freqCol = detectColumn(headers, HEADER_PATTERNS.frequency);
      const dueDayCol = detectColumn(headers, HEADER_PATTERNS.dueDay);
      const dueMonthCol = detectColumn(headers, HEADER_PATTERNS.dueMonth);
      const dueDateCol = detectColumn(headers, HEADER_PATTERNS.dueDate); // only matches an explicit "due date" header, never a bare "Date" column

      return rows.map((row) => {
        const rawName = nameCol ? String(row[nameCol] || '').trim() : '';
        const rawAmount = amountCol ? String(row[amountCol] || '').replace(/[^0-9.\-]/g, '') : '';
        const amount = Math.abs(parseFloat(rawAmount) || 0); // bank exports often show outflows as negative — an expense amount should be positive
        let frequency = 'monthly';
        if (freqCol && /annual|year/i.test(String(row[freqCol] || ''))) frequency = 'annual';
        let dueDay = dueDayCol ? parseInt(row[dueDayCol], 10) : null;
        let dueMonth = dueMonthCol ? parseInt(row[dueMonthCol], 10) : null;
        if ((!dueDay || !dueMonth) && dueDateCol && row[dueDateCol]) {
          const rawDue = row[dueDateCol];
          const d = rawDue instanceof Date ? rawDue : new Date(rawDue);
          if (!isNaN(d.getTime())) {
            dueDay = dueDay || d.getDate();
            dueMonth = dueMonth || (d.getMonth() + 1);

          name: rawName,
          category: (categoryCol && CATEGORIES.includes(String(row[categoryCol]).trim())) ? String(row[categoryCol]).trim() : autoCategorize(rawName),
          amount,
          frequency,
          dueDay: dueDay || null,
          dueMonth: frequency === 'annual' ? (dueMonth || null) : null,
          skip: !rawName || !(amount > 0)
        };
      });

    const sha256Hex = async (text) => {
      try {
        if (window.crypto && window.crypto.subtle) {
          const enc = new TextEncoder().encode(text);
          const buf = await window.crypto.subtle.digest('SHA-256', enc);
          return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) { /* fall through to the simple fallback below */ }
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      }
      return 'fb_' + Math.abs(hash).toString(16);

        setText(doc, { font: 'times', style: 'bold', size: 17, color: C.white }); doc.text(longDate(ctx.now), ax, by + 8);

        // stat strip on the white lower half
        const stats = (opts.coverStats || []).slice(0, 4);
        if (stats.length) {
          const sw = CW / stats.length;
          stats.forEach((s, i) => {
            const x = P.mx + i * sw;
            if (i > 0) { doc.setDrawColor(...C.rule); doc.setLineWidth(0.3); doc.line(x - 3, 192, x - 3, 213); }
            setText(doc, { style: 'bold', size: 6.2, color: C.muted }); doc.text(safe(s.label).toUpperCase(), x, 194, { charSpace: 0.5 });
            let size = 21; setText(doc, { font: 'times', style: 'bold', size, color: s.color || C.navy });
            while (doc.getTextWidth(safe(s.value)) > sw - 7 && size > 11) { size -= 1; doc.setFontSize(size); }
            doc.text(safe(s.value), x, 205);
            if (s.sub) { setText(doc, { size: 7.4, color: C.muted }); doc.text(safe(s.sub), x, 210.5); }
          });
        }

        // confidentiality + footer
        doc.setDrawColor(...C.rule); doc.setLineWidth(0.3); doc.line(P.mx, P.h - 50, P.mx + CW, P.h - 50);
        setText(doc, { style: 'bold', size: 7, color: C.goldDk }); doc.text('CONFIDENTIAL', P.mx, P.h - 43, { charSpace: 1.8 });
        setText(doc, { size: 8.2, color: C.muted });
        doc.text(doc.splitTextToSize('This document contains personal financial information. Store it securely and share it only with the people who need it, such as an estate attorney, executor, accountant or advisor.', CW), P.mx, P.h - 37.5, { lineHeightFactor: 1.5 });
        setText(doc, { size: 7, color: C.faint });
        doc.text('Generated ' + ctx.now.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) + '  |  Created on-device by Financial Vault', P.mx, P.h - 14);
      };

      // running header / footer + page numbers, applied once all pages exist
      const finish = (ctx) => {
        const { doc, opts } = ctx;
        const n = doc.getNumberOfPages();
        for (let i = ctx.hasCover ? 2 : 1; i <= n; i++) {
          doc.setPage(i);
          setText(doc, { style: 'bold', size: 6.6, color: C.goldDk }); doc.text('FINANCIAL VAULT', P.mx, 13, { charSpace: 1.4 });
          setText(doc, { size: 7.4, color: C.muted }); doc.text(safe(opts.title), P.w - P.mx, 13, { align: 'right' });
          doc.setDrawColor(...C.rule); doc.setLineWidth(0.25); doc.line(P.mx, 16, P.mx + CW, 16);
          doc.line(P.mx, P.h - 15, P.mx + CW, P.h - 15);
          setText(doc, { size: 7.2, color: C.faint });
          doc.text('Confidential' + (opts.owner ? '  |  Prepared for ' + safe(opts.owner) : ''), P.mx, P.h - 10.5);
          setText(doc, { style: 'bold', size: 7.4, color: C.muted });
          doc.text(`Page ${i} of ${n}`, P.w - P.mx, P.h - 10.5, { align: 'right' });
        }
        doc.setPage(n);
        return ctx.doc;
      };

      // ---------- text blocks ----------
      const h1 = (ctx, text, o = {}) => {
        need(ctx, o.keep || 38);
        const { doc } = ctx;
        if (ctx.y > P.top + 1) ctx.y += 4;
        doc.setFillColor(...C.gold); doc.rect(P.mx, ctx.y, 11, 1.1, 'F');
        ctx.y += 4.4;
        let x = P.mx;
        if (o.num) {
          setText(doc, { font: 'times', style: 'bold', size: 17, color: C.gold });
          doc.text(String(o.num).padStart(2, '0'), x, ctx.y + 6);
          x += 11;
        }
        setText(doc, { font: 'times', style: 'bold', size: 17, color: C.navy });
        doc.text(safe(text), x, ctx.y + 6);
        ctx.sections.push({ title: text, page: pageNo(ctx), num: o.num });
        ctx.y += 9.6;
        doc.setDrawColor(...C.rule); doc.setLineWidth(0.25); doc.line(P.mx, ctx.y, P.mx + CW, ctx.y);
        ctx.y += 5;
        if (o.lead) para(ctx, o.lead, { color: C.muted, size: 9, gap: 4 });
      };

      const h2 = (ctx, text, o = {}) => {
        need(ctx, 26);
        const { doc } = ctx;
        ctx.y += 2;
        setText(doc, { style: 'bold', size: 10.5, color: C.navy });
        doc.text(safe(text), P.mx, ctx.y + 3.4);
        if (o.note) { setText(doc, { size: 7.6, color: C.muted }); doc.text(safe(o.note), P.mx + CW, ctx.y + 3.4, { align: 'right' }); }
        ctx.y += 6.2;
      };

      const para = (ctx, str, o = {}) => {
        const { doc } = ctx;
        const size = o.size || 9.5, lh = o.lh || 1.5, w = o.w || CW, x = o.x === undefined ? P.mx : o.x;
        setText(doc, { size, color: o.color || C.ink, style: o.style || 'normal', font: o.font });
        const lines = doc.splitTextToSize(safe(str), w);
        const step = size * PT * lh;
        lines.forEach(ln => {
          need(ctx, step);
          if (o.rule) { doc.setFillColor(...C.gold); doc.rect(x - 4, ctx.y, 0.9, step, 'F'); }
          setText(doc, { size, color: o.color || C.ink, style: o.style || 'normal', font: o.font });
          doc.text(ln, x, ctx.y + size * PT * 0.85);
          ctx.y += step;
        });
        ctx.y += (o.gap === undefined ? 2.5 : o.gap);
      };

      const empty = (ctx, msg) => {
        need(ctx, 14);
        const { doc } = ctx;
        doc.setFillColor(...C.band); doc.roundedRect(P.mx, ctx.y, CW, 11, 1.5, 1.5, 'F');
        setText(doc, { style: 'italic', size: 8.6, color: C.muted });
        doc.text(safe(msg), P.mx + 4, ctx.y + 6.8);
        ctx.y += 15;
      };

      const callout = (ctx, title, body, o = {}) => {
        const { doc } = ctx;
        const tone = { gold: C.gold, red: C.red, green: C.green, amber: C.amber, navy: C.navy }[o.tone || 'gold'];
        const size = o.size || 9.4, pad = 4.2, step = size * PT * 1.5;
        setText(doc, { size, style: o.style || 'normal', font: o.font });
        const lines = doc.splitTextToSize(safe(body), CW - pad * 2 - 2);
        const h = pad * 2 + (title ? 6 : 0) + lines.length * step;
        need(ctx, h + 3);
        const y = ctx.y;
        doc.setFillColor(...C.band); doc.roundedRect(P.mx, y, CW, h, 1.6, 1.6, 'F');
        doc.setFillColor(...tone); doc.rect(P.mx, y + 0.6, 1.5, h - 1.2, 'F');
        let ty = y + pad;
        if (title) {
          setText(doc, { style: 'bold', size: 7, color: tone === C.gold ? C.goldDk : tone });
          doc.text(safe(title).toUpperCase(), P.mx + pad + 2, ty + 2.6, { charSpace: 1.1 });
          ty += 6;
        }
        setText(doc, { size, style: o.style || 'normal', font: o.font, color: o.color || C.ink });
        lines.forEach((ln, i) => doc.text(ln, P.mx + pad + 2, ty + size * PT * 0.85 + i * step));
        ctx.y += h + 5;
      };

      const bullets = (ctx, items, o = {}) => {
        const { doc } = ctx;
        const size = o.size || 9.2, step = size * PT * 1.5, w = (o.w || CW) - 6;
        items.forEach(it => {
          const text = typeof it === 'string' ? it : it.text;
          const color = (typeof it === 'object' && it.color) || C.gold;
          setText(doc, { size });
          const lines = doc.splitTextToSize(safe(text), w);
          need(ctx, lines.length * step + 1.5);
          doc.setFillColor(...color); doc.circle(P.mx + 1.3, ctx.y + step * 0.5, 0.9, 'F');
          setText(doc, { size, color: C.ink });
          lines.forEach((ln, i) => doc.text(ln, P.mx + 5, ctx.y + size * PT * 0.85 + i * step));
          ctx.y += lines.length * step + 1.6;
        });
        ctx.y += 2;
      };

      const checkbox = (doc, x, y, state, size = 3.6) => {
        // state: true = done (green tick), false = open box, 'warn' = open red box
        if (state === true) {
          doc.setFillColor(...C.green); doc.roundedRect(x, y, size, size, 0.6, 0.6, 'F');
          doc.setDrawColor(...C.white); doc.setLineWidth(0.45);
          doc.line(x + size * 0.22, y + size * 0.54, x + size * 0.42, y + size * 0.74);
          doc.line(x + size * 0.42, y + size * 0.74, x + size * 0.8, y + size * 0.28);
        } else {
          doc.setDrawColor(...(state === 'warn' ? C.red : C.faint)); doc.setLineWidth(0.4);
          doc.roundedRect(x, y, size, size, 0.6, 0.6, 'S');
        }
      };

      // ---------- tables ----------
      const table = (ctx, o) => {
        const { doc } = ctx;
        need(ctx, 26);
        doc.autoTable({
          startY: ctx.y,
          head: o.head ? [o.head.map(h => safe(h).toUpperCase())] : undefined,
          body: o.body.map(r => r.map(c => (c && typeof c === 'object' && !Array.isArray(c)) ? { ...c, content: safe(c.content) } : safe(c))),
          foot: o.foot ? [o.foot.map(c => (c && typeof c === 'object') ? { ...c, content: safe(c.content) } : safe(c))] : undefined,
          margin: { left: P.mx, right: P.mx, top: P.top, bottom: P.bottom },
          tableWidth: CW,
          theme: 'plain',
          rowPageBreak: 'avoid',
          styles: { font: 'helvetica', fontSize: o.fontSize || 8.2, cellPadding: { top: 2.1, bottom: 2.1, left: 2.4, right: 2.4 }, textColor: C.ink, overflow: 'linebreak', valign: 'middle', lineWidth: 0 },
          headStyles: { fillColor: C.navy, textColor: C.white, fontStyle: 'bold', fontSize: 6.6, cellPadding: { top: 2.7, bottom: 2.7, left: 2.4, right: 2.4 } },
          alternateRowStyles: { fillColor: C.zebra },
          footStyles: { fillColor: [241, 236, 220], textColor: C.navy, fontStyle: 'bold', fontSize: 8.6 },
          columnStyles: o.columns || {},
          didParseCell: (data) => {
            const cs = (o.columns || {})[data.column.index];
            if (cs && cs.halign && (data.section === 'head' || data.section === 'foot') && !(data.cell.colSpan > 1)) data.cell.styles.halign = cs.halign;
            if (o.parseCell) o.parseCell(data);
          },
          didDrawCell: (data) => {
            const c = data.cell;
            if (data.section === 'body') {
              doc.setDrawColor(...C.rule); doc.setLineWidth(0.12);
              doc.line(c.x, c.y + c.height, c.x + c.width, c.y + c.height);
            } else if (data.section === 'foot') {
              doc.setDrawColor(...C.gold); doc.setLineWidth(0.5);
              doc.line(c.x, c.y, c.x + c.width, c.y);
            }
            if (o.drawCell) o.drawCell(data);
          }
        });
        ctx.y = doc.lastAutoTable.finalY + (o.after === undefined ? 7 : o.after);
      };

      // ---------- KPI cards & charts ----------
      const kpis = (ctx, items) => {
        const { doc } = ctx;
        const n = items.length, gap = 4, w = (CW - gap * (n - 1)) / n, h = 24;
        need(ctx, h + 4);
        items.forEach((it, i) => {
          const x = P.mx + i * (w + gap), y = ctx.y;
          doc.setFillColor(...C.band); doc.roundedRect(x, y, w, h, 1.8, 1.8, 'F');
          doc.setFillColor(...(it.accent || C.gold)); doc.rect(x + 4, y + 3.4, 7, 0.8, 'F');
          const lab = safe(it.label).toUpperCase();
          let ls = 6.2; setText(doc, { style: 'bold', size: ls, color: C.muted });
          while (doc.getTextWidth(lab) + lab.length * 0.5 > w - 8 && ls > 4.6) { ls -= 0.2; doc.setFontSize(ls); }
          doc.text(lab, x + 4, y + 9, { charSpace: 0.5 });
          let size = 15; setText(doc, { style: 'bold', size, color: it.color || C.navy });
          while (doc.getTextWidth(safe(it.value)) > w - 8 && size > 8.5) { size -= 0.5; doc.setFontSize(size); }
          doc.text(safe(it.value), x + 4, y + 16.6);
          if (it.sub) { setText(doc, { size: 6.8, color: it.subColor || C.muted }); doc.text(safe(it.sub), x + 4, y + 21); }
        });
        ctx.y += h + 6;
      };

      const stackBar = (ctx, title, segs, o = {}) => {
        const { doc } = ctx;
        const data = segs.filter(s => num(s.value) > 0);
        const total = sum(data, s => s.value);
        if (total <= 0) return;
        const cols = 2, rows = Math.ceil(data.length / cols);
        need(ctx, 14 + rows * 5.6);
        setText(doc, { style: 'bold', size: 8.6, color: C.navy }); doc.text(safe(title), P.mx, ctx.y + 3);
        if (o.note) { setText(doc, { size: 7.6, color: C.muted }); doc.text(safe(o.note), P.mx + CW, ctx.y + 3, { align: 'right' }); }
        ctx.y += 6;
        let x = P.mx;
        data.forEach((s, i) => {
          const w = (num(s.value) / total) * CW;
          doc.setFillColor(...(s.color || SERIES[i % SERIES.length])); doc.rect(x, ctx.y, w, 6.2, 'F');
          x += w;
        });
        doc.setDrawColor(...C.white); doc.setLineWidth(0.5);
        x = P.mx; data.forEach(s => { x += (num(s.value) / total) * CW; if (x < P.mx + CW - 0.5) doc.line(x, ctx.y, x, ctx.y + 6.2); });
        ctx.y += 10;
        const colW = CW / cols;
        data.forEach((s, i) => {
          const cx = P.mx + (i % cols) * colW, cy = ctx.y + Math.floor(i / cols) * 5.6;
          doc.setFillColor(...(s.color || SERIES[i % SERIES.length])); doc.roundedRect(cx, cy, 2.8, 2.8, 0.5, 0.5, 'F');
          setText(doc, { size: 8, color: C.ink }); doc.text(safe(s.label), cx + 4.6, cy + 2.4);
          setText(doc, { size: 8, color: C.muted, style: 'bold' });
          doc.text(`${money(s.value, 0)}  (${((num(s.value) / total) * 100).toFixed(0)}%)`, cx + colW - 6, cy + 2.4, { align: 'right' });
        });
        ctx.y += rows * 5.6 + 4;
      };

      const hBars = (ctx, rows, o = {}) => {
        const { doc } = ctx;
        const data = rows.filter(r => num(r.value) > 0);
        if (!data.length) return;
        const max = Math.max(...data.map(r => num(r.value))), total = sum(data, r => r.value);
        const labelW = 44, valW = 38, rowH = 7;
        need(ctx, Math.min(data.length, 4) * rowH + 4);
        data.forEach((r, i) => {
          need(ctx, rowH + 1);
          const y = ctx.y, tx = P.mx + labelW, tw = CW - labelW - valW;
          setText(doc, { size: 8.4, color: C.ink }); doc.text(safe(r.label), P.mx, y + 4.6);
          doc.setFillColor(238, 236, 228); doc.roundedRect(tx, y + 1.2, tw, 4, 1, 1, 'F');
          doc.setFillColor(...(r.color || o.color || SERIES[i % SERIES.length]));
          doc.roundedRect(tx, y + 1.2, Math.max(1.5, (num(r.value) / max) * tw), 4, 1, 1, 'F');
          setText(doc, { size: 8.2, style: 'bold', color: C.ink });
          doc.text(`${money(r.value, 0)}  ${o.noPct ? '' : '(' + ((num(r.value) / total) * 100).toFixed(0) + '%)'}`, P.mx + CW, y + 4.6, { align: 'right' });
          ctx.y += rowH;
        });
        ctx.y += 4;
      };

      const progress = (doc, x, y, w, pct, color, h = 3) => {
        doc.setFillColor(232, 229, 219); doc.roundedRect(x, y, w, h, h / 2, h / 2, 'F');
        if (pct > 0) { doc.setFillColor(...color); doc.roundedRect(x, y, Math.max(h, (Math.min(100, pct) / 100) * w), h, h / 2, h / 2, 'F'); }
      };

      const lineChart = (ctx, title, pts, o = {}) => {
        const { doc } = ctx;
        if (!pts || pts.length < 2) return;
        const H = o.h || 52, padL = 17, padB = 8, padT = 4;
        need(ctx, H + 16);
        setText(doc, { style: 'bold', size: 8.6, color: C.navy }); doc.text(safe(title), P.mx, ctx.y + 3);
        ctx.y += 6;
        let data = pts;
        if (data.length > 70) { const step = (data.length - 1) / 69; data = Array.from({ length: 70 }, (_, i) => pts[Math.round(i * step)]); }
        const vals = data.map(p => num(p.value));
        let min = Math.min(...vals, o.target !== undefined ? num(o.target) : Infinity), max = Math.max(...vals, o.target !== undefined ? num(o.target) : -Infinity);
        if (max === min) { max += 1; min -= 1; }
        const padV = (max - min) * 0.08; min -= padV; max += padV;
        const x0 = P.mx + padL, x1 = P.mx + CW - 2, y0 = ctx.y + padT, y1 = ctx.y + H - padB;
        const X = (i) => x0 + (i / (data.length - 1)) * (x1 - x0);
        const Y = (v) => y1 - ((v - min) / (max - min)) * (y1 - y0);
        // grid + y labels
        doc.setLineWidth(0.12);
        for (let g = 0; g <= 4; g++) {
          const gv = min + ((max - min) * g) / 4, gy = Y(gv);
          doc.setDrawColor(...C.rule); doc.line(x0, gy, x1, gy);
          setText(doc, { size: 6.6, color: C.faint }); doc.text(moneyShort(gv), x0 - 2, gy + 1.1, { align: 'right' });
        }
        const up = vals[vals.length - 1] >= vals[0];
        const col = o.color || (up ? C.green : C.red);
        // area
        gs(doc, 0.13); doc.setFillColor(...col);
        const rel = []; let px = X(0), py = y1;
        rel.push([0, Y(vals[0]) - py]); px = X(0); py = Y(vals[0]);
        for (let i = 1; i < vals.length; i++) { rel.push([X(i) - px, Y(vals[i]) - py]); px = X(i); py = Y(vals[i]); }
        rel.push([0, y1 - py]);
        doc.lines(rel, X(0), y1, [1, 1], 'F', true);
        gs(doc, 1);
        // line
        doc.setDrawColor(...col); doc.setLineWidth(0.7); doc.setLineCap('round'); doc.setLineJoin('round');
        for (let i = 1; i < vals.length; i++) doc.line(X(i - 1), Y(vals[i - 1]), X(i), Y(vals[i]));
        if (o.target !== undefined) {
          doc.setDrawColor(...C.gold); doc.setLineWidth(0.3); doc.setLineDashPattern([1.4, 1.2], 0);
          doc.line(x0, Y(num(o.target)), x1, Y(num(o.target))); doc.setLineDashPattern([], 0);
        }
        doc.setFillColor(...col); doc.circle(X(0), Y(vals[0]), 0.9, 'F'); doc.circle(X(vals.length - 1), Y(vals[vals.length - 1]), 1.2, 'F');
        // x labels
        setText(doc, { size: 6.8, color: C.muted });
        doc.text(fmtDate(data[0].date), x0, y1 + 5);
        doc.text(fmtDate(data[Math.floor((data.length - 1) / 2)].date), (x0 + x1) / 2, y1 + 5, { align: 'center' });
        doc.text(fmtDate(data[data.length - 1].date), x1, y1 + 5, { align: 'right' });
        ctx.y += H + 3;
        const delta = vals[vals.length - 1] - vals[0];
        setText(doc, { size: 8, style: 'bold', color: col });
        doc.text(`${delta >= 0 ? '+' : ''}${money(delta, 0)} over this period`, P.mx + CW, ctx.y + 1, { align: 'right' });
        setText(doc, { size: 8, color: C.muted }); doc.text(`${data.length} snapshots`, P.mx, ctx.y + 1);
        ctx.y += 7;
      };

      const signatureBlock = (ctx, title, rows = 2) => {
        const { doc } = ctx;
        need(ctx, 12 + rows * 17);
        h2(ctx, title);
        for (let r = 0; r < rows; r++) {
          const y = ctx.y + 11;
          doc.setDrawColor(...C.faint); doc.setLineWidth(0.25);
          doc.line(P.mx, y, P.mx + 72, y); doc.line(P.mx + 78, y, P.mx + 120, y); doc.line(P.mx + 126, y, P.mx + CW, y);
          setText(doc, { size: 6.6, color: C.muted });
          doc.text('NAME / ROLE', P.mx, y + 3.6, { charSpace: 0.8 }); doc.text('SIGNATURE', P.mx + 78, y + 3.6, { charSpace: 0.8 }); doc.text('DATE', P.mx + 126, y + 3.6, { charSpace: 0.8 });
          ctx.y += 17;
        }
        ctx.y += 2;
      };

      const ruledLines = (ctx, title, count = 7) => {
        const { doc } = ctx;
        need(ctx, 10 + count * 8);
        h2(ctx, title);
        doc.setDrawColor(...C.rule); doc.setLineWidth(0.25);
        for (let i = 0; i < count; i++) { ctx.y += 8; doc.line(P.mx, ctx.y, P.mx + CW, ctx.y); }
        ctx.y += 6;
      };

      const disclaimer = (ctx, text) => {
        need(ctx, 20);
        ctx.y += 2;
        para(ctx, text, { size: 7.4, color: C.faint, lh: 1.5 });
      };

      // contents list with right-aligned page numbers; drawn after layout so page numbers are known
      const reserveContents = (ctx, count) => {
        const h = 12 + count * 5.4;
        need(ctx, h);
        ctx.contents = { page: pageNo(ctx), y: ctx.y, count };
        ctx.y += h;
      };
      const fillContents = (ctx) => {
        if (!ctx.contents) return;
        const { doc } = ctx, c = ctx.contents;
        doc.setPage(c.page);
        let y = c.y;
        setText(doc, { style: 'bold', size: 10.5, color: C.navy }); doc.text('Contents', P.mx, y + 3.4);
        y += 7;
        ctx.sections.slice(0, c.count).forEach(s => {
          setText(doc, { font: 'times', style: 'bold', size: 10, color: C.gold }); if (s.num) doc.text(String(s.num).padStart(2, '0'), P.mx, y + 3);
          setText(doc, { size: 9.2, color: C.ink }); doc.text(safe(s.title), P.mx + 9, y + 3);
          const tw = doc.getTextWidth(safe(s.title));
          doc.setDrawColor(...C.rule); doc.setLineWidth(0.2); doc.setLineDashPattern([0.4, 1.1], 0);
          doc.line(P.mx + 11 + tw, y + 3, P.mx + CW - 9, y + 3); doc.setLineDashPattern([], 0);
          setText(doc, { style: 'bold', size: 9.2, color: C.muted }); doc.text(String(s.page), P.mx + CW, y + 3, { align: 'right' });
          y += 5.4;
        });
        doc.setPage(doc.getNumberOfPages());
      };

      // ============================================================
      // REPORT BUILDERS
      // ============================================================
      const baseOpts = (d, o, kind, title, subtitle, coverStats) => ({
        kind, title, subtitle, coverStats, owner: (d.owner || '').trim(), cover: o.cover !== false
      });
      const acctTypeColor = {};
      const typeGroups = (recs) => {

      // ---- 1. Estate Settlement Package ----
      const buildSettlement = (d, o = {}) => {

        const accountsWithNotes = m.recs.filter(r => r.notes && String(r.notes).trim());

        const sec = (t, extra = {}) => h1(ctx, t, { num: ++n, ...extra });

        para(ctx, `Position as of ${longDate(ctx.now)}, based on the most recent statement figures recorded in the vault.`, { color: C.muted, size: 9, gap: 4 });
        kpis(ctx, [
          { label: 'Net estate value', value: money(m.netWorth, 0), color: m.netWorth < 0 ? C.red : C.navy, sub: 'Assets less liabilities' },
          { label: 'Total assets', value: money(m.totalAssets, 0), color: C.green, accent: C.green },
          { label: 'Total liabilities', value: money(m.totalLiabilities, 0), color: C.red, accent: C.red },
          { label: 'Monthly obligations', value: money(m.monthlyExpenses, 0), sub: money(m.monthlyExpenses * 12, 0) + ' per year' }

            : { text: `All statements are within ${rd.staleDays} days.`, color: C.green },

          m.reserveMonths !== null ? { text: `Cash in checking and savings covers about ${m.reserveMonths.toFixed(1)} months of recurring obligations.`, color: m.reserveMonths >= 3 ? C.green : C.amber } : null

        bullets(ctx, obs);

          });

        const ledgerRow = (r) => [{ content: r.institution || '', styles: { fontStyle: 'bold' } }, r.accountType || '', r.accountNumberMasked || '—', num(r.interestRate).toFixed(2) + '%', money(r.balance), r.statementDate ? fmtDate(r.statementDate) : 'Unknown', r.documentId ? 'Yes' : 'No'];
        const ledgerParse = (rows) => (data) => {
          if (data.section !== 'body') return;

        h2(ctx, 'Assets');
        if (m.assets.length) table(ctx, { head: ['Institution', 'Type', 'Account #', 'APR', 'Balance', 'Statement', 'Doc'], body: m.assets.map(ledgerRow), foot: ['Total financial assets', '', '', '', money(sum(m.assets, r => r.balance)), '', ''], columns: ledgerCols, parseCell: ledgerParse(m.assets) });
        else empty(ctx, 'No asset accounts recorded.');
        if (m.linked.length) {
          h2(ctx, 'Real & other assets, with equity', { note: 'Value of the asset securing a loan' });

            body: m.linked.map(r => [{ content: r.linkedAssetLabel || 'Asset', styles: { fontStyle: 'bold' } }, r.institution || '', money(r.linkedAssetValue), r.category === 'Asset' ? '—' : money(r.balance), r.category === 'Asset' ? money(r.linkedAssetValue) : money(num(r.linkedAssetValue) - num(r.balance))]),
            foot: ['Total', '', money(m.linkedTotal), '', money(sum(m.linked, r => num(r.linkedAssetValue) - (r.category === 'Asset' ? 0 : num(r.balance))))],

        else empty(ctx, 'No liability accounts recorded.');

        // 07 obligations

        if (m.exps.length) {

          table(ctx, {
            head: ['Obligation', 'Category', 'Frequency', 'Due', 'Amount', 'Per month'],
            body: rows.map(({ e, du }) => [{ content: e.name || '', styles: { fontStyle: du <= 14 ? 'bold' : 'normal' } }, e.category || '', e.frequency === 'annual' ? 'Annual' : 'Monthly', dueLabel(e) + (du <= 14 ? `  (in ${du}d)` : ''), money(e.amount), money(monthlyEquivalent(e))]),
            foot: ['Total', '', '', '', '', money(m.monthlyExpenses)],

          h2(ctx, 'By category', { note: 'Monthly equivalent' });
          hBars(ctx, Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value })));
        } else empty(ctx, 'No recurring obligations recorded.');

          doc.text(safe(it.label), P.mx + 6, ctx.y + 3.2);
          ctx.y += 6.6;

        ctx.y += 3;
        signatureBlock(ctx, 'Record of review', 2);
        disclaimer(ctx, 'This document was compiled from figures entered by the account holder or read from uploaded statements. Balances reflect each account\'s statement date and have not been independently verified. It is an organizational record, not legal, tax or investment advice.');

        fillContents(ctx);
        return finish(ctx);

      // ---- 2. Continuity & Handoff Plan ----
      const buildContinuity = (d, o = {}) => {
        const m = derive(d), rd = readiness(d);

          'Everything someone would need to step in and keep things running. Contains no account balances.',

            { label: 'Readiness', value: `${rd.done} of ${rd.total}`, color: rd.done === rd.total ? C.green : C.amber, sub: 'Handoff checklist' },

        });

        steps.forEach((s, i) => {

          checkbox(doc, P.mx, ctx.y + 0.5, false);
          setText(doc, { font: 'times', style: 'bold', size: 10, color: C.gold }); doc.text(String(i + 1), P.mx + 6.4, ctx.y + 3.3);
          setText(doc, { size: 9.2 }); doc.text(lines, P.mx + 11.5, ctx.y + 3.2);
          ctx.y += lines.length * 4.6 + 2;
        });
        ctx.y += 2;

        addPage(ctx);
        sec('Owner\'s Instructions');
        if (String(d.notes || '').trim()) para(ctx, d.notes, { x: P.mx + 5, w: CW - 5, rule: true, size: 9.6, gap: 5 });

      // ---- 3. Personal Net Worth Statement ----
      const buildNetWorth = (d, o = {}) => {

        table(ctx, {

            [{ content: 'Total liabilities', colSpan: 2, styles: { fontStyle: 'bold', fillColor: [241, 236, 220] } }, { content: money(m.totalLiabilities), styles: { fontStyle: 'bold', fillColor: [241, 236, 220] } }]
          ],
          foot: ['NET WORTH', '', money(m.netWorth)],
          columns: { 1: { cellWidth: 32 }, 2: { halign: 'right', cellWidth: 38 } },
          parseCell: (data) => { if (data.section === 'body') data.cell.styles.fillColor = data.cell.styles.fillColor || [255, 255, 255]; }
        });

        sec('Key Ratios');
        table(ctx, {
          head: ['Measure', 'Value', 'What it tells you'],
          body: [
            ['Debt to assets', m.totalAssets > 0 ? pctStr((m.totalLiabilities / m.totalAssets) * 100, 1) : 'n/a', 'Share of everything owned that is financed by debt. Lower is stronger.'],

        sec('Capital Allocation Observations');
        const obs = [];
        if (m.highApr.length) obs.push({ text: `Debt at 10% APR or higher totals ${money(sum(m.highApr, r => r.balance), 0)} across ${m.highApr.length} account${m.highApr.length === 1 ? '' : 's'}; the highest rate is ${m.highApr[0].institution} at ${num(m.highApr[0].interestRate)}%. Directing spare cash flow to the highest rate first (the avalanche method) minimizes interest paid.`, color: C.red });
        else obs.push({ text: 'No debts at 10% APR or higher were found.', color: C.green });
        if (m.idleCash.length) {
          const idle = sum(m.idleCash, r => r.balance), reserve = m.monthlyExpenses * 3;
          obs.push({ text: `${money(idle, 0)} sits in accounts yielding under 2%. A three-month reserve of recurring obligations is ${money(reserve, 0)}${idle > reserve ? `, so about ${money(idle - reserve, 0)} may be able to work harder in a higher-yield account` : ''}.`, color: C.gold });
        } else obs.push({ text: 'No low-yield cash balances were found.', color: C.green });
        bullets(ctx, obs);
        disclaimer(ctx, 'These observations are arithmetic on the figures recorded in the vault and are not personalized investment, tax or legal advice.');
        return finish(ctx);
      };

      // ---- 4. Budget & Cash Flow ----
      const buildBudget = (d, o = {}) => {
        const m = derive(d);
        const rate = m.income > 0 ? (m.cashflow / m.income) * 100 : null;
        const ctx = create(baseOpts(d, o, 'Budget Report', 'Budget & Cash Flow Report', 'Monthly income, recurring obligations and what is left over.',
          [
            { label: 'Monthly income', value: money(m.income, 0) },
            { label: 'Obligations', value: money(m.monthlyExpenses, 0), sub: 'Per month' },
            { label: 'Net cash flow', value: money(m.cashflow, 0), color: m.cashflow < 0 ? C.red : C.green, sub: 'Per month' },
            { label: 'Savings rate', value: rate === null ? 'n/a' : pctStr(rate, 0), sub: 'Of income' }
          ]));
        const { doc } = ctx;
        let n = 0; const sec = (t, e = {}) => h1(ctx, t, { num: ++n, ...e });
        sec('Cash Flow Summary');
        kpis(ctx, [
          { label: 'Monthly income', value: money(m.income, 0) },
          { label: 'Obligations', value: money(m.monthlyExpenses, 0), sub: money(m.monthlyExpenses * 12, 0) + ' per year', color: C.red, accent: C.red },
          { label: 'Net cash flow', value: money(m.cashflow, 0), color: m.cashflow < 0 ? C.red : C.green, accent: m.cashflow < 0 ? C.red : C.green },
          { label: 'Savings rate', value: rate === null ? 'n/a' : pctStr(rate, 0), sub: 'Of income' }
        ]);
        if (m.income > 0 && m.exps.length) {
          const spent = Math.min(100, (m.monthlyExpenses / m.income) * 100);
          setText(doc, { size: 8.6, style: 'bold', color: C.navy }); doc.text(`${spent.toFixed(0)}% of income is committed to recurring obligations`, P.mx, ctx.y + 3);
          ctx.y += 6; progress(doc, P.mx, ctx.y, CW, spent, spent > 85 ? C.red : spent > 65 ? C.amber : C.green, 4); ctx.y += 11;
        }
        if (m.cashflow < 0) callout(ctx, 'Shortfall', `Recurring obligations exceed monthly income by ${money(-m.cashflow, 0)}. Review the largest categories below.`, { tone: 'red' });
        const cats = {}; m.exps.forEach(e => { const k = e.category || 'Other'; cats[k] = (cats[k] || 0) + monthlyEquivalent(e); });
        sec('Spending by Category', { lead: 'Monthly equivalent of every recurring item; annual bills are divided by twelve.' });
        if (m.exps.length) hBars(ctx, Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value })));
        else empty(ctx, 'No recurring obligations recorded.');

        sec('Obligation Detail');
        if (m.exps.length) {
          const order = Object.keys(cats).sort((a, b) => cats[b] - cats[a]);
          const body = [];
          order.forEach(cat => {
            body.push([{ content: cat, colSpan: 4, styles: { fontStyle: 'bold', textColor: C.goldDk, fillColor: C.band } }, { content: money(cats[cat]), styles: { fontStyle: 'bold', textColor: C.goldDk, fillColor: C.band, halign: 'right' } }]);
            m.exps.filter(e => (e.category || 'Other') === cat).forEach(e => body.push([{ content: '   ' + (e.name || ''), styles: {} }, e.frequency === 'annual' ? 'Annual' : 'Monthly', dueLabel(e), money(e.amount), money(monthlyEquivalent(e))]));
          });
          table(ctx, { head: ['Obligation', 'Frequency', 'Due', 'Amount', 'Per month'], body, foot: ['Total', '', '', '', money(m.monthlyExpenses)], columns: { 0: { cellWidth: 62 }, 3: { halign: 'right' }, 4: { halign: 'right' } } });
        } else empty(ctx, 'Nothing to list yet.');

        const upcoming = m.exps.map(e => { const nx = nextExpenseOccurrence(e); return { e, nx, du: nx ? daysUntil(nx) : 9999 }; }).filter(x => x.du <= 30).sort((a, b) => a.du - b.du);
        sec('Due in the Next 30 Days');
        if (upcoming.length) {
          table(ctx, { head: ['Bill', 'Due date', 'In', 'Amount'], body: upcoming.map(({ e, nx, du }) => [{ content: e.name || '', styles: { fontStyle: 'bold' } }, fmtDate(nx), du === 0 ? 'Today' : du + ' day' + (du === 1 ? '' : 's'), money(e.amount)]), foot: ['Total due', '', '', money(sum(upcoming, x => x.e.amount))], columns: { 3: { halign: 'right' } } });
        } else empty(ctx, 'Nothing is due in the next 30 days.');
        disclaimer(ctx, 'Income is the figure entered in the Budget tab. Only recurring obligations recorded in the vault are included; irregular spending is not reflected.');
        return finish(ctx);
      };

      // ---- 5. Goals Progress ----
      const buildGoals = (d, o = {}) => {
        const goals = d.goals || [];
        const gm = goals.map(g => ({ g, k: goalMetrics(g, d) }));
        const reached = gm.filter(x => x.k.projection.reached).length;
        const avg = gm.length ? gm.reduce((s, x) => s + x.k.pct, 0) / gm.length : 0;
        const ctx = create(baseOpts(d, o, 'Goals Report', 'Goals Progress Report', 'Savings targets and debt payoff goals, with projected completion.',
          [
            { label: 'Goals', value: String(goals.length) },
            { label: 'Reached', value: String(reached), color: C.green },
            { label: 'Average progress', value: pctStr(avg, 0) },
            { label: 'Remaining to go', value: money(sum(gm, x => x.k.remaining), 0) }
          ]));
        const { doc } = ctx;
        let n = 0; const sec = (t, e = {}) => h1(ctx, t, { num: ++n, ...e });
        sec('Overview', { lead: `Status as of ${longDate(ctx.now)}.` });
        if (!goals.length) { empty(ctx, 'No goals have been created yet.'); return finish(ctx); }
        table(ctx, {
          head: ['Goal', 'Type', 'Current', 'Target', 'Progress', 'Target date'],

          setText(doc, { font: 'times', style: 'bold', size: 12.5, color: C.navy }); doc.text(safe(g.name), P.mx + 6, y + 7.5);

          cols.forEach(([l, v], i) => {
            const cx = P.mx + 6 + i * ((CW - 12) / 4);
            setText(doc, { style: 'bold', size: 6, color: C.muted }); doc.text(l.toUpperCase(), cx, y + 23, { charSpace: 0.7 });
            setText(doc, { style: 'bold', size: 9.4, color: C.ink }); doc.text(safe(v), cx, y + 27.6);
          });
          setText(doc, { size: 8.2, color: k.onTrack === false ? C.amber : C.muted, style: 'italic' });
          doc.text(projLines, P.mx + 6, y + 33.2);
          ctx.y += h + 4;
        });
        disclaimer(ctx, 'Projections extend the recent balance trend in a straight line and are estimates only.');
        return finish(ctx);
      };

      // ---- 6. Wealth Strategy ----
      const buildStrategy = (d, o = {}) => {
        const r = d.strategyReport || {};
        const m = derive(d);
        const ctx = create(baseOpts(d, o, 'Wealth Strategy Report', 'Wealth Strategy Report', 'An AI-assisted review of strengths, risks and strategies to consider.',

            { label: 'Net worth', value: money(m.netWorth, 0), color: m.netWorth < 0 ? C.red : C.navy },
            { label: 'Monthly cash flow', value: money(m.cashflow, 0), color: m.cashflow < 0 ? C.red : C.green },

          ]));
        const { doc } = ctx;
        let n = 0; const sec = (t, e = {}) => h1(ctx, t, { num: ++n, ...e });
        sec('Overview');

        ]);
        if (r.headline) callout(ctx, 'Summary', r.headline, { tone: 'gold', font: 'times', size: 11.2, style: 'normal' });

        // strengths / risks side by side when they fit, otherwise stacked
        const col = (title, items, color) => ({ title, items: (items || []).map(safe), color });
        const L = col('Strengths', r.strengths, C.green), R = col('Risks', r.risks, C.red);
        const colW = (CW - 8) / 2, size = 8.8, step = size * PT * 1.5;
        setText(doc, { size });
        const measure = (c) => c.items.reduce((h, t) => h + doc.splitTextToSize(t, colW - 7).length * step + 2, 0) + 12;
        if (L.items.length || R.items.length) {
          const hh = Math.max(measure(L), measure(R));
          if (hh < 120) {
            need(ctx, hh + 4);
            [L, R].forEach((c, i) => {
              const x = P.mx + i * (colW + 8); let y = ctx.y;
              doc.setFillColor(...C.band); doc.roundedRect(x, y, colW, hh, 1.8, 1.8, 'F');
              doc.setFillColor(...c.color); doc.rect(x + 4, y + 3.4, 7, 0.8, 'F');
              setText(doc, { style: 'bold', size: 7.4, color: c.color }); doc.text(c.title.toUpperCase(), x + 4, y + 9.4, { charSpace: 1 });
              y += 12.5;
              c.items.forEach(t => {
                const ls = doc.splitTextToSize(t, colW - 9);
                doc.setFillColor(...c.color); doc.circle(x + 5, y + step * 0.45, 0.8, 'F');
                setText(doc, { size, color: C.ink }); doc.text(ls, x + 8, y + size * PT * 0.85, { lineHeightFactor: 1.5 });
                y += ls.length * step + 2;
              });
            });
            ctx.y += hh + 7;
          } else {
            [L, R].forEach(c => { if (c.items.length) { h2(ctx, c.title); bullets(ctx, c.items.map(t => ({ text: t, color: c.color }))); } });
          }
        }

        sec('Strategies to Consider');
        const prio = { high: [C.red, 'HIGH'], medium: [C.amber, 'MEDIUM'], low: [C.muted, 'LOW'] };
        (r.strategies || []).forEach((s, i) => {
          const [pc, plabel] = prio[(s.priority || 'medium').toLowerCase()] || prio.medium;
          const w = CW - 12, sz = 8.6, st = sz * PT * 1.5;
          setText(doc, { size: sz });
          const rat = s.rationale ? doc.splitTextToSize(safe(s.rationale), w) : [];
          setText(doc, { size: sz, style: 'bold' });
          const act = s.action ? doc.splitTextToSize('Action: ' + safe(s.action), w) : [];
          setText(doc, { size: 8.2 });
          const imp = s.estimatedImpact ? doc.splitTextToSize('Estimated impact: ' + safe(s.estimatedImpact), w) : [];
          const h = 14 + (rat.length + act.length + imp.length) * st + (act.length ? 1.5 : 0) + (imp.length ? 1 : 0);
          need(ctx, h + 4);
          const y = ctx.y;
          doc.setFillColor(...C.band); doc.roundedRect(P.mx, y, CW, h, 1.8, 1.8, 'F');
          doc.setFillColor(...pc); doc.rect(P.mx, y + 0.7, 1.5, h - 1.4, 'F');
          setText(doc, { font: 'times', style: 'bold', size: 11.5, color: C.gold }); doc.text(String(i + 1).padStart(2, '0'), P.mx + 6, y + 8);
          setText(doc, { style: 'bold', size: 10.2, color: C.navy });
          const tl = doc.splitTextToSize(safe(s.title || ''), CW - 52);
          doc.text(tl[0] || '', P.mx + 16, y + 8);
          // priority pill
          doc.setFillColor(...pc); doc.roundedRect(P.mx + CW - 25, y + 3.4, 20, 5.4, 2.7, 2.7, 'F');
          setText(doc, { style: 'bold', size: 6.2, color: C.white }); doc.text(plabel, P.mx + CW - 15, y + 7.1, { align: 'center', charSpace: 0.7 });
          let ty = y + 13.5;
          setText(doc, { size: sz, color: C.ink }); doc.text(rat, P.mx + 6, ty, { lineHeightFactor: 1.5 }); ty += rat.length * st;
          if (act.length) { ty += 1.5; setText(doc, { size: sz, style: 'bold', color: C.green }); doc.text(act, P.mx + 6, ty, { lineHeightFactor: 1.5 }); ty += act.length * st; }
          if (imp.length) { ty += 1; setText(doc, { size: 8.2, style: 'italic', color: C.muted }); doc.text(imp, P.mx + 6, ty, { lineHeightFactor: 1.5 }); }
          ctx.y += h + 4;
        });
        if (r.cashflowNotes) { sec('Cashflow Notes'); para(ctx, r.cashflowNotes, { size: 9.4, gap: 4 }); }
        disclaimer(ctx, 'This report was generated by an AI model from the figures stored in the vault. It is informational only, may contain errors, and is not personalized investment, tax or legal advice. Verify any decision with a qualified professional.');
        return finish(ctx);
      };

      // ============================================================
      // EXCEL WORKBOOK
      // ============================================================
      const buildWorkbook = (d) => {
        const m = derive(d), wb = XLSX.utils.book_new();
        const addSheet = (name, rows, widths, moneyCols = [], pctCols = []) => {
          const ws = XLSX.utils.aoa_to_sheet(rows);
          ws['!cols'] = widths.map(w => ({ wch: w }));
          const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
          for (let r = 1; r <= range.e.r; r++) {
            moneyCols.forEach(c => { const cell = ws[XLSX.utils.encode_cell({ r, c })]; if (cell && typeof cell.v === 'number') cell.z = '$#,##0.00;[Red]-$#,##0.00'; });
            pctCols.forEach(c => { const cell = ws[XLSX.utils.encode_cell({ r, c })]; if (cell && typeof cell.v === 'number') cell.z = '0.00"%"'; });
          }
          ws['!freeze'] = { xSplit: 0, ySplit: 1 };
          XLSX.utils.book_append_sheet(wb, ws, name);
        };
        addSheet('Summary', [['Measure', 'Value'], ['Prepared', new Date().toISOString().slice(0, 10)], ['Total assets', m.totalAssets], ['Total liabilities', m.totalLiabilities], ['Net worth', m.netWorth], ['Monthly income', m.income], ['Monthly obligations', m.monthlyExpenses], ['Monthly cash flow', m.cashflow], ['Liquid cash', m.liquid]], [26, 18], [1]);
        const sm = XLSX.utils.decode_range(wb.Sheets['Summary']['!ref']);
        for (let r = 2; r <= sm.e.r; r++) { const c = wb.Sheets['Summary'][XLSX.utils.encode_cell({ r, c: 1 })]; if (c) c.z = '$#,##0.00;[Red]-$#,##0.00'; }
        addSheet('Accounts', [['Institution', 'Type', 'Category', 'Account #', 'APR %', 'Balance', 'Linked asset', 'Linked asset value', 'Equity', 'Statement date', 'Document on file', 'Notes'],
          ...m.recs.map(r => [r.institution || '', r.accountType || '', r.category === 'Asset' ? 'Asset' : 'Liability', r.accountNumberMasked || '', num(r.interestRate), num(r.balance), r.linkedAssetLabel || '', num(r.linkedAssetValue) || '', num(r.linkedAssetValue) > 0 ? num(r.linkedAssetValue) - (r.category === 'Asset' ? 0 : num(r.balance)) : '', r.statementDate || '', r.documentId ? 'Yes' : 'No', r.notes || ''])],
          [24, 14, 11, 14, 8, 15, 20, 18, 15, 14, 14, 40], [5, 7, 8], [4]);
        addSheet('Budget', [['Obligation', 'Category', 'Frequency', 'Due', 'Amount', 'Per month'],
          ...m.exps.map(e => [e.name || '', e.category || '', e.frequency === 'annual' ? 'Annual' : 'Monthly', dueLabel(e), num(e.amount), monthlyEquivalent(e)])], [30, 18, 11, 16, 14, 14], [4, 5]);
        addSheet('Goals', [['Goal', 'Type', 'Linked account', 'Current', 'Target', 'Remaining', 'Progress %', 'Target date', 'Projection'],
          ...(d.goals || []).map(g => { const k = goalMetrics(g, d); return [g.name || '', k.isSavings ? 'Savings' : 'Debt payoff', k.linked ? k.linked.institution : 'Manual', k.current, k.target, k.remaining, Math.round(k.pct * 10) / 10, g.targetDate || '', k.projection.text]; })], [26, 12, 20, 14, 14, 14, 11, 12, 50], [3, 4, 5], [6]);
        addSheet('Contacts', [['Name', 'Role', 'Phone', 'Email', 'Notes'], ...(d.contacts || []).map(c => [c.name || '', c.role || '', c.phone || '', c.email || '', c.notes || ''])], [24, 20, 16, 28, 40]);
        addSheet('Net worth history', [['Date', 'Net worth'], ...m.history.map(h => [h.date, num(h.netWorth)])], [14, 16], [1]);
        return wb;
      };

      // ============================================================
      // REGISTRY
      // ============================================================
      const REPORTS = [
        { id: 'settlement', title: 'Estate Settlement Package', desc: 'The complete executor file: summary, instructions, contacts, ledger, obligations, documents and sign-off page.', icon: 'file-text', file: 'Estate_Settlement_Package', build: buildSettlement },

      ];

      const localStamp = () => { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); };

        const doc = rep.build(d, o);

      return { REPORTS, make, buildWorkbook, readiness, derive, safe, money };
    })();
    // <<< REPORT KIT <<<

        setEditingGoalId(g.id);
