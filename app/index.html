        requestConfirm({
          title: 'Delete Goal',
          message: 'Delete this goal? Its progress history goes with it.',
          confirmLabel: 'Delete',
          danger: true,
          onConfirm: () => performDeleteGoal(id)
        });
      };

      const handleUpdateManualGoalAmount = async (goal, newValueRaw) => {
        const newValue = parseFloat(newValueRaw);
        if (isNaN(newValue)) return;
        const today = isoToday();
        const history = Array.isArray(goal.manualHistory) ? goal.manualHistory : [];
        const filteredHistory = history.filter(h => h.date !== today);
        const updated = {
          ...goal,
          manualCurrentAmount: newValue,
          manualHistory: [...filteredHistory, { date: today, value: newValue }],
          updatedAt: new Date().toISOString()
        };
        await saveDBItem(STORES.GOALS, updated);
        loadAllData();
        showToast('success', 'Goal progress updated.');
      };

      // ---------------- BACKUP / RESTORE ----------------
      const exportJsonBackup = async () => {
        const backupData = {
          version: '5.0',
          exportedAt: new Date().toISOString(),
          monthlyIncome,
          notes,
          records,
          expenses,
          documents,
          contacts,
          networthHistory,
          accountHistory,
          goals
        };

        const jsonStr = JSON.stringify(backupData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Financial_Vault_Backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);

        const nowIso = new Date().toISOString();
        try { localStorage.setItem('last_backup_at', nowIso); } catch (e) { /* storage unavailable */ }
        setLastBackupAt(nowIso);
        showToast('success', 'Backup downloaded — saved to your device.');
      };

      // ---------------- SMART RESTORE (merge vs. replace, with per-conflict review) ----------------
      const RESTORE_ENTITY_CONFIG = [
        { key: 'records', store: STORES.ACCOUNTS, label: 'Accounts', summarize: (r) => `${r.institution} (${r.accountType}) — $${(r.balance || 0).toLocaleString('en-US', { minimumFractionDigits: 2 })}` },
        { key: 'expenses', store: STORES.EXPENSES, label: 'Expenses', summarize: (e) => `${e.name} — $${(e.amount || 0).toLocaleString('en-US', { minimumFractionDigits: 2 })}/${e.frequency === 'annual' ? 'yr' : 'mo'}` },
        { key: 'contacts', store: STORES.CONTACTS, label: 'Contacts', summarize: (c) => `${c.name}${c.role ? ' (' + c.role + ')' : ''}` },
        { key: 'goals', store: STORES.GOALS, label: 'Goals', summarize: (g) => `${g.name} — target $${(g.targetAmount || 0).toLocaleString('en-US', { minimumFractionDigits: 0 })}` },
        { key: 'documents', store: STORES.DOCUMENTS, label: 'Documents', summarize: (d) => d.fileName || 'Untitled document' }
      ];

      const diffEntityList = (currentList, backupList) => {
        const currentById = new Map((currentList || []).map(item => [item.id, item]));
        const backupById = new Map((backupList || []).map(item => [item.id, item]));
        const onlyInBackup = [];
        const onlyInCurrent = [];
        const conflicts = [];
        for (const [id, backupItem] of backupById) {
          if (currentById.has(id)) {
            const currentItem = currentById.get(id);
            if (JSON.stringify(currentItem) !== JSON.stringify(backupItem)) {
              const curT = currentItem.updatedAt, bakT = backupItem.updatedAt;
              const defaultSide = (curT && bakT) ? (curT >= bakT ? 'current' : 'backup') : 'current';
              conflicts.push({ id, current: currentItem, backup: backupItem, defaultSide });
            }
          } else {
            onlyInBackup.push(backupItem);
          }
        }
        for (const [id, currentItem] of currentById) {
          if (!backupById.has(id)) onlyInCurrent.push(currentItem);
        }
        return { onlyInBackup, onlyInCurrent, conflicts };
      };

      const buildRestorePreview = (backupData) => {
        const entities = {};
        for (const cfg of RESTORE_ENTITY_CONFIG) {
          const currentList = { records, expenses, documents, contacts, goals }[cfg.key];
          entities[cfg.key] = diffEntityList(currentList, backupData[cfg.key]);
        }
        const scalarDiffs = {};
        if (backupData.notes !== undefined && backupData.notes !== notes) {
          scalarDiffs.notes = { current: notes, backup: backupData.notes };
        }
        if (backupData.monthlyIncome !== undefined && Number(backupData.monthlyIncome) !== Number(monthlyIncome)) {
          scalarDiffs.monthlyIncome = { current: monthlyIncome, backup: backupData.monthlyIncome };
        }
        const allUpdatedAts = [...records, ...expenses, ...contacts, ...goals].map(x => x.updatedAt).filter(Boolean);
        const mostRecentCurrentUpdate = allUpdatedAts.length ? allUpdatedAts.sort().slice(-1)[0] : null;
        const totalConflicts = Object.values(entities).reduce((a, e) => a + e.conflicts.length, 0) + Object.keys(scalarDiffs).length;
        return { backupData, entities, scalarDiffs, mostRecentCurrentUpdate, totalConflicts };
      };

      const handleRestoreBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = JSON.parse(evt.target.result);
            const preview = buildRestorePreview(data);
            setRestorePreview(preview);
            setRestoreStep('overview');
            setRestoreConflictChoices({});
          } catch (err) {
            console.error('Failed to parse backup:', err);
            showToast('error', 'Invalid backup JSON file.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const closeRestoreFlow = () => {
        setRestorePreview(null);
        setRestoreStep(null);
        setRestoreConflictChoices({});
      };

      const performReplaceRestore = async () => {
        const data = restorePreview.backupData;
        try {
          if (Array.isArray(data.records)) { await clearStore(STORES.ACCOUNTS); for (const rec of data.records) await saveDBItem(STORES.ACCOUNTS, rec); }
          if (Array.isArray(data.expenses)) { await clearStore(STORES.EXPENSES); for (const exp of data.expenses) await saveDBItem(STORES.EXPENSES, exp); }
          if (Array.isArray(data.documents)) { await clearStore(STORES.DOCUMENTS); for (const doc of data.documents) await saveDBItem(STORES.DOCUMENTS, doc); }
          if (Array.isArray(data.contacts)) { await clearStore(STORES.CONTACTS); for (const c of data.contacts) await saveDBItem(STORES.CONTACTS, c); }
          if (Array.isArray(data.networthHistory)) { await clearStore(STORES.NETWORTH_HISTORY); for (const h of data.networthHistory) await saveDBItem(STORES.NETWORTH_HISTORY, h); }
          if (Array.isArray(data.accountHistory)) { await clearStore(STORES.ACCOUNT_HISTORY); for (const h of data.accountHistory) await saveDBItem(STORES.ACCOUNT_HISTORY, h); }
          if (Array.isArray(data.goals)) { await clearStore(STORES.GOALS); for (const g of data.goals) await saveDBItem(STORES.GOALS, g); }
          if (data.monthlyIncome) { setMonthlyIncome(data.monthlyIncome); localStorage.setItem('monthly_income', data.monthlyIncome); }
          if (data.notes) { setNotes(data.notes); localStorage.setItem('executor_notes', data.notes); }
          await loadAllData();
          showToast('success', 'Vault replaced with backup contents.');
          closeRestoreFlow();
          setIsSettingsOpen(false);
        } catch (err) {
          console.error('Replace restore failed:', err);
          showToast('error', 'Restore failed: ' + err.message);
        }
      };

      const handleReplaceClick = () => {
        const counts = RESTORE_ENTITY_CONFIG.map(cfg => `${restorePreview.entities[cfg.key].onlyInCurrent.length} ${cfg.label.toLowerCase()}`).filter(s => !s.startsWith('0')).join(', ');
        requestConfirm({
          title: 'Replace Everything',
          message: `This deletes your current vault and loads the backup exactly as-is${counts ? ` — including removing ${counts} that only exist in your current vault, not in this backup` : ''}. This cannot be undone.`,
          confirmLabel: 'Replace Everything',
          danger: true,
          onConfirm: performReplaceRestore
        });
      };

      const handleMergeClick = () => {
        if (restorePreview.totalConflicts > 0) {
          setRestoreStep('conflicts');
        } else {
          performMergeRestore({});
        }
      };

      const performMergeRestore = async (choices) => {
        try {
          const data = restorePreview.backupData;
          for (const cfg of RESTORE_ENTITY_CONFIG) {
            const diff = restorePreview.entities[cfg.key];
            for (const item of diff.onlyInBackup) await saveDBItem(cfg.store, item);
            for (const conflict of diff.conflicts) {
              const chosen = (choices[cfg.key] && choices[cfg.key][conflict.id]) || conflict.defaultSide;
              await saveDBItem(cfg.store, chosen === 'backup' ? conflict.backup : conflict.current);
            }
          }
          // History stores: append-only trend data — union by key, current wins on same-key collision.
          if (Array.isArray(data.networthHistory)) {
            const existingDates = new Set(networthHistory.map(h => h.date));
            for (const h of data.networthHistory) if (!existingDates.has(h.date)) await saveDBItem(STORES.NETWORTH_HISTORY, h);
          }
          if (Array.isArray(data.accountHistory)) {
            const existingIds = new Set(accountHistory.map(h => h.id));
            for (const h of data.accountHistory) if (!existingIds.has(h.id)) await saveDBItem(STORES.ACCOUNT_HISTORY, h);
          }
          // Scalars
          if (restorePreview.scalarDiffs.notes) {
            const chosen = choices.notes || 'current';
            if (chosen === 'backup') { setNotes(data.notes); localStorage.setItem('executor_notes', data.notes); }
          }
          if (restorePreview.scalarDiffs.monthlyIncome) {
            const chosen = choices.monthlyIncome || 'current';
            if (chosen === 'backup') { setMonthlyIncome(data.monthlyIncome); localStorage.setItem('monthly_income', data.monthlyIncome); }
          }
          await loadAllData();
          showToast('success', 'Vault merged with backup.');
          closeRestoreFlow();
          setIsSettingsOpen(false);
        } catch (err) {
          console.error('Merge restore failed:', err);
          showToast('error', 'Merge failed: ' + err.message);
        }
      };

      const performPurgeDatabase = async () => {
        await clearStore(STORES.ACCOUNTS);
        await clearStore(STORES.EXPENSES);

        await clearStore(STORES.CONTACTS);

      const handlePurgeDatabase = () => {

      // ---------------- FILE UPLOAD / AI PARSING ----------------
      const handleFileUpload = async (e, existingAccountId) => {
        const file = e.target.files[0];
        if (!file) return;
        setParsing(true);
        setParseError('');

        const fileNameClean = file.name.replace(/\.[^/.]+$/, "").toUpperCase();
        const lowerName = file.name.toLowerCase();
        const isCSV = file.type === 'text/csv' || lowerName.endsWith('.csv');
        const isPDF = file.type === 'application/pdf' || lowerName.endsWith('.pdf');
        const isImage = file.type.startsWith('image/');
        const isSpreadsheet = lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls');

        try {
          if (isCSV) {
            const dataUrl = await fileToDataUrl(file);
            Papa.parse(file, {
              complete: (results) => {
                let detectedBalance = 0;
                let latestDate = '';
                results.data.forEach((row) => {
                  Object.values(row).forEach((v) => {
                    const num = parseFloat(v);
                    if (!isNaN(num) && num > 0 && num > detectedBalance) detectedBalance = num;
                    if (typeof v === 'string' && /\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(v)) {
                      const iso = normalizeToISODate(v);
                      if (iso && (!latestDate || iso > latestDate)) latestDate = iso;
                    }
                  });
                });

                setPendingParsedData({
                  fileName: file.name,
                  existingAccountId: existingAccountId || null,
                  documentId: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).documentId : null,
                  newFile: { fileName: file.name, mimeType: file.type || 'text/csv', dataUrl },
                  documentType: 'statement',
                  institution: fileNameClean,
                  accountType: 'Credit Card',
                  category: 'Liability',
                  accountNumberMasked: 'Parsed CSV',
                  balance: detectedBalance || 0,
                  interestRate: 19.99,
                  statementDate: latestDate,
                  notes: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).notes || '' : '',
                  recurringCharges: [],
                  linkedAssetLabel: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetLabel || '' : '',
                  linkedAssetValue: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetValue || '' : '',
                  loginUrl: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).loginUrl || '' : ''
                });
                setParsing(false);
              }
            });
          } else if (isPDF) {
            const dataUrl = await fileToDataUrl(file);
            const arrayBuf = await file.arrayBuffer();
            const typedArray = new Uint8Array(arrayBuf);
            const pdf = await pdfjsLib.getDocument(typedArray).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              fullText += textContent.items.map((item) => item.str).join(' ') + ' ';
            }

            let extracted = null;
            if (groqApiKey) {
              try {
                extracted = await extractWithGroqText(fullText, groqApiKey, textModel);
              } catch (err) {
                console.error('Groq extraction failed, falling back to regex:', err);

              }
            }

            setPendingParsedData({
              fileName: file.name,
              existingAccountId: existingAccountId || null,
              documentId: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).documentId : null,
              newFile: { fileName: file.name, mimeType: 'application/pdf', dataUrl },
              documentType: extracted.documentType || 'statement',
              institution: extracted.institution || fileNameClean,
              accountType: extracted.accountType || 'Checking',
              category: extracted.category || 'Asset',
              accountNumberMasked: extracted.accountNumberMasked || '',
              balance: extracted.balance || 0,
              interestRate: extracted.interestRate || 0,
              statementDate: extracted.statementDate || '',
              dueDay: extracted.dueDay || null,
              notes: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).notes || '' : '',
              recurringCharges: normalizeRecurringCharges(extracted.recurringCharges),
              linkedAssetLabel: extracted.linkedAssetLabel || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetLabel || '' : ''),
              linkedAssetValue: extracted.linkedAssetValue || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetValue || '' : ''),
              loginUrl: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).loginUrl || '' : ''
            });
            setParsing(false);
          } else if (isImage) {

            let extracted = null;
            if (groqApiKey) {
              try {
                extracted = await extractWithGroqVision(dataUrl, groqApiKey, visionModel);
              } catch (err) {
                console.error('Groq vision extraction failed:', err);
                setParseError('AI image parsing failed (' + err.message + '). Enter the details manually below — the image is still saved as a document.' + groqErrorHint(err));
              }
            } else {
              setParseError('No Groq API key set, so this image could not be auto-read. Add a key in Settings, or enter the details manually below — the image is still saved as a document.');
            }
            if (!extracted) {
              extracted = {
                documentType: 'other',
                institution: fileNameClean,
                accountType: 'Checking',
                category: 'Asset',
                accountNumberMasked: '',
                balance: 0,
                interestRate: 0,
                statementDate: '',
                dueDay: null
              };
            }

            setPendingParsedData({
              fileName: file.name,
              existingAccountId: existingAccountId || null,
              documentId: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).documentId : null,
              newFile: { fileName: file.name, mimeType: file.type, dataUrl },
              documentType: extracted.documentType || 'other',
              institution: extracted.institution || fileNameClean,
              accountType: extracted.accountType || 'Checking',
              category: extracted.category || 'Asset',
              accountNumberMasked: extracted.accountNumberMasked || '',
              balance: extracted.balance || 0,
              interestRate: extracted.interestRate || 0,
              statementDate: extracted.statementDate || '',
              notes: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).notes || '' : '',
              recurringCharges: normalizeRecurringCharges(extracted.recurringCharges),
              linkedAssetLabel: extracted.linkedAssetLabel || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetLabel || '' : ''),
              linkedAssetValue: extracted.linkedAssetValue || (existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).linkedAssetValue || '' : ''),
              loginUrl: existingAccountId ? (records.find(r => r.id === existingAccountId) || {}).loginUrl || '' : ''
            });
            setParsing(false);
          } else if (isSpreadsheet) {
            showToast('error', 'Excel files go in the Budget & Expenses tab — use "Import Budget Spreadsheet" there for multi-row budgets. This dropzone is for single-account statements (PDF, CSV, or a photo).');
            setParsing(false);
          } else {
            showToast('error', 'Unsupported file type. Please upload a PDF, CSV, or image (JPG/PNG).');
            setParsing(false);
          }
        } catch (err) {
          console.error('Error handling upload:', err);
          setParseError('Could not process this file: ' + err.message);
          setParsing(false);

          e.target.value = '';

      };

      const triggerReplaceUpload = (accountId) => {

      };

      // ---------------- BUDGET SPREADSHEET IMPORT ----------------
      const parseSpreadsheetToRows = (file) => {
        const lowerName = file.name.toLowerCase();
        const isCSV = file.type === 'text/csv' || lowerName.endsWith('.csv');
        const isSpreadsheet = lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls');

        if (isCSV) {
          return new Promise((resolve, reject) => {
            Papa.parse(file, {
              header: true,
              skipEmptyLines: true,
              complete: (results) => resolve(results.data),
              error: reject
            });
          });
        }
        if (isSpreadsheet) {
          return file.arrayBuffer().then((buf) => {
            const wb = XLSX.read(buf, { type: 'array', cellDates: true });
            const firstSheet = wb.Sheets[wb.SheetNames[0]];
            return XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
          });
        }
        return Promise.reject(new Error('That file doesn\'t look like a .csv, .xlsx, or .xls — please pick a budget spreadsheet.'));
      };

      const handleBudgetFileUpload = async (e) => {
        const file = e.target.files[0];

        setBudgetImportLoading(true);
        setBudgetImportError('');

        try {
          const rows = await parseSpreadsheetToRows(file);
          const cleanRows = rows.filter(r => Object.values(r).some(v => String(v).trim() !== ''));
          if (cleanRows.length === 0) {
            setBudgetImportError('No rows found in that file.');
            setBudgetImportLoading(false);
            e.target.value = '';
            return;
          }

          // Heuristic mapping covers every row as a baseline — AI mapping (when available)
          // then improves as many of those rows as fit in one reasonably-sized request.
          let mapped = heuristicMapBudgetRows(cleanRows);
          if (groqApiKey) {
            try {
              const headers = Object.keys(cleanRows[0]);
              const sampleSize = Math.min(cleanRows.length, 60); // keeps the request well under strict per-minute output limits
              const sample = cleanRows.slice(0, sampleSize);
              const result = await callGroq(groqApiKey, {
                model: textModel,
                temperature: 0.1,
                max_tokens: Math.min(3500, 150 + sampleSize * 35),
                response_format: { type: 'json_object' },
                messages: [
                  { role: 'system', content: buildBudgetImportSystemPrompt() },
                  { role: 'user', content: JSON.stringify({ headers, rows: sample }) }
                ]
              });
              if (result && Array.isArray(result.rows) && result.rows.length === sample.length) {
                mapped = [...result.rows, ...mapped.slice(sampleSize)];
                if (cleanRows.length > sampleSize) {
                  setBudgetImportError(`AI mapped the first ${sampleSize} rows; the remaining ${cleanRows.length - sampleSize} used basic header matching instead — please double-check those.`);
                }
              }
            } catch (err) {
              console.error('AI budget mapping failed, falling back to heuristic matching:', err);
              setBudgetImportError('AI column mapping failed (' + err.message + ') — used basic header matching instead. Please double-check the rows below.' + groqErrorHint(err));
            }
          }

          const reviewRows = mapped.map((r, i) => ({
            uid: 'bi_' + Date.now() + '_' + i,
            name: r.name || '',
            category: CATEGORIES.includes(r.category) ? r.category : autoCategorize(r.name || ''),
            amount: r.amount || 0,
            frequency: r.frequency === 'annual' ? 'annual' : 'monthly',
            dueDay: r.dueDay || '',
            dueMonth: r.dueMonth || '',
            include: !r.skip && !!r.name && parseFloat(r.amount) > 0
          }));

          setBudgetImportRows(reviewRows);
          setBudgetImportOpen(true);
        } catch (err) {
          console.error('Failed to parse budget file:', err);
          setBudgetImportError('Could not read that file: ' + err.message);
        } finally {
          setBudgetImportLoading(false);
          e.target.value = '';
        }
      };

      const handleConfirmBudgetImport = async () => {
        const included = budgetImportRows.filter(r => r.include && r.name && parseFloat(r.amount) > 0);
        for (let i = 0; i < included.length; i++) {
          const r = included[i];
          await saveDBItem(STORES.EXPENSES, {
            id: 'exp_' + Date.now() + '_' + i,
            name: r.name,
            category: CATEGORIES.includes(r.category) ? r.category : 'Other',
            amount: parseFloat(r.amount) || 0,
            frequency: r.frequency === 'annual' ? 'annual' : 'monthly',
            dueDay: parseInt(r.dueDay, 10) || 1,
            dueMonth: r.frequency === 'annual' ? (parseInt(r.dueMonth, 10) || 1) : null,
            autoPay: true,
            updatedAt: new Date().toISOString()
          });
        }
        setBudgetImportOpen(false);
        setBudgetImportRows([]);
        loadAllData();
        showToast('success', `Imported ${included.length} expense${included.length === 1 ? '' : 's'}.`);

      const updateBudgetImportRow = (uid, patch) => {
        setBudgetImportRows(prev => prev.map(r => r.uid === uid ? { ...r, ...patch } : r));
      };

      // ---------------- DERIVED DATA ----------------
      const totalAssets = records.filter(r => r.category === 'Asset').reduce((acc, r) => acc + r.balance, 0)
        + records.reduce((acc, r) => acc + (parseFloat(r.linkedAssetValue) || 0), 0);
      const totalLiabilities = records.filter(r => r.category !== 'Asset').reduce((acc, r) => acc + r.balance, 0);
      const netWorth = totalAssets - totalLiabilities;
      const linkedAssetTotal = records.reduce((acc, r) => acc + (parseFloat(r.linkedAssetValue) || 0), 0);
      const totalFixedExpenses = expenses.reduce((acc, e) => acc + monthlyEquivalent(e), 0);
      const monthlyNetCashflow = monthlyIncome - totalFixedExpenses;

      const filteredExpenses = expenses.filter(exp => {
        const matchesCat = expenseCategoryFilter === 'All' || exp.category === expenseCategoryFilter;
        const matchesQuery = exp.name.toLowerCase().includes(expenseSearchQuery.toLowerCase());
        return matchesCat && matchesQuery;
      });

      const highInterestDebts = records.filter(r => r.category !== 'Asset' && r.interestRate >= 10);
      const liquidCash = records.filter(r => r.category === 'Asset' && r.interestRate < 2);

      const staleAccounts = records
        .map(r => ({ ...r, staleness: getStaleness(r.statementDate, staleDays) }))
        .filter(r => r.staleness.isStale)
        .sort((a, b) => (b.staleness.age || 9999) - (a.staleness.age || 9999));

      const upcomingBills = expenses
        .map(exp => {
          const nextDate = nextExpenseOccurrence(exp);
          return { ...exp, nextDate, daysUntil: daysUntil(nextDate) };
        })
        .filter(exp => exp.nextDate && exp.daysUntil <= 14)
        .sort((a, b) => a.daysUntil - b.daysUntil);

      const dueSoonTotal = upcomingBills.filter(b => b.daysUntil <= 7).reduce((a, b) => a + b.amount, 0);

      const getDocumentForAccount = (accountId) => documents.find(d => d.accountId === accountId);

      // Single plain-object view of everything the reports need
      const reportData = () => ({ owner: reportOwner, monthlyIncome, staleDays, lastBackupAt, notes, records, expenses, documents, contacts, networthHistory, accountHistory, goals, strategyReport });

      // Continuity readiness checklist
      const accountsWithDocs = records.filter(r => r.documentId).length;
      const accountsCurrent = records.filter(r => !getStaleness(r.statementDate, staleDays).isStale).length;
      const backupAgeDays = lastBackupAt ? daysBetween(lastBackupAt.slice(0, 10)) : null;
      const isBackupStale = backupAgeDays === null || backupAgeDays > BACKUP_STALE_DAYS;
      const readinessItems = ReportKit.readiness(reportData()).items;

      // ---------------- REPORT EXPORT (PDF / print / Excel) ----------------
      const exportReport = (id, mode = 'download') => {
        const rep = ReportKit.REPORTS.find(r => r.id === id);
        if (!rep) return;
        if (rep.needs === 'strategyReport' && !strategyReport) {
          showToast('error', 'Generate a Wealth Strategy report first (Strategy tab).');
          return;
        }
        // Open the print tab synchronously inside the click so pop-up blockers allow it.
        let win = null;
        if (mode === 'print') { try { win = window.open('', '_blank'); } catch (e) { win = null; } }
        try {
          const out = ReportKit.make(id, reportData(), { cover: reportCover });
          if (mode === 'print') {
            const url = URL.createObjectURL(out.doc.output('blob'));
            if (win) {
              win.location.href = url;
              showToast('info', 'Opened in a new tab. Use its print button to print.');
            } else {
              out.doc.save(out.filename);
              showToast('info', 'Pop-ups are blocked, so the PDF was downloaded. Open it to print.');
            }
          } else {
            out.doc.save(out.filename);
            showToast('success', `${rep.title} downloaded.`);
          }
        } catch (err) {
          if (win) { try { win.close(); } catch (e) {} }
          console.error('Report failed:', err);
          showToast('error', 'Could not build the report: ' + err.message);
        }
      };

      const exportWorkbook = () => {
        try {
          const wb = ReportKit.buildWorkbook(reportData());
          const n = new Date(); const stamp = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
          XLSX.writeFile(wb, `Financial_Vault_Data_${stamp}.xlsx`);
          showToast('success', 'Excel workbook downloaded.');
        } catch (err) {
          console.error('Workbook export failed:', err);
          showToast('error', 'Could not build the workbook: ' + err.message);
        }
      };

      const generateExecutorPDF = () => exportReport('settlement');

      // ---------------- WEALTH STRATEGY (GROQ GOALS REPORT) ----------------
      const buildFinancialSnapshot = () => ({
        monthlyIncome,
        monthlyNetCashflow,
        totalAssets,
        totalLiabilities,
        netWorth,
        accounts: records.map(r => ({
          institution: r.institution,
          type: r.accountType,
          category: r.category,
          balance: r.balance,
          interestRate: r.interestRate,
          statementAgeDays: getStaleness(r.statementDate, staleDays).age,
          linkedAssetLabel: r.linkedAssetLabel || undefined,
          linkedAssetValue: parseFloat(r.linkedAssetValue) || undefined,
          equity: parseFloat(r.linkedAssetValue) > 0 ? (parseFloat(r.linkedAssetValue) - r.balance) : undefined
        })),
        monthlyExpensesByCategory: CATEGORIES.map(c => ({
          category: c,
          total: expenses.filter(e => e.category === c).reduce((a, e) => a + monthlyEquivalent(e), 0)
        })).filter(c => c.total > 0),
        netWorthHistory: networthHistory.slice(-12).map(h => ({ date: h.date, netWorth: h.netWorth }))
      });

      const generateWealthStrategy = async () => {
        if (!groqApiKey) {
          setStrategyError('Add a Groq API key in Settings to generate a wealth strategy report.');
          return;
        }
        setStrategyLoading(true);
        setStrategyError('');
        try {
          const payload = buildFinancialSnapshot();

          const result = await callGroq(groqApiKey, {
            model: textModel,
            temperature: 0.3,
            max_tokens: 1800, // headline + strengths + risks + several strategies + cashflow notes
            response_format: { type: 'json_object' },
            messages: [
              { role: 'system', content: buildWealthStrategySystemPrompt() },
              { role: 'user', content: JSON.stringify(payload) }
            ]
          });

          if (!result) throw new Error('Could not parse the AI response.');

          const report = { ...result, generatedAt: new Date().toISOString() };
          setStrategyReport(report);
          localStorage.setItem('wealth_strategy_report', JSON.stringify(report));
        } catch (err) {
          console.error('Wealth strategy generation failed:', err);
          setStrategyError('Report generation failed: ' + err.message + '.' + groqErrorHint(err));
        } finally {
          setStrategyLoading(false);
        }
      };

      const handleSendStrategyChat = async (e) => {
        e.preventDefault();
        const question = strategyChatInput.trim();
        if (!question || strategyChatLoading) return;

        if (!groqApiKey) {
          showToast('error', 'Add a Groq API key in Settings to use the advisor chat.');
          return;
        }

        const userMsg = { role: 'user', content: question };
        const updatedMessages = [...strategyChatMessages, userMsg];
        setStrategyChatMessages(updatedMessages);
        setStrategyChatInput('');
        setStrategyChatLoading(true);

        try {
          const contextPayload = { ...buildFinancialSnapshot(), strategyReport };
          const replyText = await callGroqText(groqApiKey, {
            model: textModel,
            temperature: 0.4,
            max_tokens: 900, // a focused conversational reply, not another full report
            messages: [
              { role: 'system', content: buildAdvisorChatSystemPrompt(contextPayload) },
              ...updatedMessages
            ]
          });
          setStrategyChatMessages(prev => [...prev, { role: 'assistant', content: replyText || "I didn't get a usable response — try asking again." }]);
        } catch (err) {
          console.error('Advisor chat failed:', err);
          setStrategyChatMessages(prev => [...prev, { role: 'assistant', content: `Something went wrong reaching Groq: ${err.message}${groqErrorHint(err)}` }]);
        } finally {
          setStrategyChatLoading(false);
        }
      };

      const generateStrategyPDF = () => exportReport('strategy');

      // ---------------- SMALL COMPONENTS ----------------
      const ReportBar = ({ ids }) => (
        <div className="no-print flex flex-wrap items-center justify-end gap-2 -mb-2">
          <span className="text-[10px] uppercase tracking-wider text-slate-500 mr-1">Report</span>
          {ids.map(id => {
            const rep = ReportKit.REPORTS.find(r => r.id === id);
            return (
              <div key={id} className="flex items-center rounded-lg overflow-hidden border border-slate-700 text-xs">
                <button onClick={() => exportReport(id)} className="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 transition" title={`Download ${rep.title} as PDF`}>
                  <i data-lucide="download" className="w-3.5 h-3.5"></i> {rep.title}
                </button>
                <button onClick={() => exportReport(id, 'print')} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 border-l border-slate-700 transition" title="Print">
                  <i data-lucide="printer" className="w-3.5 h-3.5"></i>
                </button>
              </div>
            );
          })}
          <button onClick={() => setReportsOpen(true)} className="text-xs text-emerald-400 hover:text-emerald-300 px-2 py-1.5">All reports</button>
        </div>
      );

      const StaleBadge = ({ statementDate }) => {
        const s = getStaleness(statementDate, staleDays);
        if (!s.known) {
          return <span className="text-[10px] bg-slate-700 text-slate-400 px-1.5 py-0.5 rounded">No date on file</span>;
        }
        if (s.isStale) {
          return <span className="text-[10px] bg-rose-500/10 text-rose-400 px-1.5 py-0.5 rounded">{s.age}d old — update</span>;
        }
        return <span className="text-[10px] bg-emerald-500/10 text-emerald-400 px-1.5 py-0.5 rounded">Current ({s.age}d)</span>;
      };

      const NetWorthChart = () => {
        if (networthHistory.length < 2) {
          return <p className="text-xs text-slate-400">Net worth trend will appear here once at least two days of vault activity are recorded.</p>;
        }
        const w = 100;
        const values = networthHistory.map(entry => entry.netWorth);
        const min = Math.min(...values);
        const max = Math.max(...values);
        const range = (max - min) || 1;
        const pts = networthHistory.map((entry, i) => {
          const x = (i / (networthHistory.length - 1)) * w;
          const yVal = 34 - ((entry.netWorth - min) / range) * 34;
          return `${x},${yVal}`;
        }).join(' ');
        const first = networthHistory[0];
        const last = networthHistory[networthHistory.length - 1];
        const delta = last.netWorth - first.netWorth;
        return (
          <div>
            <svg viewBox="0 0 100 34" className="w-full h-20" preserveAspectRatio="none">
              <polyline points={pts} fill="none" stroke={delta >= 0 ? '#34d399' : '#fb7185'} strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
            </svg>
            <div className="flex justify-between text-[10px] text-slate-400 mt-1">
              <span>{first.date}: ${first.netWorth.toLocaleString('en-US', { maximumFractionDigits: 0 })}</span>
              <span className={delta >= 0 ? 'text-emerald-400' : 'text-rose-400'}>
                {delta >= 0 ? '+' : ''}{delta.toLocaleString('en-US', { maximumFractionDigits: 0 })} since first snapshot
              </span>
              <span>{last.date}: ${last.netWorth.toLocaleString('en-US', { maximumFractionDigits: 0 })}</span>
            </div>
          </div>
        );
      };

      // Tiny inline sparkline for a single account's balance history — no labels, just the shape.
      const AccountSparkline = ({ accountId, desirableDirection = 'down' }) => {
        const points = accountHistory.filter(h => h.accountId === accountId).sort((a, b) => a.date.localeCompare(b.date));
        if (points.length < 2) return null;
        const values = points.map(p => p.balance);
        const min = Math.min(...values);
        const max = Math.max(...values);
        // A flat line (no real balance movement yet) conveys nothing and just
        // looks like a stray design artifact — skip it until there's an actual trend.
        if (max === min) return null;
        const range = max - min;
        const w = 60, h = 18;
        const pts = points.map((p, i) => {
          const x = (i / (points.length - 1)) * w;
          const y = h - ((p.balance - min) / range) * h;
          return `${x},${y}`;
        }).join(' ');
        const delta = values[values.length - 1] - values[0];
        const improved = desirableDirection === 'down' ? delta <= 0 : delta >= 0;
        return (
          <svg viewBox={`0 0 ${w} ${h}`} className="w-14 h-4 inline-block align-middle ml-2" preserveAspectRatio="none">
            <title>Balance trend over the last {points.length} recorded day{points.length === 1 ? '' : 's'}: {improved ? 'improving' : 'worsening'}</title>
            <polyline points={pts} fill="none" stroke={improved ? '#34d399' : '#fb7185'} strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
          </svg>
        );
      };

      // Fuller labeled chart — used in the account edit modal and on goal cards.
      const MiniLineChart = ({ points, valueKey = 'value', dateKey = 'date', color, targetValue }) => {
        if (!points || points.length < 2) {
          return <p className="text-[10px] text-slate-500">Balance history will appear here as it's recorded over time.</p>;
        }
        const sorted = [...points].sort((a, b) => a[dateKey].localeCompare(b[dateKey]));
        const values = sorted.map(p => p[valueKey]);
        const allValues = targetValue !== undefined ? [...values, targetValue] : values;
        const min = Math.min(...allValues);
        const max = Math.max(...allValues);
        const range = (max - min) || 1;
        const w = 100, h = 34;
        const pts = sorted.map((p, i) => {
          const x = (i / (sorted.length - 1)) * w;
          const y = h - ((p[valueKey] - min) / range) * h;
          return `${x},${y}`;
        }).join(' ');
        const first = sorted[0];
        const last = sorted[sorted.length - 1];
        const delta = last[valueKey] - first[valueKey];
        const lineColor = color || (delta >= 0 ? '#34d399' : '#fb7185');
        const targetY = targetValue !== undefined ? h - ((targetValue - min) / range) * h : null;
        return (
          <div>
            <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-16" preserveAspectRatio="none">
              {targetValue !== undefined && (
                <line x1="0" y1={targetY} x2={w} y2={targetY} stroke="#64748b" strokeDasharray="2,2" strokeWidth="1" vectorEffect="non-scaling-stroke" />
              )}
              <polyline points={pts} fill="none" stroke={lineColor} strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
            </svg>
            <div className="flex justify-between text-[10px] text-slate-500 mt-1">
              <span>{first[dateKey]}</span>
              <span>{last[dateKey]}</span>
            </div>
          </div>
        );
      };

      const toastStyles = {
        success: { border: 'border-emerald-500/40', bg: 'bg-emerald-950/95', text: 'text-emerald-200', icon: 'check-circle', iconColor: 'text-emerald-400' },
        error: { border: 'border-rose-500/40', bg: 'bg-rose-950/95', text: 'text-rose-200', icon: 'alert-circle', iconColor: 'text-rose-400' },
        warning: { border: 'border-amber-500/40', bg: 'bg-amber-950/95', text: 'text-amber-200', icon: 'alert-triangle', iconColor: 'text-amber-400' },
        info: { border: 'border-blue-500/40', bg: 'bg-blue-950/95', text: 'text-blue-200', icon: 'info', iconColor: 'text-blue-400' }
      };

      const toastContainer = (
        <div className="no-print fixed bottom-4 inset-x-4 sm:inset-x-auto sm:right-4 sm:w-96 z-[100] space-y-2 pointer-events-none">
          {toasts.map((t) => {
            const style = toastStyles[t.type] || toastStyles.info;
            return (
              <div key={t.id} className={`toast-item pointer-events-auto flex items-start gap-2.5 rounded-lg border ${style.border} ${style.bg} ${style.text} px-3.5 py-3 text-xs shadow-2xl`}>
                <i data-lucide={style.icon} className={`w-4 h-4 mt-0.5 shrink-0 ${style.iconColor}`}></i>
                <span className="flex-1">{t.message}</span>
                <button onClick={() => dismissToast(t.id)} className="text-current opacity-60 hover:opacity-100">✕</button>
              </div>
            );
          })}
        </div>
      );

      const confirmModalEl = confirmModal && (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-[110]">
          <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
            <div className="flex items-start gap-3">
              <div className={`p-2 rounded-lg shrink-0 ${confirmModal.danger ? 'bg-rose-500/10 text-rose-400' : 'bg-blue-500/10 text-blue-400'}`}>
                <i data-lucide={confirmModal.danger ? 'alert-triangle' : 'help-circle'} className="w-5 h-5"></i>
              </div>
              <div>
                <h3 className="text-sm font-bold text-slate-100">{confirmModal.title}</h3>
                <p className="text-xs text-slate-400 mt-1">{confirmModal.message}</p>
              </div>
            </div>
            <div className="flex justify-end gap-2">
              <button onClick={handleConfirmModalCancel} className="px-4 py-2 rounded-lg text-xs bg-slate-700 hover:bg-slate-600 text-slate-200">Cancel</button>
              <button onClick={handleConfirmModalConfirm} className={`px-4 py-2 rounded-lg text-xs font-medium text-white shadow-md ${confirmModal.danger ? 'bg-rose-600 hover:bg-rose-500' : 'bg-emerald-600 hover:bg-emerald-500'}`}>{confirmModal.confirmLabel}</button>
            </div>
          </div>
        </div>
      );

      const viewingAccountModalEl = viewingAccount && (() => {
        const linkedDoc = getDocumentForAccount(viewingAccount.id);
        const linkedVal = parseFloat(viewingAccount.linkedAssetValue) || 0;
        const history = accountHistory.filter(h => h.accountId === viewingAccount.id).map(h => ({ date: h.date, value: h.balance }));
        return (
          <div className="no-print fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
            <div className="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-lg shadow-2xl flex flex-col" style={{ maxHeight: '88vh' }}>
              <div className="flex justify-between items-start border-b border-slate-700 px-5 py-4">
                <div className="min-w-0">
                  <h3 className="text-sm font-bold text-slate-100 truncate">{viewingAccount.institution}</h3>
                  <p className="text-[11px] text-slate-500 mt-0.5">{viewingAccount.accountType} · {viewingAccount.category} {viewingAccount.accountNumberMasked ? `· ${viewingAccount.accountNumberMasked}` : ''}</p>
                </div>
                <button onClick={() => setViewingAccount(null)} className="text-slate-400 hover:text-slate-200 text-xs shrink-0">✕ Close</button>
              </div>

              <div className="flex-1 overflow-y-auto px-5 py-4 space-y-4">
                <div className="flex items-end justify-between">
                  <div>
                    <p className="text-[10px] uppercase text-slate-500 tracking-wider">Balance</p>
                    <p className={`text-2xl font-bold ${viewingAccount.category === 'Asset' ? 'text-emerald-400' : 'text-rose-400'}`}>
                      ${viewingAccount.balance.toLocaleString('en-US', { minimumFractionDigits: 2 })}
                    </p>
                  </div>
                  <div className="text-right">
                    <p className="text-[10px] uppercase text-slate-500 tracking-wider">APR</p>
                    <p className="text-sm text-slate-300">{viewingAccount.interestRate}%</p>
                  </div>
                </div>

                {linkedVal > 0 && (
                  <div className="bg-slate-900/50 border border-slate-700 rounded-lg px-3 py-2 text-xs">
                    <span className="text-slate-400">{viewingAccount.linkedAssetLabel || 'Asset Value'}: </span>
                    <span className="text-slate-200 font-medium">${linkedVal.toLocaleString('en-US', { minimumFractionDigits: 0 })}</span>
                    <span className="text-slate-400"> · Equity: </span>
                    <span className={(linkedVal - viewingAccount.balance) >= 0 ? 'text-emerald-400 font-medium' : 'text-rose-400 font-medium'}>${(linkedVal - viewingAccount.balance).toLocaleString('en-US', { minimumFractionDigits: 0 })}</span>
                  </div>
                )}

                <div className="flex items-center justify-between">
                  <p className="text-[10px] uppercase text-slate-500 tracking-wider">Statement</p>
                  <StaleBadge statementDate={viewingAccount.statementDate} />
                </div>

                <div>
                  <p className="text-[10px] uppercase text-slate-500 tracking-wider mb-2 flex items-center gap-1.5">
                    <i data-lucide="line-chart" className="w-3.5 h-3.5 text-blue-400"></i> Balance History
                  </p>
                  <MiniLineChart points={history} />
                </div>

                {viewingAccount.notes && (
                  <div>
                    <p className="text-[10px] uppercase text-slate-500 tracking-wider mb-1">Notes</p>
                    <p className="text-xs text-slate-300 bg-slate-900/50 border border-slate-700 rounded-lg px-3 py-2 whitespace-pre-wrap">{viewingAccount.notes}</p>
                  </div>
                )}

                <div className="flex flex-wrap gap-2 pt-1">
                  {linkedDoc && (
                    <button onClick={() => setViewingDocument(linkedDoc)} className="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-[11px] font-medium transition">
                      <i data-lucide="paperclip" className="w-3.5 h-3.5"></i> View Document
                    </button>
                  )}
                  {viewingAccount.loginUrl && (
                    <a href={viewingAccount.loginUrl} target="_blank" rel="noopener noreferrer" className="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-[11px] font-medium transition">
                      <i data-lucide="external-link" className="w-3.5 h-3.5"></i> Open Statement Portal
                    </a>
                  )}
                </div>
              </div>

              <div className="flex gap-2 border-t border-slate-700 p-4">
                <button onClick={() => setViewingAccount(null)} className="px-4 py-2 rounded-lg text-xs bg-slate-700 hover:bg-slate-600 text-slate-200">Close</button>
                <button
                  onClick={() => { openEditAccount(viewingAccount); setViewingAccount(null); }}
                  className="flex-1 flex items-center justify-center gap-1.5 px-4 py-2 rounded-lg text-xs font-medium text-white shadow-md bg-emerald-600 hover:bg-emerald-500"
                >
                  <i data-lucide="pencil" className="w-3.5 h-3.5"></i> Edit
                </button>
              </div>
            </div>
          </div>
        );
      })();

      const helpModalEl = helpOpen && (
        <div className="no-print fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md shadow-2xl flex flex-col">
            <div className="flex justify-between items-center px-5 pt-4">
              <span className="text-[10px] text-slate-500 font-mono">{helpCardIndex + 1} / {HELP_CARDS.length}</span>
              <button onClick={() => setHelpOpen(false)} className="text-slate-400 hover:text-slate-200 text-xs">✕ Close</button>
            </div>

            <div className="px-6 py-6 text-center space-y-3">
              <div className={`mx-auto w-14 h-14 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center ${HELP_CARDS[helpCardIndex].iconColor}`}>
                <i data-lucide={HELP_CARDS[helpCardIndex].icon} className="w-7 h-7"></i>
              </div>
              <h3 className="text-base font-bold text-slate-100">{HELP_CARDS[helpCardIndex].title}</h3>
              <div className="space-y-2 text-left">
                {HELP_CARDS[helpCardIndex].body.map((line, i) => (
                  <p key={i} className="text-xs text-slate-400 flex items-start gap-2">
                    <i data-lucide="circle" className="w-2 h-2 mt-1.5 shrink-0 text-slate-600"></i>
                    <span>{line}</span>
                  </p>
                ))}
              </div>
            </div>

            <div className="flex items-center justify-center gap-1.5 pb-4">
              {HELP_CARDS.map((_, i) => (
                <button
                  key={i}
                  onClick={() => setHelpCardIndex(i)}
                  className={`h-1.5 rounded-full transition-all ${i === helpCardIndex ? 'w-5 bg-emerald-500' : 'w-1.5 bg-slate-600 hover:bg-slate-500'}`}
                  aria-label={`Go to card ${i + 1}`}
                />
              ))}
            </div>

            <div className="flex gap-2 border-t border-slate-700 p-4">
              <button
                type="button"
                onClick={() => setHelpCardIndex(i => Math.max(0, i - 1))}
                disabled={helpCardIndex === 0}
                className="flex-1 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed text-slate-200 py-2 rounded-lg text-xs font-medium transition"
              >
                Back
              </button>
              {helpCardIndex < HELP_CARDS.length - 1 ? (
                <button

                      <button
                        type="submit"
                        className="px-4 py-2 rounded-lg text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-medium shadow-md"
                      >
                        {pendingParsedData.existingAccountId ? 'Save Changes' : 'Confirm & Save to Vault'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* DOCUMENT VIEWER MODAL */}
            {viewingDocument && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-[70]">
                <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 max-w-3xl w-full space-y-3 shadow-2xl max-h-[90vh] flex flex-col">
                  <div className="flex justify-between items-center gap-3 border-b border-slate-700 pb-3">
                    <h3 className="text-sm font-bold text-slate-100 font-mono truncate min-w-0">{viewingDocument.fileName}</h3>
                    <div className="flex items-center gap-3 shrink-0">
                      <a href={viewingDocument.dataUrl} download={viewingDocument.fileName} className="text-emerald-400 hover:text-emerald-300 text-xs flex items-center gap-1 whitespace-nowrap">
                        <i data-lucide="download" className="w-4 h-4"></i> <span className="hidden sm:inline">Download</span>
                      </a>
                      <button onClick={() => setViewingDocument(null)} className="text-slate-400 hover:text-slate-200 text-xs whitespace-nowrap">✕ Close</button>
                    </div>
                  </div>
                  <div className="flex-1 overflow-auto bg-slate-950 rounded-lg flex items-center justify-center min-h-[50vh]">
                    {viewingDocument.mimeType === 'application/pdf' ? (
                      <iframe src={viewingDocument.dataUrl} title={viewingDocument.fileName} className="w-full h-[70vh] rounded-lg" />
                    ) : viewingDocument.mimeType && viewingDocument.mimeType.startsWith('image/') ? (
                      <img src={viewingDocument.dataUrl} alt={viewingDocument.fileName} className="max-w-full max-h-[70vh] object-contain" />
                    ) : (
                      <p className="text-xs text-slate-400 p-6">Preview not available for this file type — use Download to open it.</p>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* SETTINGS MODAL */}
            {isSettingsOpen && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-md w-full space-y-5 shadow-2xl max-h-[90vh] overflow-y-auto">
                  <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                    <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">
                      <i data-lucide="settings" className="w-5 h-5 text-emerald-400"></i> Vault Settings & Integrations
                    </h3>
                    <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-200 text-xs">✕ Close</button>
                  </div>
                  <p className="text-[10px] text-slate-600 font-mono -mt-3">Build {APP_VERSION}</p>

                  <div className="space-y-4">

                    {/* GROQ API KEY */}
                    <div className="p-4 bg-slate-900/60 rounded-lg border border-slate-700 space-y-2">
                      <h4 className="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="sparkles" className="w-4 h-4 text-purple-400"></i> Groq API Key (Optional)
                      </h4>
                      <p className="text-[11px] text-slate-400">
                        Used for AI-assisted statement reading and classification. Leave blank for 100% offline rule-based parsing.
                      </p>
                      <input
                        type="password"
                        placeholder="gsk_..."
                        value={groqApiKey}
                        onChange={(e) => handleSaveApiKey(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-purple-500 font-mono"
                      />
                      <div className="grid grid-cols-1 gap-2 pt-1">
                        <button
                          type="button"
                          onClick={handleFetchModels}
                          disabled={modelsFetching}
                          className="w-full bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-slate-100 py-1.5 rounded-lg text-[11px] font-medium transition flex items-center justify-center gap-1.5"
                        >
                          <i data-lucide={modelsFetching ? 'loader' : 'refresh-cw'} className="w-3.5 h-3.5"></i>
                          {modelsFetching ? 'Checking your Groq account...' : 'Fetch Models Available To My Key'}
                        </button>
                        {modelsFetchError && <p className="text-[10px] text-rose-400">{modelsFetchError}</p>}
                        {availableModels.length > 0 && (
                          <p className="text-[10px] text-emerald-400">{availableModels.length} models found — pick one below (autocomplete) or type your own.</p>
                        )}
                        <datalist id="groq-model-options">
                          {availableModels.map(m => <option key={m} value={m} />)}
                        </datalist>
                        <div>
                          <label className="text-[10px] text-slate-500 block mb-1">Text model (PDF/CSV parsing, wealth strategy)</label>
                          <input type="text" list="groq-model-options" value={textModel} onChange={(e) => handleSaveTextModel(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-[11px] text-slate-300 font-mono" />
                        </div>
                        <div>
                          <label className="text-[10px] text-slate-500 block mb-1">Vision model (photo/image parsing)</label>
                          <input type="text" list="groq-model-options" value={visionModel} onChange={(e) => handleSaveVisionModel(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-[11px] text-slate-300 font-mono" />
                          {availableModels.some(isLikelyVisionModel) && (
                            <div className="flex flex-wrap gap-1.5 mt-1.5">
                              {availableModels.filter(isLikelyVisionModel).map(m => (
                                <button
                                  type="button"
                                  key={m}
                                  onClick={() => handleSaveVisionModel(m)}
                                  className={`text-[10px] px-2 py-0.5 rounded font-mono border ${visionModel === m ? 'bg-purple-500/20 border-purple-500 text-purple-300' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-purple-500'}`}
                                >
                                  {m}
                                </button>
                              ))}
                            </div>
                          )}
                          {availableModels.length > 0 && !availableModels.some(isLikelyVisionModel) && (
                            <p className="text-[10px] text-amber-400 mt-1">None of your fetched models look vision-capable by name — image parsing may not work on this account. PDF/CSV parsing is unaffected.</p>
                          )}
                        </div>
                        <p className="text-[10px] text-slate-500">Groq's lineup and per-account access changes often — if a model returns a "does not exist / no access" error, fetch the list above and pick a live one.</p>
                      </div>
                    </div>

                    {/* STALENESS THRESHOLD */}
                    <div className="p-4 bg-slate-900/60 rounded-lg border border-slate-700 space-y-2">
                      <h4 className="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="clock" className="w-4 h-4 text-amber-400"></i> Statement Staleness Threshold
                      </h4>
                      <p className="text-[11px] text-slate-400">Flag an account when its statement is older than:</p>
                      <select value={staleDays} onChange={(e) => handleSaveStaleDays(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100">
                        <option value="30">30 days</option>
                        <option value="35">35 days</option>
                        <option value="45">45 days</option>
                        <option value="60">60 days</option>
                        <option value="90">90 days</option>
                      </select>
                    </div>

                    {/* PIN LOCK */}
                    <div className="p-4 bg-slate-900/60 rounded-lg border border-slate-700 space-y-2">
                      <div className="flex items-center justify-between">
                        <h4 className="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                          <i data-lucide="lock" className="w-4 h-4 text-blue-400"></i> PIN Lock
                        </h4>
                        <label className="relative inline-flex items-center cursor-pointer">
                          <input
                            type="checkbox"
                            checked={pinLockEnabled || showPinSetup}
                            onChange={(e) => {
                              if (e.target.checked) {
                                setShowPinSetup(true);
                                setPinSetupError('');
                              } else if (pinLockEnabled) {
                                handleDisablePinLock();
                              } else {
                                setShowPinSetup(false);
                                setNewPinValue('');
                                setConfirmPinValue('');
                                setPinSetupError('');
                              }
                            }}
                            className="sr-only peer"
                          />
                          <div className="w-9 h-5 bg-slate-700 peer-checked:bg-emerald-600 rounded-full transition-colors relative">
                            <div className={`absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform ${(pinLockEnabled || showPinSetup) ? 'translate-x-4' : ''}`}></div>
                          </div>
                        </label>
                      </div>
                      <p className="text-[11px] text-slate-400">
                        Require a PIN to open this app on this device. This is a local access gate, not encryption — it doesn't scramble the data itself, it just keeps the screen locked until unlocked. Off by default.
                      </p>

                      {(pinLockEnabled || showPinSetup) && (
                        <div className="space-y-2 pt-1">
                          {pinLockEnabled && (
                            <p className="text-[11px] text-emerald-400 flex items-center gap-1.5"><i data-lucide="check-circle" className="w-3.5 h-3.5"></i> PIN lock is on. Set or change your PIN below.</p>
                          )}
                          <div className="grid grid-cols-2 gap-2">
                            <input type="password" inputMode="numeric" pattern="[0-9]*" placeholder="New PIN (4-8 digits)" value={newPinValue} onChange={(e) => setNewPinValue(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100" />
                            <input type="password" inputMode="numeric" pattern="[0-9]*" placeholder="Confirm PIN" value={confirmPinValue} onChange={(e) => setConfirmPinValue(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100" />
                          </div>
                          {pinSetupError && <p className="text-[10px] text-rose-400">{pinSetupError}</p>}
                          <button type="button" onClick={handleSavePin} className="w-full bg-slate-700 hover:bg-slate-600 text-slate-100 py-1.5 rounded-lg text-[11px] font-medium transition">
                            {pinHash ? 'Update PIN' : 'Set PIN'}
                          </button>
                        </div>
                      )}
                    </div>

                    {/* EXPORT BACKUP */}
                    <div className="p-4 bg-slate-900/60 rounded-lg border border-slate-700 space-y-2">
                      <h4 className="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="download-cloud" className="w-4 h-4 text-emerald-400"></i> Export Complete Backup
                      </h4>
                      <p className="text-[11px] text-slate-400">
                        Generates a structured `.json` snapshot of all accounts, documents, balances, contacts, budget expenses, net worth history, and executor instructions.
                      </p>
                      <button
                        onClick={exportJsonBackup}
                        className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-xs font-medium transition flex items-center justify-center gap-2"
                      >
                        Download JSON Backup File
                      </button>
                      <p className={`text-[10px] ${isBackupStale ? 'text-amber-400' : 'text-emerald-400'}`}>
                        {backupAgeDays === null ? 'No backup exported yet.' : `Last backup: ${backupAgeDays} day(s) ago${isBackupStale ? ' — consider exporting a fresh one.' : '.'}`}
                      </p>
                    </div>

                    {/* RESTORE BACKUP */}
                    <div className="p-4 bg-slate-900/60 rounded-lg border border-slate-700 space-y-2">
                      <h4 className="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="upload-cloud" className="w-4 h-4 text-blue-400"></i> Restore Vault Backup
                      </h4>
                      <p className="text-[11px] text-slate-400">
                        Upload a previously saved `.json` vault backup file to restore your database on this machine.
                      </p>
                      <label className="w-full bg-slate-700 hover:bg-slate-600 text-slate-100 py-2 rounded-lg text-xs font-medium transition flex items-center justify-center gap-2 cursor-pointer">
                        <input type="file" accept=".json" onChange={handleRestoreBackup} className="hidden" />
                        Select Backup File (.json)
                      </label>
                    </div>

                    {/* DANGER ZONE / PURGE */}
                    <div className="p-4 bg-rose-950/30 rounded-lg border border-rose-900/50 space-y-2">
                      <h4 className="text-xs font-bold text-rose-400 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="alert-octagon" className="w-4 h-4"></i> Danger Zone
                      </h4>
                      <p className="text-[11px] text-slate-400">
                        Wipe all accounts, documents, contacts, debt entries, and expenses stored in this browser's local IndexedDB.
                      </p>
                      <button
                        onClick={handlePurgeDatabase}
                        className="w-full bg-rose-900/60 hover:bg-rose-800 text-rose-200 py-2 rounded-lg text-xs font-medium transition"
                      >
                        Purge Local Database
                      </button>
                    </div>

                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // Defense-in-depth: if ANYTHING throws during render (a bad icon call, a
    // future bug, whatever) this catches it and shows a recoverable message
    // instead of the whole app silently unmounting to a blank/black screen.
    // Inline styles on purpose — this must render correctly even if Tailwind
    // itself is what failed to load.
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(error, info) {
        console.error('Financial Vault crashed:', error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#0f172a', color: '#e2e8f0', padding: '24px', fontFamily: 'sans-serif' }}>
              <div style={{ maxWidth: '420px', textAlign: 'center' }}>
                <div style={{ fontSize: '40px', marginBottom: '12px' }}>⚠️</div>
                <h1 style={{ fontSize: '18px', fontWeight: 'bold', marginBottom: '8px' }}>Something went wrong</h1>
                <p style={{ fontSize: '13px', color: '#94a3b8', marginBottom: '18px', lineHeight: '1.5' }}>
                  The app hit an unexpected error and stopped rendering. Your vault data is untouched — it lives in this browser's storage, not in the memory that just crashed.
                </p>
                <button
                  onClick={() => window.location.reload()}
                  style={{ background: '#10b981', color: 'white', border: 'none', padding: '10px 22px', borderRadius: '8px', fontSize: '13px', fontWeight: '600', cursor: 'pointer' }}
                >
                  Reload
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
    window.__vaultMounted = true;
    try { sessionStorage.removeItem('vault_auto_retry'); } catch (e) { /* ignore */ }
  </script>

  <!-- Service worker registration (plain script, runs independent of the React/Babel bundle above) -->
  <script>
    if ('serviceWorker' in navigator) {
      // When a newly-deployed service worker takes control of this page,
      // auto-reload ONCE so you actually see the update instead of running
      // stale cached code until a second manual refresh.
      let hasReloadedForUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hasReloadedForUpdate) return;
        hasReloadedForUpdate = true;
        if (window.__vaultShowToast) {
          window.__vaultShowToast('info', 'Updating to the latest version...');
          setTimeout(() => window.location.reload(), 700);
        } else {
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
